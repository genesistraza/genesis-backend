<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Sistema | Genesis Traza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{ font-size:13px;background:#F4F6FA;margin:0; }
  /* Barra de titulo */
  .sis-title{ display:flex;align-items:center;gap:12px;background:var(--blue-deep);color:#fff;padding:7px 16px; }
  .sis-title .marca{ font-family:Poppins,sans-serif;font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap; }
  .sis-title .marca b{ color:var(--orange); }
  .sis-title .spacer{ flex:1; }
  .sis-title .info{ font-size:12px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .sis-title .info strong{ color:var(--orange-light); }
  /* Menu horizontal con flyouts */
  .sis-menu{ display:flex;flex-wrap:wrap;gap:2px;background:#fff;border-bottom:2px solid var(--orange);padding:0 12px;position:relative;z-index:30; }
  .sis-mi{ position:relative; }
  .sis-mi > button{ background:none;border:none;font-family:inherit;font-weight:600;font-size:12px;color:var(--ink);padding:9px 13px;cursor:pointer;white-space:nowrap; }
  .sis-mi > button:hover, .sis-mi.open > button{ background:var(--blue-light);color:var(--blue-deep); }
  .sis-mi.activo > button{ color:var(--orange); }
  .sis-fly{ display:none;position:absolute;top:100%;left:0;min-width:240px;background:#fff;border:1px solid var(--line);border-top:2px solid var(--orange);
    box-shadow:0 10px 24px rgba(10,51,105,.14);padding:4px;max-height:75vh;overflow:auto; }
  .sis-mi.open .sis-fly{ display:block; }
  .sis-fly button{ display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;font-size:12px;color:var(--ink);padding:7px 10px;cursor:pointer;border-radius:4px;white-space:nowrap; }
  .sis-fly button:hover{ background:#F3F5F8; }
  .sis-fly button.activo{ background:var(--orange);color:#fff; }
  /* Contenido */
  .sis-main{ max-width:1320px;margin:0 auto;padding:12px 16px 40px; }
  .sis-panel{ background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px; }
  .sis-bar{ display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px; }
  .sis-bar h2{ font-size:14px;font-weight:700;margin:0 8px 0 0;color:var(--blue-deep); }
  .sis-bar .spacer{ flex:1; }
  .sis-bar input, .sis-bar select{ font-size:12px;padding:5px 7px;border:1px solid var(--line);border-radius:5px;font-family:inherit; }
  .b{ font-family:inherit;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:5px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap; }
  .b:hover{ background:#F3F5F8; }
  .b.pri{ background:var(--blue);border-color:var(--blue);color:#fff; }
  .b.pri:hover{ background:var(--blue-deep); }
  .b.nar{ background:var(--orange);border-color:var(--orange);color:#fff; }
  .b.rojo{ color:#C0392B; }
  .b.sm{ font-size:11px;padding:3px 7px; }
  .b:disabled{ opacity:.5;cursor:default; }
  .muted{ color:var(--ink-soft); }
  .msg{ font-size:12px;margin:4px 0; }
  .msg.err{ color:#C0392B; } .msg.ok{ color:#3C7A12; }
  /* Tablas */
  .tw{ overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:6px; }
  table.t{ border-collapse:collapse;width:100%;font-size:12px; }
  table.t th{ position:sticky;top:0;background:#EEF2F8;color:var(--blue-deep);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1; }
  table.t td{ padding:5px 8px;border-bottom:1px solid #F0F2F6;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis; }
  table.t tr:hover td{ background:#FAFBFD; }
  table.t td.num, table.t th.num{ text-align:right; }
  table.t td.acc{ width:1%; }
  table.t tfoot td{ font-weight:700;background:#F7F9FC; }
  .tag{ display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px; }
  .tag.vig{ background:#E6F4D7;color:#3C7A12; } .tag.por{ background:#FFF1DA;color:#A35F00; }
  .tag.ven{ background:#FBE3E0;color:#C0392B; } .tag.sin{ background:#EEF0F4;color:#5B6779; }
  /* Modal */
  .ov{ display:none;position:fixed;inset:0;background:rgba(15,27,45,.45);z-index:100;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto; }
  .ov.open{ display:flex; }
  .md{ background:#fff;border-radius:10px;width:100%;max-width:640px;padding:14px 16px;box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .md h3{ margin:0 0 10px;font-size:14px;color:var(--blue-deep); }
  .fg{ display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 12px; }
  .fg label{ display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:2px; }
  .fg input, .fg select, .fg textarea{ width:100%;box-sizing:border-box;font-size:12.5px;padding:6px 7px;border:1px solid var(--line);border-radius:5px;font-family:inherit; }
  .md .pie{ display:flex;gap:6px;justify-content:flex-end;margin-top:12px; }
  /* Balance de masas */
  .bm-head{ display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 10px;margin-bottom:8px; }
  .bm-head label{ display:block;font-size:10.5px;font-weight:600;color:var(--ink-soft); }
  .bm-head input, .bm-head select{ width:100%;box-sizing:border-box;font-size:12px;padding:5px 6px;border:1px solid var(--line);border-radius:5px;font-family:inherit; }
  .bm-grid input{ width:96px;font-size:12px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;text-align:right; }
  .bm-grid input::placeholder{ color:#8C99A8;font-style:italic; }
  .bm-grid input.bad{ border-color:#C0392B;background:#FDF1EF; }
  .bm-fecha{ font-weight:700;color:var(--blue-deep); }
  .pick-row{ display:grid;grid-template-columns:120px 1fr 160px;gap:6px;padding:6px 8px;border-bottom:1px solid #F0F2F6;cursor:pointer;font-size:12px; }
  .pick-row:hover{ background:var(--blue-light); }
  .aviso{ background:#FFF6E6;border:1px solid #F6D39A;border-radius:6px;padding:6px 9px;font-size:12px;margin-bottom:8px; }
  .cards{ display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px; }
  .card{ background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px; }
  .card h4{ margin:0 0 6px;font-size:13px;color:var(--blue-deep); }
  .card .k{ font-size:20px;font-weight:700;color:var(--ink); }
  .card .l{ font-size:11px;color:var(--ink-soft); }
  .opc-grid{ columns:3 240px;column-gap:16px; }
  .opc-grid .grp{ break-inside:avoid;margin-bottom:8px; }
  .opc-grid .grp b{ display:block;font-size:11.5px;color:var(--blue-deep);margin-bottom:2px; }
  .opc-grid label{ display:block;font-size:12px;padding:1px 0; }
  /* Iconos y guia */
  .ic{ width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none; }
  .sis-mi > button .ic{ margin-right:5px;color:var(--blue); }
  .sis-mi.activo > button .ic{ color:var(--orange); }
  .ayuda{ display:flex;gap:8px;align-items:flex-start;background:#EEF5FD;border:1px solid #D3E4F7;color:#1D3F6E;border-radius:6px;padding:7px 10px;font-size:12px;margin:0 0 10px; }
  .ayuda .ic{ color:var(--blue);margin-top:1px; }
  .pasos{ display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0 0 10px;padding:0; }
  .pasos li{ flex:1 1 180px;display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--ink-soft);background:#FAFBFD; }
  .pasos li b{ display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#E3E8F0;color:var(--ink-soft);font-size:11px;flex:none; }
  .pasos li small{ color:inherit;opacity:.8; }
  .pasos li.actual{ border-color:var(--orange);background:#FFF6EA;color:var(--ink);font-weight:600; }
  .pasos li.actual b{ background:var(--orange);color:#fff; }
  .pasos li.hecho{ color:#3C7A12;border-color:#CFE6B8;background:#F3FAEC; }
  .pasos li.hecho b{ background:#7AB72E;color:#fff; }
  .btn-guardado{ font-size:13px;padding:7px 16px;border-width:2px;min-width:150px; }
  .btn-guardado.vacio{ color:var(--ink-soft); }
  .btn-guardado.pendiente{ background:var(--orange);border-color:var(--orange);color:#fff; }
  .btn-guardado.guardando{ background:#FFF6EA;border-color:var(--orange);color:#A35F00; }
  .btn-guardado.guardado{ background:#E6F4D7;border-color:#7AB72E;color:#2F6A0C; }
  .btn-guardado.error{ background:#FBE3E0;border-color:#C0392B;color:#C0392B; }
  .btn-guardado:disabled{ opacity:1;cursor:default; }
  .estado-guardado{ font-size:12px;font-weight:600;color:var(--ink-soft); }
  .estado-guardado.ok{ color:#3C7A12; } .estado-guardado.err{ color:#C0392B; }
  .bm-grid tr.con-datos td:first-child{ font-weight:700;color:var(--blue-deep); }
  .print-wrap{ position:relative; }
  .print-menu{ display:none;position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 24px rgba(10,51,105,.15);padding:4px;z-index:20;min-width:220px; }
  .print-wrap.open .print-menu{ display:block; }
  .print-menu button{ display:block;width:100%;text-align:left;background:none;border:none;padding:7px 10px;border-radius:5px;cursor:pointer;font-family:inherit; }
  .print-menu button:hover{ background:#F3F5F8; }
  .print-menu b{ display:block;font-size:12px;color:var(--ink); } .print-menu span{ display:block;font-size:10.5px;color:var(--ink-soft); }
  .b .ic{ width:13px;height:13px;vertical-align:-2px; }
  .embebido .sis-title .marca, .embebido .solo-solo{ display:none; }
  .embebido .sis-title{ padding:6px 12px; }
  .embebido .sis-main{ max-width:none; }
  @media (max-width:640px){ .sis-title .info{ display:none; } .sis-main{ padding:10px; } }
</style>
</head>
<body>
<div class="sis-title">
  <span class="marca">Genesis <b>Traza</b></span>
  <span class="spacer"></span>
  <span class="info" id="sisInfo">Cargando…</span>
</div>
<nav class="sis-menu" id="sisMenu"></nav>
<main class="sis-main" id="sisMain"><div class="sis-panel muted">Cargando…</div></main>

<div class="ov" id="ov"><div class="md" id="md"></div></div>

<script src="app.js"></script>
<script>
  var SIS = { me: null, menu: [], entidades: {}, actual: null };
  // Dentro del panel (opcion "Registro"): sin marca propia y "Salir" cierra la sesion de todo el panel.
  var EMBEBIDO = /[?&]embebido=1/.test(location.search) && window.top !== window;
  if(EMBEBIDO){
    document.documentElement.classList.add('embebido');
    var gtLogoutPropio = gtLogout;
    gtLogout = function(r){ try { window.top.gtLogout(r); } catch(e){ gtLogoutPropio(r); } };
  }
  var auth = gtRequireAuth();

  // ---------- iconos (trazos simples, se ven bien en cualquier tamaño) ----------
  var ICONOS = {
    inicio: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
    tablas: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>',
    documentos: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
    usuarios: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c3 .2 5.5 2.3 5.5 5.8"/>',
    form: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/>',
    importar: '<path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v5h16v-5"/>',
    resumen: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    salir: '<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
    buscar: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',
    imprimir: '<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="1.5"/><path d="M7 14h10v7H7z"/>',
    mas: '<path d="M12 5v14M5 12h14"/>',
    borrar: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
    editar: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
    excel: '<path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 20h16"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
    volver: '<path d="M10 6l-6 6 6 6M4 12h16"/>'
  };
  function ic(n){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + (ICONOS[n] || ICONOS.info) + '</svg>'; }
  function icMenu(desc){
    var d = String(desc).toLowerCase();
    if(/inicio/.test(d)) return ic('inicio'); if(/tablas/.test(d)) return ic('tablas'); if(/documento/.test(d)) return ic('documentos');
    if(/usuario/.test(d)) return ic('usuarios'); if(/formulario/.test(d)) return ic('form'); if(/importar/.test(d)) return ic('importar');
    if(/resumen/.test(d)) return ic('resumen'); return ic('info');
  }
  // Una linea de ayuda por pantalla: que debe hacer el usuario ahi.
  var AYUDAS = {
    recicladores: 'Registra aquí a cada reciclador de la asociación. Para agregar uno usa "+ Nuevo"; para corregir, "Editar" en su fila.',
    usuarios: 'Usuarios del servicio (suscriptores) que atiende la asociación. Agrega con "+ Nuevo" o cárgalos por Excel en Importar Datos.',
    microrrutas: 'Crea la microrruta de cada reciclador con "+ Nuevo" y luego entra a "Detalle" para escribir sus recorridos.',
    microrrutas_detalle: 'Recorridos de esta microrruta: dirección y hora de inicio y fin, distancias y frecuencia.',
    aprovechamiento: 'Registra los aforos de aprovechamiento con "+ Nuevo". También puedes cargarlos por Excel en Importar Datos.',
    pago_tarifa: 'Registra cada pago de tarifa con "+ Nuevo".',
    pago_seguridad: 'Registra cada pago de seguridad social con "+ Nuevo".',
    recursos: 'Registra los recursos recibidos con "+ Nuevo".',
    centros: 'Datos de la asociación que salen en las facturas y en los reportes.',
    _catalogo: 'Lista de códigos que se usan en los formularios. Si falta uno, agrégalo con "+ Nuevo".',
    _catalogo_lectura: 'Lista de códigos que se usan en los formularios. Si falta alguno, pídeselo al equipo Genesis.',
    _cargues: 'Cada archivo que se importa aparece aquí. Si subiste un archivo equivocado, bórralo completo con "Borrar cargue".',
    importar: '1) Elige el tipo de archivo · 2) Descarga la plantilla · 3) Llénala en Excel · 4) Súbela con "Importar". Las filas con errores no entran y se listan abajo.',
    documentos_asociaciones: 'Sube cada documento de la asociación con su fecha de vencimiento. El estado avisa cuando está por vencer o vencido.',
    documentos_referencia: 'Normas, formatos y documentos de consulta para todas las asociaciones.',
    resumen_masas: 'Elige el rango de fechas y "Ver" para sumar el material recibido por mes, material o familia.',
    colaboradores: 'Personas que entran al sistema. Crea el usuario, asígnale perfil y asociación; para bloquearlo, ponlo en "Bloqueado" con un mensaje.',
    perfiles: 'Cada perfil define qué opciones del menú ve el usuario. Usa "Opciones" para marcarlas.',
    precios_material: 'Escribe el precio por kilo que paga la asociación por cada material. En el balance de masas se pone solo al escribir los kilos, y en cada compra lo puedes cambiar. Se guarda solo.',
    calendario: 'Días del año con su semana del mes y del año, como se usan en los reportes.'
  };
  function ayuda(clave, txt){ var t = txt || AYUDAS[clave]; return t ? '<div class="ayuda">' + ic('info') + '<span>' + esc(t) + '</span></div>' : ''; }

  // ---------- utilidades ----------
  function esc(v){ return gtEscapeHtml(v === null || v === undefined ? '' : v); }
  function $(id){ return document.getElementById(id); }
  function num(n, d){ return Number(n || 0).toLocaleString('es-CO', { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d }); }
  // 'YYYY-MM-DD' -> 'DD/MM/YYYY' sin pasar por Date (la zona horaria correria el dia).
  function fecha(s){ if(!s) return ''; var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s)); return m ? m[3] + '/' + m[2] + '/' + m[1] : String(s); }
  function api(path, opt){ return gtApiFetch('/sistema' + path, opt); }
  function setMsg(id, txt, tipo){ var el = $(id); if(!el) return; el.className = 'msg ' + (tipo || ''); el.textContent = txt || ''; }
  function abrirModal(html){ $('md').innerHTML = html; $('ov').classList.add('open'); }
  function cerrarModal(){ $('ov').classList.remove('open'); $('md').innerHTML = ''; }
  $('ov').addEventListener('click', function(e){ if(e.target === $('ov')) cerrarModal(); });
  function descargar(contenido, nombre, mime){
    var blob = contenido instanceof Blob ? contenido : new Blob([contenido], { type: mime || 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob); var a = document.createElement('a');
    a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }
  // CSV con ; (Excel en español) y BOM para que abra bien las tildes.
  function exportarCsv(cols, filas, nombre){
    var c = function(v){ v = v === null || v === undefined ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var txt = [cols.map(function(x){ return c(x.label); }).join(';')].concat(filas.map(function(f){ return cols.map(function(x){ return c(x.get(f)); }).join(';'); })).join('\r\n');
    descargar('﻿' + txt, nombre);
  }
  function bajarArchivo(path, nombre){
    fetch(API_BASE + '/sistema' + path, { headers: { 'Authorization': 'Bearer ' + gtGetToken() } }).then(function(r){
      if(!r.ok) return r.json().then(function(d){ throw new Error(d.error || 'No se pudo descargar.'); });
      return r.blob();
    }).then(function(b){ descargar(b, nombre); }).catch(function(e){ alert(e.message); });
  }

  // ---------- arranque ----------
  if(auth){
    Promise.all([api('/me'), api('/menu'), api('/entidades')]).then(function(r){
      if(!r[0].ok){
        $('sisInfo').textContent = '';
        $('sisMain').innerHTML = '<div class="sis-panel"><p class="msg err">' + esc(r[0].data.error || 'No tienes acceso al sistema.') + '</p>' +
          (r[0].data.requiereSuscripcion ? '<button class="b pri" onclick="location.href=\'dashboard.html\'">Ir a mi cuenta y pagos</button> ' : '') +
          '<button class="b" onclick="gtLogout()">Salir</button></div>';
        return;
      }
      SIS.me = r[0].data; SIS.menu = r[1].ok ? r[1].data : []; SIS.entidades = r[2].ok ? r[2].data : {};
      $('sisInfo').innerHTML = esc(SIS.me.nombre) + ' &nbsp;·&nbsp; <strong>[' + esc(SIS.me.etiqueta) + ']</strong>';
      pintarMenu();
      ir(location.hash.slice(1) || 'inicio');
    });
  }

  function pintarMenu(){
    var nav = $('sisMenu');
    // "Salir" no va en este menu: se sale desde el menu lateral del panel.
    nav.innerHTML = SIS.menu.filter(function(m){ return m.clave !== 'salir'; }).map(function(m, i){
      if(!m.submenu.length) return '<div class="sis-mi" data-i="' + i + '"><button type="button" data-ir="' + esc(m.clave) + '">' + icMenu(m.descripcion) + esc(m.descripcion) + '</button></div>';
      return '<div class="sis-mi" data-i="' + i + '"><button type="button" data-abrir="1">' + icMenu(m.descripcion) + esc(m.descripcion) + ' ▾</button><div class="sis-fly">' +
        m.submenu.map(function(s){ return '<button type="button" data-ir="' + esc(s.clave) + '">' + esc(s.descripcion) + '</button>'; }).join('') + '</div></div>';
    }).join('');
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('#sisMenu button');
    var abiertos = document.querySelectorAll('.sis-mi.open');
    if(b && b.getAttribute('data-abrir')){
      var mi = b.parentNode, estaba = mi.classList.contains('open');
      abiertos.forEach(function(x){ x.classList.remove('open'); });
      if(!estaba) mi.classList.add('open');
      return;
    }
    abiertos.forEach(function(x){ x.classList.remove('open'); });
    if(b && b.getAttribute('data-ir') !== null) ir(b.getAttribute('data-ir'));
  });

  function marcarMenu(clave){
    document.querySelectorAll('#sisMenu button[data-ir]').forEach(function(b){ b.classList.toggle('activo', b.getAttribute('data-ir') === clave); });
    document.querySelectorAll('.sis-mi').forEach(function(mi){ mi.classList.toggle('activo', !!mi.querySelector('button.activo')); });
  }

  document.addEventListener('click', function(e){

        return r.blob().then(function(blob){ descargar(blob, nombre); });

  // ---------- Pantalla generica de una tabla (tablas de referencia y formularios) ----------
  var OPC_CACHE = {};
  function opcionesCampo(f){
    var key = f.type === 'select-entity' ? 'e:' + f.entity + ':' + f.labelField : 'c:' + f.categoria;
    if(OPC_CACHE[key]) return Promise.resolve(OPC_CACHE[key]);
    var path = f.type === 'select-entity' ? '/opciones/' + f.entity + '?labelField=' + encodeURIComponent(f.labelField) : '/catalogo-opciones/' + encodeURIComponent(f.categoria);
    return api(path).then(function(r){ OPC_CACHE[key] = r.ok ? r.data : []; return OPC_CACHE[key]; });
  }
  function celda(f, row){
    if(f.type === 'select-entity' || f.type === 'select-catalogo') return row[f.name + '_label'] != null ? row[f.name + '_label'] : (row[f.name] == null ? '' : row[f.name]);
    if(f.type === 'date') return fecha(row[f.name]);
    if(f.type === 'select-fixed' && f.options){ var o = f.options.find(function(x){ return String(x.value) === String(row[f.name]); }); return o ? o.label : (row[f.name] == null ? '' : row[f.name]); }
    return row[f.name] == null ? '' : row[f.name];
  }

  var ENT = { clave: null, filas: [], filtro: '', extra: null };
  function pantallaEntidad(main, clave, extra){
    var e = SIS.entidades[clave];
    ENT = { clave: clave, filas: [], filtro: '', extra: extra || null };
    var t = extra && extra.titulo ? extra.titulo : titulo(clave);
    main.innerHTML = '<div class="sis-panel"><div class="sis-bar"><h2>' + ic(/formulario/i.test(t) ? 'form' : 'tablas') + ' ' + esc(t) + '</h2>' +
      (extra && extra.volver ? '<button class="b" id="entVolver">' + ic('volver') + ' Volver</button>' : '') +
      (SIS.me.todasAsociaciones && e.fields.some(function(f){ return f.name === 'id_centro'; }) ? '<select id="entCentro"><option value="">Todas las asociaciones</option>' + SIS.me.centros.map(function(c){ return '<option value="' + c.id + '">' + esc(c.nombre) + '</option>'; }).join('') + '</select>' : '') +
      '<input id="entBuscar" placeholder="Buscar…" style="width:200px;">' +
      '<span class="spacer"></span><span class="muted" id="entCuenta"></span>' +
      (e.soloLectura ? '<span class="tag sin">Solo lectura</span>' : '<button class="b pri" id="entNuevo">' + ic('mas') + ' Nuevo</button>') +
      '<button class="b" id="entCsv">' + ic('excel') + ' Exportar Excel</button></div>' + ayuda(clave) + '<p id="entMsg" class="msg"></p><div class="tw" id="entTabla"><p class="muted" style="padding:10px;">Cargando…</p></div></div>';
    $('entBuscar').oninput = function(){ ENT.filtro = this.value.trim().toLowerCase(); pintarEntidad(); };
    if($('entNuevo')) $('entNuevo').onclick = function(){ formEntidad(null); };
    if($('entCentro')) $('entCentro').onchange = cargarEntidad;
    if($('entVolver')) $('entVolver').onclick = extra.volver;
    $('entCsv').onclick = function(){
      var cols = e.fields.map(function(f){ return { label: f.label, get: function(r){ return celda(f, r); } }; });
      exportarCsv(cols, filasFiltradas(), clave + '_' + gtTodayCO() + '.csv');
    };
    cargarEntidad();
  }
  function cargarEntidad(){
    var q = '?limit=5000';
    if($('entCentro') && $('entCentro').value) q += '&id_centro=' + $('entCentro').value;
    if(ENT.extra && ENT.extra.query) q += ENT.extra.query;
    var clave = ENT.clave;
    api('/datos/' + clave + q).then(function(r){
      if(ENT.clave !== clave) return;
      if(!r.ok){ $('entTabla').innerHTML = '<p class="msg err" style="padding:10px;">' + esc(r.data.error || 'No se pudo cargar.') + '</p>'; return; }
      ENT.filas = r.data; pintarEntidad();
    });
  }
  function filasFiltradas(){
    var e = SIS.entidades[ENT.clave];
    if(!ENT.filtro) return ENT.filas;
    return ENT.filas.filter(function(r){ return e.fields.some(function(f){ return String(celda(f, r)).toLowerCase().indexOf(ENT.filtro) !== -1; }); });
  }
  function pintarEntidad(){
    var e = SIS.entidades[ENT.clave];
    var filas = filasFiltradas();
    $('entCuenta').textContent = filas.length + ' registro(s)';
    var acciones = !e.soloLectura || (ENT.extra && ENT.extra.accion);
    var html = '<table class="t"><thead><tr>' + (acciones ? '<th></th>' : '') + e.fields.map(function(f){ return '<th' + (f.type === 'decimal' || f.type === 'number' ? ' class="num"' : '') + '>' + esc(f.label) + '</th>'; }).join('') + '</tr></thead><tbody>';
    html += filas.slice(0, 2000).map(function(r){
      return '<tr>' + (acciones ? '<td class="acc">' + (e.soloLectura ? '' : '<button class="b sm" data-ed="' + r.id + '" title="Editar">' + ic('editar') + ' Editar</button> ' + (ENT.clave === 'centros' ? '' : '<button class="b sm rojo" data-del="' + r.id + '" title="Borrar">' + ic('borrar') + '</button>')) +
        (ENT.extra && ENT.extra.accion ? ' <button class="b sm nar" data-acc="' + r.id + '">' + esc(ENT.extra.accion.label) + '</button>' : '') + '</td>' : '') +
        e.fields.map(function(f){ var v = celda(f, r); return '<td' + (f.type === 'decimal' || f.type === 'number' ? ' class="num"' : '') + ' title="' + esc(v) + '">' + esc(v) + '</td>'; }).join('') + '</tr>';
    }).join('');
    html += '</tbody></table>' + (filas.length > 2000 ? '<p class="muted" style="padding:6px;">Se muestran 2.000 de ' + filas.length + '. Usa el buscador o exporta.</p>' : '');
    if(!filas.length) html = '<p class="muted" style="padding:10px;">Sin registros.</p>';
    $('entTabla').innerHTML = html;
    $('entTabla').querySelectorAll('[data-ed]').forEach(function(b){ b.onclick = function(){ formEntidad(ENT.filas.find(function(x){ return String(x.id) === b.getAttribute('data-ed'); })); }; });
    $('entTabla').querySelectorAll('[data-del]').forEach(function(b){ b.onclick = function(){ borrarEntidad(b.getAttribute('data-del')); }; });
    $('entTabla').querySelectorAll('[data-acc]').forEach(function(b){ b.onclick = function(){ ENT.extra.accion.fn(ENT.filas.find(function(x){ return String(x.id) === b.getAttribute('data-acc'); })); }; });
  }
  function formEntidad(row){
    var e = SIS.entidades[ENT.clave];
    var fijos = ENT.extra && ENT.extra.fijos ? ENT.extra.fijos : {};
    var campos = e.fields.filter(function(f){ return !(f.name in fijos); });
    abrirModal('<h3>' + (row ? 'Editar' : 'Nuevo') + ' — ' + esc(ENT.extra && ENT.extra.titulo ? ENT.extra.titulo : titulo(ENT.clave)) + '</h3><div class="fg" id="frm">' +
      campos.map(function(f){
        var v = row ? row[f.name] : '';
        var lab = '<label>' + esc(f.label) + (f.required ? ' *' : '') + '</label>';
        if(f.type === 'select-entity' || f.type === 'select-catalogo' || f.type === 'select-fixed') return '<div>' + lab + '<select data-f="' + f.name + '" data-v="' + esc(v == null ? '' : v) + '"><option value="">Cargando…</option></select></div>';
        var tipo = f.type === 'date' ? 'date' : (f.type === 'number' || f.type === 'decimal') ? 'number' : 'text';
        return '<div>' + lab + '<input type="' + tipo + '"' + (f.type === 'decimal' ? ' step="any"' : '') + ' data-f="' + f.name + '" value="' + esc(v == null ? '' : (f.type === 'date' ? String(v).slice(0, 10) : v)) + '"></div>';
      }).join('') + '</div><p id="frmMsg" class="msg"></p><div class="pie"><button class="b" onclick="cerrarModal()">Cancelar</button><button class="b pri" id="frmOk">Guardar</button></div>');
    campos.forEach(function(f){
      var sel = document.querySelector('#frm select[data-f="' + f.name + '"]'); if(!sel) return;
      var poner = function(ops){
        var v = sel.getAttribute('data-v');
        sel.innerHTML = '<option value="">— Seleccionar —</option>' + ops.map(function(o){ return '<option value="' + esc(o.value) + '"' + (String(o.value) === v ? ' selected' : '') + '>' + esc(o.label) + '</option>'; }).join('');
      };
      if(f.type === 'select-fixed') poner(f.options || []); else opcionesCampo(f).then(poner);
    });
    $('frmOk').onclick = function(){
      var body = Object.assign({}, fijos);
      document.querySelectorAll('#frm [data-f]').forEach(function(el){ body[el.getAttribute('data-f')] = el.value === '' ? null : el.value; });
      $('frmOk').disabled = true;
      api('/datos/' + ENT.clave + (row ? '/' + row.id : ''), { method: row ? 'PUT' : 'POST', body: JSON.stringify(body) }).then(function(r){
        $('frmOk').disabled = false;
        if(!r.ok){ setMsg('frmMsg', r.data.error || 'No se pudo guardar.', 'err'); return; }
        OPC_CACHE = {};
        cerrarModal(); setMsg('entMsg', 'Guardado.', 'ok'); cargarEntidad();
      });
    };
  }
  function borrarEntidad(id){
    if(!confirm('¿Borrar este registro?')) return;

      if(!r.ok){ setMsg('entMsg', r.data.error || 'No se pudo borrar.', 'err'); return; }
      OPC_CACHE = {}; setMsg('entMsg', 'Eliminado.', 'ok'); cargarEntidad();

  }

  // Boton de guardado: vacio | pendiente | guardando | guardado | error

  }

  // Paso actual de la guia (1 fecha, 2 reciclador, 3 kilos, 4 imprimir).

  function abrirPickerBm(){

  function llenarSel(id, filas, fn){ $(id).innerHTML = '<option value="">— Seleccionar —</option>' + filas.map(function(x){ return '<option value="' + x.id + '">' + esc(fn(x)) + '</option>'; }).join(''); }
  function elegirRecBm(id){

  }
  function desdeExistentes(){
    BM.valores = {};
    Object.keys(BM.existentes).forEach(function(id){ var e = BM.existentes[id]; BM.valores[id] = {}; BM_CAMPOS.forEach(function(c){
      var n = Number(e[c]);
      if(c === 'cantidad_rechazo') BM.valores[id][c] = e.rechazo_estimado ? '' : (Number(e.cantidad) > 0 && e[c] !== undefined && e[c] !== null ? String(n) : '');
      else BM.valores[id][c] = n ? String(n) : '';
    }); });
  }
  function cargarDiaBm(){
    tituloBm();
    BM.fecha = $('bmFecha').value;
    if(!BM.sel || !BM.fecha){ BM.existentes = {}; desdeExistentes(); salirAnexo(); pintarGridBm(); pasoBm(); return; }
    var seq = ++BM.seq, rec = BM.sel;
    api('/bm/dia?id_reciclador=' + rec.id + '&fecha=' + BM.fecha).then(function(r){
      if(seq !== BM.seq || rec !== BM.sel) return;
      BM.dirty = false; BM.existentes = {};
      var filas = r.ok ? r.data : [];
      filas.forEach(function(x){ BM.existentes[x.id_tipo_material] = x; });
      desdeExistentes(); salirAnexo();
      var f = filas[0] || {};
      $('bmBodega').value = f.id_bodega || ''; $('bmMacro').value = f.id_macrorruta || ''; $('bmMicro1').value = f.id_microrruta_1 || ''; $('bmMicro2').value = f.id_microrruta_2 || '';
      pintarGridBm(); pasoBm();
      botonBm(filas.length ? 'guardado' : 'vacio');
      estadoBm(filas.length ? '✓ Este día ya tiene ' + filas.length + ' material(es) guardado(s). Puedes corregir o imprimir.' : 'Escribe los kilos de cada material. Se guarda solo.', filas.length ? 'ok' : '');
      var primero = document.querySelector('#bmBody input[data-c="cantidad"]:not([disabled])'); if(primero && !filas.length) primero.focus();
    });
  }
  function n0(v){ return v === undefined || v === null || v === '' ? 0 : Number(v); }
  function problemaFila(id){
    var v = BM.valores[id]; if(!v) return '';
    var q = n0(v.cantidad), p = n0(v.valor), r = n0(v.cantidad_rechazo), s = n0(v.cantidad_nosui);
    if(!(q || p || r || s)) return '';
    if([q, p, r, s].some(function(x){ return isNaN(x) || x < 0; })) return 'no se permiten valores negativos ni texto.';
    if(!(q > 0)) return 'escribe los kilos recibidos del material.';
    if(r > q) return 'el rechazo (' + num(r) + ' kg) no puede ser mayor que los kilos recibidos (' + num(q) + ' kg).';
    if(s > q) return 'el no SUI (' + num(s) + ' kg) no puede ser mayor que los kilos recibidos (' + num(q) + ' kg).';
    return '';
  }
  function nombreMat(id){ var m = BM.mat.find(function(x){ return String(x.id) === String(id); }); return m ? m.desc_tipo_material : 'Material ' + id; }
  function problemasBm(){
    var out = Object.keys(BM.valores).map(function(id){ var p = problemaFila(id); return p ? nombreMat(id) + ': ' + p : ''; }).filter(Boolean);
    var f = $('bmFecha').value;
    if(!f) out.unshift('Elige la fecha.'); else if(f > (SIS.me.hoy || gtTodayCO())) out.unshift('No se puede registrar material con fecha futura.');
    if($('bmMicro1').value && $('bmMicro1').value === $('bmMicro2').value) out.unshift('Microrruta 1 y Microrruta 2 no pueden ser la misma.');
    return out;
  }
  // Precio fijo del material para la asociacion del reciclador elegido (o null).
  function precioFijo(id){ var c = BM.sel && BM.precios && BM.precios[BM.sel.id_centro]; return c && c[id] !== undefined ? c[id] : null; }
  function pintarGridBm(){
    var fam = $('bmFamilia').value || '--Todos los materiales';
    var lista = fam === '--Todos los materiales' ? BM.mat : BM.mat.filter(function(m){ return m.desc_familia === fam; });
    var dis = BM.sel ? '' : ' disabled';
    $('bmBody').innerHTML = lista.map(function(m){
      var v = BM.valores[m.id] || {};
      var c = function(campo, step){ return '<td class="num"><input type="number" min="0" step="' + step + '" data-m="' + m.id + '" data-c="' + campo + '" value="' + esc(v[campo] || '') + '"' + dis + '></td>'; };
      var pf = precioFijo(m.id);
      var cv = c('valor', '0.01'); if(pf !== null) cv = cv.replace('data-c="valor"', 'data-c="valor" placeholder="' + esc(num(pf, 0)) + ' fijo" title="Precio fijo de la asociación. Puedes cambiarlo para esta compra."');
      return '<tr data-m="' + m.id + '"><td>' + esc(m.desc_tipo_material) + '</td>' + c('cantidad', '0.0001') + cv + '<td class="num bm-t"></td>' + c('cantidad_rechazo', '0.0001') + c('cantidad_nosui', '0.0001') + '</tr>';
    }).join('');
    totalesBm();
  }
  function totalesBm(){
    var q = 0, v = 0, r = 0, s = 0;
    Object.keys(BM.valores).forEach(function(id){ var x = BM.valores[id]; q += n0(x.cantidad) || 0; v += (n0(x.cantidad) * n0(x.valor)) || 0; r += (vacioRech(x) ? rechEstimado(x) : n0(x.cantidad_rechazo)) || 0; s += n0(x.cantidad_nosui) || 0; });
    document.querySelectorAll('#bmBody tr').forEach(function(tr){
      var id = tr.getAttribute('data-m'), x = BM.valores[id] || {}, t = n0(x.cantidad) * n0(x.valor), p = problemaFila(id);
      tr.querySelector('.bm-t').textContent = t ? num(t) : '';
      tr.classList.toggle('con-datos', n0(x.cantidad) > 0);
      tr.querySelectorAll('input').forEach(function(i){ i.classList.toggle('bad', !!p); i.title = p; });
      var ir = tr.querySelector('input[data-c="cantidad_rechazo"]'), est = rechEstimado(x);
      if(ir){ ir.placeholder = est ? num(est) + ' est.' : ''; if(!p) ir.title = est ? 'Estimado: ' + String(pctRech()).replace('.', ',') + ' % de los kilos. Escribe el rechazo real si lo pesaste.' : ''; }
    });
    $('bmTq').textContent = num(q); $('bmTv').textContent = num(v); $('bmTr').textContent = num(r); $('bmTn').textContent = num(s);
    $('bmImprimir').disabled = !(BM.sel && (Object.keys(BM.existentes).length || q > 0));
  }
  function salirAnexo(){
    BM.anexo = false; $('bmAviso').style.display = 'none';
    $('bmAnexar').style.display = BM.sel && Object.keys(BM.existentes).length ? '' : 'none';
  }
  function iniciarAnexo(){
    guardarYa();
    var prev = 0; Object.keys(BM.existentes).forEach(function(id){ prev += Number(BM.existentes[id].cantidad) || 0; });
    BM.anexo = true; BM.valores = {}; BM.dirty = false;
    $('bmAvNom').textContent = BM.sel.nombre_completo; $('bmAvPrev').textContent = num(prev);
    $('bmAviso').style.display = ''; $('bmAnexar').style.display = 'none';
    estadoBm('Escribe los kilos de la nueva compra y luego "Sumar esta compra".');
    pintarGridBm();
  }
  function cuerpoBm(materiales){
    return JSON.stringify({ id_reciclador: BM.sel.id, fecha: $('bmFecha').value, materiales: materiales,
      id_bodega: $('bmBodega').value || null, id_macrorruta: $('bmMacro').value || null, id_microrruta_1: $('bmMicro1').value || null, id_microrruta_2: $('bmMicro2').value || null });
  }
  function materialesBm(){
    return Object.keys(BM.valores).map(function(id){ var v = BM.valores[id]; return { id_tipo_material: Number(id), cantidad: n0(v.cantidad), valor: n0(v.valor), cantidad_rechazo: vacioRech(v) ? null : n0(v.cantidad_rechazo), cantidad_nosui: n0(v.cantidad_nosui) }; });
  }
  // Rechazo sin escribir -> se usa el porcentaje fijo de la asociacion (queda marcado como estimado).
  function vacioRech(v){ return v.cantidad_rechazo === undefined || v.cantidad_rechazo === null || v.cantidad_rechazo === ''; }
  function pctRech(){ return BM.sel ? Number(BM.sel.pct_rechazo) || 0 : 0; }
  function rechEstimado(v){ var q = n0(v.cantidad); return vacioRech(v) && q > 0 ? Math.round(q * pctRech()) / 100 : 0; }
  function programarGuardado(ms){ clearTimeout(BM.timer); BM.timer = setTimeout(guardarAuto, ms); }
  function guardarYa(){ if(BM.dirty && !BM.anexo){ clearTimeout(BM.timer); guardarAuto(); } }
  // Guarda el dia completo (el servidor solo toca los materiales que cambiaron).
  function guardarAuto(){
    if(!BM.sel || BM.anexo || !BM.dirty) return Promise.resolve(true);
    var prob = problemasBm();
    if(prob.length){ estadoBm('⚠ ' + prob[0] + ' (no se guarda hasta corregirlo)', 'err'); botonBm('error'); return Promise.resolve(false); }
    if(BM.guardando){ BM.otraVez = true; return Promise.resolve(true); }
    BM.guardando = true; BM.dirty = false;
    var rec = BM.sel, fechaG = $('bmFecha').value;
    estadoBm('Guardando…'); botonBm('guardando');
    return api('/bm/dia', { method: 'POST', body: cuerpoBm(materialesBm()) }).then(function(r){
      BM.guardando = false;
      if(!r.ok){ BM.dirty = true; estadoBm('⚠ ' + (r.data.error || 'No se pudo guardar.'), 'err'); botonBm('error'); return false; }
      if(rec === BM.sel && fechaG === $('bmFecha').value){
        // Lo guardado pasa a ser lo existente (para la factura y para "Anexar otra compra").
        BM.existentes = {}; materialesBm().forEach(function(m){ if(m.cantidad || m.valor || m.cantidad_rechazo || m.cantidad_nosui) BM.existentes[m.id_tipo_material] = m; });

      botonBm(BM.dirty ? 'pendiente' : 'guardado', hora);

      return true;

  }
  function sumarAnexo(){
    var prob = problemasBm();

    if(!mats.length) return estadoBm('Escribe al menos un material de la compra que vas a anexar.', 'err');
    estadoBm('Sumando la compra…');
    api('/bm/anexar', { method: 'POST', body: cuerpoBm(mats) }).then(function(r){
      if(!r.ok) return estadoBm('⚠ ' + (r.data.error || 'No se pudo anexar.'), 'err');

  function borrarDiaBm(){

  // ---- Factura diaria (mismo diseño de Pruebas; sin QR: la cadena de integridad queda en Pruebas) ----
  function imprimirFactura(formato){
    if(!BM.sel) return;
    if(BM.anexo) return alert('Primero suma (o cancela) la compra que estás anexando: la factura muestra el total del día.');
    var win = window.open('', '_blank', 'width=980,height=760');
    if(!win) return alert('El navegador bloqueó la ventana de impresión. Habilita las ventanas emergentes para este sitio.');
    win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Generando…</title></head><body style="font-family:Arial;color:#5B6B7C;padding:24px;">Generando la factura…</body></html>');
    win.document.close();
    clearTimeout(BM.timer);
    var error = function(m){ if(win.closed) return; win.document.open(); win.document.write('<!DOCTYPE html><html><body style="font-family:Arial;color:#C0392B;padding:24px;">' + esc(m) + '</body></html>'); win.document.close(); };
    guardarAuto().then(function(ok){
      if(!ok) return error('No se pudo guardar el día. Corrige lo que aparece en rojo y vuelve a imprimir.');
      return api('/bm/factura', { method: 'POST', body: JSON.stringify({ id_reciclador: BM.sel.id, fecha: $('bmFecha').value }) }).then(function(r){
        if(win.closed) return;
        if(!r.ok) return error(r.data.error || 'No se pudo generar la factura.');
        var b = { carta: facturaCarta, media_carta: facturaMediaCarta, carta_horizontal: facturaHorizontal, tirilla: facturaTirilla };
        win.document.open(); win.document.write((b[formato] || facturaCarta)(r.data)); win.document.close(); win.focus();
        var listo = false, imprimir = function(){ if(listo || win.closed) return; listo = true; win.print(); };
        var pend = 0; win.document.querySelectorAll('img').forEach(function(img){ if(!img.complete){ pend++; img.onload = img.onerror = function(){ if(--pend <= 0) setTimeout(imprimir, 100); }; } });
        setTimeout(imprimir, pend ? 4000 : 350);
      });
    }).catch(function(){ error('No se pudo generar la factura. Intenta de nuevo.'); });
  }
  function cbEsc(v){ return esc(v); }
  function cbDash(v){ return v ? cbEsc(v) : '<span class="muted">—</span>'; }
  function cbNum(n, d){ return num(n, d); }
  function cbMoney(n){ return '$ ' + Number(n || 0).toLocaleString('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
  function cbGenerado(){ return new Date().toLocaleString('es-CO', { timeZone: 'America/Bogota', dateStyle: 'long', timeStyle: 'short' }); }
  function cbBar(){ return '<div class="bar"><span>Vista previa — en el diálogo de impresión elige "Guardar como PDF".</span><button onclick="window.print()">Imprimir / Guardar PDF</button></div><style>@media print{.bar{display:none;}}</style>'; }
  function cbLogo(c, cls){ return c.logoUrl ? '<img class="' + cls + '" src="' + cbEsc(c.logoUrl) + '" alt="">' : '<div class="' + cls + ' mono">' + cbEsc(gtAssocInitials(c.nombre)) + '</div>'; }
  // QR: al escanearlo se abre esta misma factura en el celular (solo la factura, sin cadena de integridad).
  function cbQr(s, px){ return '<div style="text-align:center;flex:none;"><img src="' + s.qrDataUrl + '" alt="QR" style="width:' + px + 'px;height:' + px + 'px;"><div style="font-size:8.5px;color:#5B6B7C;line-height:1.3;">Escanea para ver<br>esta factura<br><b style="color:#0A3369;letter-spacing:1px;">' + cbEsc(s.codigo) + '</b></div></div>'; }
  var CB_PIE = 'Genesis Traza — Factura diaria de material recibido.';
  function facturaCarta(s){
    var body = s.rows.map(function(x){ return '<tr><td class="l">' + cbEsc(x.material) + '</td><td>' + cbNum(x.cantidad) + '</td><td>' + (x.valor ? cbMoney(x.valor) : '') + '</td><td class="b">' + (x.valorTotal ? cbMoney(x.valorTotal) : '') + '</td><td>' + (x.rechazo ? cbNum(x.rechazo) : '') + '</td><td>' + (x.nosui ? cbNum(x.nosui) : '') + '</td></tr>'; }).join('');

      '<select id="rsAgr"><option value="material">Por material</option><option value="familia">Por familia</option><option value="mes">Por mes</option></select><span class="spacer"></span><button class="b" id="rsCsv">' + ic('excel') + ' Exportar Excel</button></div>' + ayuda('resumen_masas') + '<p id="rsMsg" class="msg"></p><div class="tw" id="rsTabla"></div></div>';
    var datos = [], vista = [];
    var pintar = function(){
      var agr = $('rsAgr').value, grupos = {};
      datos.forEach(function(x){
        var k = (SIS.me.todasAsociaciones ? x.asociacion + '|' : '') + (agr === 'material' ? x.mes + '|' + x.material : agr === 'familia' ? x.mes + '|' + (x.familia || '(sin familia)') : x.mes);
        var g = grupos[k] || (grupos[k] = { asociacion: x.asociacion, mes: x.mes, nombre: agr === 'material' ? x.material : agr === 'familia' ? (x.familia || '(sin familia)') : '', kg: 0, valor: 0, rechazo: 0, nosui: 0 });
        g.kg += Number(x.kg); g.valor += Number(x.valor_total); g.rechazo += Number(x.rechazo); g.nosui += Number(x.nosui);
      });
      vista = Object.keys(grupos).map(function(k){ return grupos[k]; });
      var t = { kg: 0, valor: 0, rechazo: 0, nosui: 0 }; vista.forEach(function(g){ t.kg += g.kg; t.valor += g.valor; t.rechazo += g.rechazo; t.nosui += g.nosui; });

        vista.map(function(g){ return '<tr>' + (SIS.me.todasAsociaciones ? '<td>' + esc(g.asociacion) + '</td>' : '') + '<td>' + esc(g.mes) + '</td>' + (agr !== 'mes' ? '<td>' + esc(g.nombre) + '</td>' : '') + '<td class="num">' + num(g.kg) + '</td><td class="num">$ ' + num(g.valor, 0) + '</td><td class="num">' + num(g.rechazo) + '</td><td class="num">' + num(g.nosui) + '</td></tr>'; }).join('') +
        '</tbody><tfoot><tr><td colspan="' + ((SIS.me.todasAsociaciones ? 1 : 0) + (agr !== 'mes' ? 2 : 1)) + '">Total</td><td class="num">' + num(t.kg) + '</td><td class="num">$ ' + num(t.valor, 0) + '</td><td class="num">' + num(t.rechazo) + '</td><td class="num">' + num(t.nosui) + '</td></tr></tfoot></table>' : '<p class="muted" style="padding:10px;">Sin datos en ese rango.</p>';
    };
    var cargar = function(){
      var q = '?desde=' + $('rsDesde').value + '&hasta=' + $('rsHasta').value + ($('rsCentro') && $('rsCentro').value ? '&id_centro=' + $('rsCentro').value : '');
      api('/resumen-masas' + q).then(function(r){ if(!r.ok) return setMsg('rsMsg', r.data.error, 'err'); setMsg('rsMsg', ''); datos = r.data; pintar(); });
    };
    $('rsVer').onclick = cargar; $('rsAgr').onchange = pintar;
    $('rsCsv').onclick = function(){
      exportarCsv([{ label: 'Asociación', get: function(g){ return g.asociacion; } }, { label: 'Mes', get: function(g){ return g.mes; } }, { label: $('rsAgr').value, get: function(g){ return g.nombre; } },
        { label: 'Cantidad (kg)', get: function(g){ return g.kg.toFixed(2).replace('.', ','); } }, { label: 'Valor total', get: function(g){ return g.valor.toFixed(2).replace('.', ','); } },
        { label: 'Rechazo (kg)', get: function(g){ return g.rechazo.toFixed(2).replace('.', ','); } }, { label: 'No SUI (kg)', get: function(g){ return g.nosui.toFixed(2).replace('.', ','); } }], vista, 'resumen_masas.csv');
    };
    cargar();
  };
  PANTALLAS.dashboard = function(main){
    main.innerHTML = '<div class="sis-panel"><div class="sis-bar"><h2>Dashboard</h2><span class="muted" id="dbMes"></span></div><div class="cards" id="dbCards"></div></div>';
    api('/dashboard').then(function(r){
      if(!r.ok){ $('dbCards').innerHTML = '<p class="msg err">' + esc(r.data.error) + '</p>'; return; }
      $('dbMes').textContent = 'Mes ' + r.data.mes;
      $('dbCards').innerHTML = r.data.asociaciones.map(function(a){
        return '<div class="card"><h4>' + esc(a.desc_centro) + '</h4><div class="k">' + num(a.kg_mes) + ' kg</div><div class="l">material recibido este mes · ' + a.dias_mes + ' día(s) con registro</div>' +
          '<div style="margin-top:6px;"><b>$ ' + num(a.valor_mes, 0) + '</b> <span class="l">pagado</span> · <b>' + a.recicladores + '</b> <span class="l">recicladores</span></div>' +
          (/^https:\/\//i.test(a.link_dashboard || '') ? '<div style="margin-top:8px;"><a class="b pri" href="' + esc(a.link_dashboard) + '" target="_blank" rel="noopener">Abrir dashboard ↗</a></div>' : '') + '</div>';
      }).join('') || '<p class="muted">Sin asociaciones.</p>';
    });
  };
  PANTALLAS.sql_archivos = function(main){
    main.innerHTML = '<div class="sis-panel"><div class="sis-bar"><h2>SQL archivos locales</h2></div><p class="muted">Esta herramienta del sistema anterior aún no está disponible en el sistema nuevo.</p></div>';
  };

  // ---------- Perfiles acceso ----------
  PANTALLAS.perfiles = function(main){
    main.innerHTML = '<div class="sis-panel"><div class="sis-bar"><h2>Perfiles acceso</h2><span class="spacer"></span><button class="b pri" id="pfNuevo">' + ic('mas') + ' Nuevo perfil</button></div>' + ayuda('perfiles') + '<p id="pfMsg" class="msg"></p><div class="tw" id="pfTabla"></div></div>';
    var datos = null;
    var cargar = function(){
      api('/admin/perfiles').then(function(r){
        if(!r.ok){ $('pfTabla').innerHTML = '<p class="msg err" style="padding:10px;">' + esc(r.data.error) + '</p>'; return; }
        datos = r.data;
        $('pfTabla').innerHTML = '<table class="t"><thead><tr><th></th><th>Código</th><th>Descripción</th><th>Asociaciones</th><th class="num">Opciones</th><th class="num">Usuarios</th></tr></thead><tbody>' +
          datos.perfiles.map(function(p){ var adm = p.cod_perfil === 'ADM'; return '<tr><td class="acc">' + (adm ? '<span class="muted">Ve todo</span>' : '<button class="b sm pri" data-op="' + p.id + '">Opciones</button> <button class="b sm" data-ed="' + p.id + '">Editar</button>' + (p.id > 25 ? ' <button class="b sm rojo" data-del="' + p.id + '">Borrar</button>' : '')) + '</td>' +
            '<td>' + esc(p.cod_perfil) + '</td><td>' + esc(p.desc_perfil) + '</td><td>' + (p.todas_asociaciones ? 'Todas' : 'Solo la suya') + '</td><td class="num">' + (adm ? 'Todas' : p.opciones.length) + '</td><td class="num">' + p.usuarios + '</td></tr>'; }).join('') + '</tbody></table>';
        $('pfTabla').querySelectorAll('[data-op]').forEach(function(b){ b.onclick = function(){ opcionesPerfil(datos.perfiles.find(function(p){ return String(p.id) === b.getAttribute('data-op'); })); }; });
        $('pfTabla').querySelectorAll('[data-ed]').forEach(function(b){ b.onclick = function(){ formPerfil(datos.perfiles.find(function(p){ return String(p.id) === b.getAttribute('data-ed'); })); }; });
        $('pfTabla').querySelectorAll('[data-del]').forEach(function(b){ b.onclick = function(){
          if(!confirm('¿Borrar este perfil?')) return;
          api('/admin/perfiles/' + b.getAttribute('data-del'), { method: 'DELETE' }).then(function(r){ if(!r.ok) setMsg('pfMsg', r.data.error, 'err'); else cargar(); });
        }; });
      });
    };
    var formPerfil = function(p){
      abrirModal('<h3>' + (p ? 'Editar perfil' : 'Nuevo perfil') + '</h3><div class="fg"><div><label>Código *</label><input id="pfCod" value="' + esc(p ? p.cod_perfil : '') + '"></div><div><label>Descripción *</label><input id="pfDesc" value="' + esc(p ? p.desc_perfil : '') + '"></div>' +
        (SIS.me.esAdm ? '<div><label>Asociaciones que ve</label><select id="pfTodas"><option value="0">Solo la suya</option><option value="1"' + (p && p.todas_asociaciones ? ' selected' : '') + '>Todas (equipo Genesis)</option></select></div>' : '') +
        '</div><p id="pfMMsg" class="msg"></p><div class="pie"><button class="b" onclick="cerrarModal()">Cancelar</button><button class="b pri" id="pfOk">Guardar</button></div>');
      $('pfOk').onclick = function(){
        api('/admin/perfiles' + (p ? '/' + p.id : ''), { method: p ? 'PUT' : 'POST', body: JSON.stringify({ cod_perfil: $('pfCod').value, desc_perfil: $('pfDesc').value, todas_asociaciones: $('pfTodas') ? $('pfTodas').value === '1' : false }) })
          .then(function(r){ if(!r.ok) return setMsg('pfMMsg', r.data.error, 'err'); cerrarModal(); setMsg('pfMsg', 'Guardado.', 'ok'); cargar(); });
      };
    };
    var opcionesPerfil = function(p){
      var grupos = {}; datos.opciones.forEach(function(o){ (grupos[o.menu] = grupos[o.menu] || []).push(o); });
      abrirModal('<h3>Opciones del perfil ' + esc(p.cod_perfil) + '</h3><div class="opc-grid">' + Object.keys(grupos).map(function(g){
        return '<div class="grp"><b>' + esc(g) + '</b>' + grupos[g].map(function(o){ return '<label><input type="checkbox" value="' + o.id + '"' + (p.opciones.indexOf(o.id) !== -1 ? ' checked' : '') + '> ' + esc(o.descripcion) + '</label>'; }).join('') + '</div>';
      }).join('') + '</div><p id="opMsg" class="msg"></p><div class="pie"><button class="b" onclick="cerrarModal()">Cancelar</button><button class="b pri" id="opOk">Guardar opciones</button></div>');
      $('md').style.maxWidth = '900px';
      $('opOk').onclick = function(){
        var ids = Array.from(document.querySelectorAll('.opc-grid input:checked')).map(function(i){ return Number(i.value); });
        api('/admin/perfiles/' + p.id + '/opciones', { method: 'PUT', body: JSON.stringify({ opciones: ids }) }).then(function(r){
          if(!r.ok) return setMsg('opMsg', r.data.error, 'err');
          $('md').style.maxWidth = ''; cerrarModal(); setMsg('pfMsg', 'Opciones guardadas. Los usuarios de ese perfil las verán al recargar.', 'ok'); cargar();
        });
      };
    };
    $('pfNuevo').onclick = function(){ formPerfil(null); };
    cargar();
  };

  // ---------- Items menu ----------
  PANTALLAS.menu = function(main){
    main.innerHTML = '<div class="sis-panel"><div class="sis-bar"><h2>Items menú</h2><span class="muted">Nombre y orden de cada opción del menú.</span></div><p id="mnMsg" class="msg"></p><div class="tw" id="mnTabla"></div></div>';
    var cargar = function(){
      api('/admin/menu').then(function(r){
        if(!r.ok){ $('mnTabla').innerHTML = '<p class="msg err" style="padding:10px;">' + esc(r.data.error) + '</p>'; return; }
        var html = '<table class="t"><thead><tr><th>Menú / opción</th><th class="num">Orden</th><th></th></tr></thead><tbody>';
        r.data.items.forEach(function(it){
          html += '<tr style="background:#F7F9FC;"><td><input data-t="item" data-id="' + it.id + '" class="mnD" value="' + esc(it.descripcion) + '" style="font-weight:700;width:260px;"></td><td class="num"><input class="mnO" type="number" value="' + it.cod_item + '" style="width:70px;"></td><td><button class="b sm" data-g="1">Guardar</button></td></tr>';
          r.data.subs.filter(function(s){ return s.id_menu === it.id; }).forEach(function(s){
            html += '<tr><td style="padding-left:26px;"><input data-t="sub" data-id="' + s.id + '" class="mnD" value="' + esc(s.descripcion) + '" style="width:260px;"> <span class="muted">' + esc(s.clave) + '</span></td><td class="num"><input class="mnO" type="number" value="' + s.cod_item + '" style="width:70px;"></td><td><button class="b sm" data-g="1">Guardar</button></td></tr>';
          });
        });
        $('mnTabla').innerHTML = html + '</tbody></table>';
        $('mnTabla').querySelectorAll('[data-g]').forEach(function(b){ b.onclick = function(){
          var tr = b.closest('tr'), d = tr.querySelector('.mnD');
          api('/admin/menu/' + d.getAttribute('data-t') + '/' + d.getAttribute('data-id'), { method: 'PUT', body: JSON.stringify({ descripcion: d.value, cod_item: tr.querySelector('.mnO').value }) })
            .then(function(r){ setMsg('mnMsg', r.ok ? 'Guardado. Se verá al recargar la página.' : r.data.error, r.ok ? 'ok' : 'err'); });
        }; });
      });
    };
    cargar();
  };

  // ---------- Colaboradores ----------
  PANTALLAS.colaboradores = function(main){
    main.innerHTML = '<div class="sis-panel"><div class="sis-bar"><h2>Colaboradores</h2><input id="coBuscar" placeholder="Buscar…"><span class="spacer"></span><button class="b pri" id="coNuevo">' + ic('mas') + ' Nuevo usuario</button></div>' + ayuda('colaboradores') + '<p id="coMsg" class="msg"></p><div class="tw" id="coTabla"></div></div>';
    var filas = [], perfiles = [];
    var pintar = function(){
      var q = $('coBuscar').value.trim().toLowerCase();
      var l = filas.filter(function(x){ return !q || [x.full_name, x.email, x.asociacion, x.cod_perfil].join(' ').toLowerCase().indexOf(q) !== -1; });
      $('coTabla').innerHTML = '<table class="t"><thead><tr><th></th><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Perfil</th><th>Asociación</th><th>Estado</th><th>Mensaje al ingresar</th><th>Creado</th></tr></thead><tbody>' +
        l.map(function(x){ var editable = x.cod_perfil !== 'ADM'; return '<tr><td class="acc">' + (editable ? '<button class="b sm" data-ed="' + x.id + '">Editar</button>' : '') + '</td><td>' + esc(x.full_name) + '</td><td>' + esc(x.email) + '</td><td>' + esc(x.phone || '') + '</td><td>' + esc(x.cod_perfil || '') + '</td><td>' + esc(x.asociacion || '') + '</td>' +
          '<td>' + (x.activo ? '<span class="tag vig">Activo</span>' : '<span class="tag ven">Bloqueado</span>') + '</td><td title="' + esc(x.msg_login_desactivado || '') + '">' + esc(x.msg_login_desactivado || '') + '</td><td>' + esc(x.creado) + '</td></tr>'; }).join('') + '</tbody></table>';
      $('coTabla').querySelectorAll('[data-ed]').forEach(function(b){ b.onclick = function(){ formColab(filas.find(function(x){ return String(x.id) === b.getAttribute('data-ed'); })); }; });
    };
    var cargar = function(){
      Promise.all([api('/admin/colaboradores'), api('/admin/perfiles-asignables')]).then(function(r){
        if(!r[0].ok){ $('coTabla').innerHTML = '<p class="msg err" style="padding:10px;">' + esc(r[0].data.error) + '</p>'; return; }
        filas = r[0].data;
        perfiles = r[1].ok ? r[1].data : [];
        pintar();
      });
    };
    var formColab = function(x){
      abrirModal('<h3>' + (x ? 'Editar usuario' : 'Nuevo usuario') + '</h3><div class="fg">' +
        '<div><label>Nombre *</label><input id="coNom" value="' + esc(x ? x.full_name : '') + '"></div>' +
        '<div><label>Correo *</label><input id="coMail" type="email" value="' + esc(x ? x.email : '') + '"></div>' +
        '<div><label>Teléfono</label><input id="coTel" value="' + esc(x ? x.phone || '' : '') + '"></div>' +
        '<div><label>Perfil *</label><select id="coPerf">' + perfiles.map(function(p){ return '<option value="' + p.id + '"' + (x && x.id_perfil === p.id ? ' selected' : '') + ' data-todas="' + (p.todas_asociaciones ? 1 : 0) + '">' + esc(p.cod_perfil + ' — ' + p.desc_perfil) + '</option>'; }).join('') + '</select></div>' +
        '<div id="coCenBox"><label>Asociación *</label><select id="coCen">' + SIS.me.centros.map(function(c){ return '<option value="' + c.id + '"' + (x && x.id_centro === c.id ? ' selected' : '') + '>' + esc(c.nombre) + '</option>'; }).join('') + '</select></div>' +
        '<div><label>' + (x ? 'Nueva contraseña (vacío = no cambiar)' : 'Contraseña inicial * (mín. 8)') + '</label><input id="coPwd" type="password" autocomplete="new-password"></div>' +
        '<div><label>Estado</label><select id="coAct"><option value="true">Activo</option><option value="false"' + (x && !x.activo ? ' selected' : '') + '>Bloqueado</option></select></div>' +
        '<div style="grid-column:1/-1;"><label>Mensaje al intentar ingresar (cuando está bloqueado; p. ej. recordatorio de pago)</label><textarea id="coMsgL" rows="2">' + esc(x ? x.msg_login_desactivado || '' : '') + '</textarea></div>' +
        '</div><p id="coMMsg" class="msg"></p><div class="pie"><button class="b" onclick="cerrarModal()">Cancelar</button><button class="b pri" id="coOk">Guardar</button></div>');
      var verCentro = function(){ var o = $('coPerf').selectedOptions[0]; $('coCenBox').style.display = o && o.getAttribute('data-todas') === '1' ? 'none' : ''; };
      $('coPerf').onchange = verCentro; verCentro();
      $('coOk').onclick = function(){
        var body = { full_name: $('coNom').value, email: $('coMail').value, phone: $('coTel').value, id_perfil: Number($('coPerf').value), id_centro: Number($('coCen').value),
          activo: $('coAct').value === 'true', msg_login_desactivado: $('coMsgL').value };
        if($('coPwd').value) body.password = $('coPwd').value;
        api('/admin/colaboradores' + (x ? '/' + x.id : ''), { method: x ? 'PUT' : 'POST', body: JSON.stringify(body) }).then(function(r){
          if(!r.ok) return setMsg('coMMsg', r.data.error, 'err');
          cerrarModal(); setMsg('coMsg', 'Guardado.', 'ok'); cargar();
        });
      };
    };
    $('coBuscar').oninput = pintar;
    $('coNuevo').onclick = function(){ formColab(null); };
    cargar();
  };

  // ---------- Cambio password ----------
  PANTALLAS.cambio_password = function(main){
    main.innerHTML = '<div class="sis-panel" style="max-width:420px;"><div class="sis-bar"><h2>Cambio password</h2></div><div class="fg" style="grid-template-columns:1fr;">' +
      '<div><label>Contraseña actual</label><input type="password" id="pwA" autocomplete="current-password"></div><div><label>Nueva contraseña (mín. 8)</label><input type="password" id="pwN" autocomplete="new-password"></div>' +
      '<div><label>Repite la nueva</label><input type="password" id="pwR" autocomplete="new-password"></div></div><p id="pwMsg" class="msg"></p><button class="b pri" id="pwOk">Cambiar contraseña</button></div>';
    $('pwOk').onclick = function(){
      if($('pwN').value !== $('pwR').value) return setMsg('pwMsg', 'Las contraseñas nuevas no coinciden.', 'err');
      api('/password', { method: 'POST', body: JSON.stringify({ actual: $('pwA').value, nueva: $('pwN').value }) }).then(function(r){
        setMsg('pwMsg', r.ok ? 'Contraseña actualizada.' : r.data.error, r.ok ? 'ok' : 'err');
        if(r.ok) ['pwA', 'pwN', 'pwR'].forEach(function(id){ $(id).value = ''; });
      });
    };
  };
</script>
</body>
</html>
