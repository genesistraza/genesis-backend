<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pruebas — Trazabilidad nativa | Genesis Traza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{ font-size:13px; }
  .pruebas-shell{ max-width:1280px;margin:0 auto;padding:12px 18px 30px; }
  .pruebas-topbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line);
  }
  .pruebas-topbar h1{ margin:0;font-size:15px;font-weight:700;white-space:nowrap; }
  .pruebas-topbar select{ font-size:12.5px;padding:5px 8px;height:auto; }
  .pruebas-topbar .spacer{ flex:1; }
  .pruebas-topbar a.btn{ font-size:12px;padding:5px 10px; }
  .pruebas-hint{ margin:0 0 10px;color:var(--ink-soft);font-size:11.5px; }
  .pruebas-hint.asociacion{ color:var(--orange);font-weight:600; }
  .pm-vista{ display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden; }
  .pm-vista button{
    border:none;background:#fff;color:var(--ink-soft);font-family:inherit;font-weight:600;
    font-size:11.5px;padding:6px 11px;cursor:pointer;
  }
  .pm-vista button.active{ background:var(--orange);color:#fff; }
  .pm-bar{ display:flex;flex-wrap:wrap;gap:3px;margin-bottom:2px;position:relative;z-index:20; }
  .pm-item{ position:relative;z-index:1; }
  .pm-item.open{ z-index:50; }
  .pm-title{
    display:block;background:#fff;border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-weight:700;font-size:11px;padding:7px 12px;cursor:pointer;
    border-radius:7px 7px 0 0;white-space:nowrap;
  }
  .pm-title:hover{ background:#F3F5F8; }
  .pm-item.has-active .pm-title{ color:var(--orange);border-color:var(--orange); }
  .pm-item.open .pm-title{ background:var(--orange);color:#fff;border-color:var(--orange); }
  .pm-dropdown{
    display:none;position:absolute;top:calc(100% + 3px);left:0;min-width:230px;
    background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:0 8px 22px rgba(10,51,105,.12);padding:5px;
  }
  .pm-item.open .pm-dropdown{ display:block; }
  .pm-dropdown a{
    display:block;padding:7px 10px;font-size:12px;color:var(--ink);text-decoration:none;
    border-radius:5px;cursor:pointer;white-space:nowrap;
  }
  .pm-dropdown a:hover{ background:#F3F5F8; }
  .pm-dropdown a.active{ background:var(--orange);color:#fff; }
  .pruebas-menu-row{ border-bottom:1px solid var(--line);margin-bottom:8px;padding-bottom:0; }
  .pruebas-shell .panel{ padding:12px 14px;border-radius:10px;margin-bottom:14px; }
  .pruebas-toolbar{ display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px; }
  .pruebas-toolbar .spacer{ flex:1; }
  .pruebas-toolbar h2{ font-size:13px;font-weight:700; }
  .pruebas-toolbar .btn{ font-size:11.5px;padding:5px 10px; }
  .pruebas-toolbar input[type="date"]{ font-size:11.5px;padding:4px 6px;height:auto;width:128px; }
  .pruebas-toolbar .sep{ font-size:11px;color:var(--ink-soft); }
  .pruebas-badge{ font-size:11px;color:var(--ink-soft);background:var(--bg-soft, #F3F5F8);border-radius:20px;padding:3px 10px; }
  .pruebas-msg{ font-size:11.5px;margin-top:6px; }
  .pruebas-shell table.data-table th{ padding:6px 9px;font-size:10.5px; }
  .pruebas-shell table.data-table td{ padding:6px 9px;font-size:12px; }
  .pruebas-shell .form-field{ margin-bottom:8px; }
  .pruebas-shell .form-field label{ font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-soft); }
  @media print{
    body *{ visibility:hidden; }
    .no-print{ display:none !important; }
  }
</style>
</head>
<body>

<div id="gtPageLoader">
  <div class="gt-loader-mark">
    <div class="gt-spinner"></div>
    <span>Cargando…</span>
  </div>
</div>

<div class="pruebas-shell">
  <div class="pruebas-topbar no-print">
    <h1>Trazabilidad — Pruebas</h1>
    <div class="pm-vista" id="pruebasVistaToggle">
      <button type="button" data-vista="administrador" onclick="onPruebasVistaChange('administrador')">Administrador</button>
      <button type="button" data-vista="asociacion" onclick="onPruebasVistaChange('asociacion')">Asociación</button>
    </div>
    <span class="spacer"></span>
    <a class="btn" href="admin-1b98a0bb3a.html">← Panel</a>
  </div>
  <div class="pm-bar pruebas-menu-row no-print" id="pruebasMenuBar"></div>
  <p class="pruebas-hint no-print" id="pruebasVistaHint"></p>

  <div class="panel" id="pruebasBalanceMasasEnv" style="display:none;">
    <div class="pruebas-toolbar no-print">
      <h2>Balance de Masas — Reporte de periodo</h2>
      <span class="pruebas-badge" title="Mismo formato de columnas que recibe la Superintendencia en el sistema de trazabilidad original">formato Superintendencia</span>
      <span class="spacer"></span>
      <span class="sep">Desde</span>
      <input type="date" id="bmExportDesde">
      <span class="sep">Hasta</span>
      <input type="date" id="bmExportHasta">
      <button type="button" class="btn" onclick="exportBmReporte('xlsx')">Excel</button>
      <button type="button" class="btn" onclick="exportBmReporte('csv-comma')">CSV</button>
      <button type="button" class="btn" onclick="exportBmReporte('csv-semicolon')">CSV (;)</button>
    </div>

    <div class="pruebas-toolbar no-print" style="border-top:1px solid var(--line);padding-top:8px;margin-top:2px;">
      <h2>Captura diaria</h2>
    </div>
    <div class="form-field no-print" style="max-width:380px;">
      <label>Buscar reciclador (nombre o cédula)</label>
      <input id="bmBuscarReciclador" placeholder="Escribe para buscar…" oninput="onBmBuscarRecicladorInput()" autocomplete="off">
    </div>
    <div id="bmRecicladorResultados" class="table-scroll no-print" style="max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;display:none;"></div>

    <div id="bmRecicladorSeleccionado" style="display:none;margin-top:10px;">
      <div class="form-grid">
        <div class="form-field"><label>Nombre</label><input id="bmNombre" disabled></div>
        <div class="form-field"><label>Cédula</label><input id="bmCedula" disabled></div>
        <div class="form-field"><label>Tipo vehículo</label><input id="bmTipoVehiculo" disabled></div>
        <div class="form-field"><label>Placa</label><input id="bmPlaca" disabled></div>
        <div class="form-field"><label>Bodega (NUECA)</label><select id="bmBodega"><option value="">— Ninguna —</option></select></div>
        <div class="form-field"><label>Zona (NUMACRO)</label><select id="bmNumacro"><option value="">— Ninguna —</option></select></div>
        <div class="form-field"><label>Fecha</label><input type="date" id="bmFecha" onchange="loadBmDia()"></div>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;">
        <h2 style="margin:0;font-size:13px;font-weight:700;">Materiales del día</h2>
        <select id="bmFamiliaFilter" class="period-value-select no-print" onchange="renderBmGrid()" style="max-width:220px;"></select>
      </div>
      <div class="table-scroll" style="margin-top:6px;">
        <table class="data-table">
          <thead><tr><th>Material</th><th>Cantidad (kg)</th><th>Valor</th><th>Cant. rechazo</th><th>Cant. no SUI</th></tr></thead>
          <tbody id="bmGridBody"></tbody>
        </table>
      </div>
      <div class="no-print" style="margin-top:10px;display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="saveBmDia()">Guardar</button>
        <button class="btn" onclick="printBmGrid()">Generar factura (PDF)</button>
      </div>
      <p class="pruebas-msg no-print" id="bmSaveMsg"></p>
    </div>
  </div>

  <div class="panel" id="pruebasGenericView">
    <div class="pruebas-toolbar no-print">
      <h2 id="pruebasEntityTitle">Elige un módulo</h2>
      <span class="pruebas-badge" id="pruebasRowCount"></span>
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary" id="pruebasNewBtn" onclick="openPruebasFormModal()">Nuevo registro</button>
      <button type="button" class="btn" id="pruebasImportBtn" onclick="document.getElementById('pruebasImportInput').click()">Importar</button>
      <input type="file" id="pruebasImportInput" accept=".xlsx,.xls,.csv" style="display:none;" onchange="onPruebasImportFile(this)">
      <button type="button" class="btn" onclick="downloadPruebasTemplate()">Plantilla</button>
      <button type="button" class="btn" onclick="exportPruebasExcel()">Exportar Excel</button>
      <button type="button" class="btn" onclick="exportPruebasCsv()">Exportar CSV</button>
    </div>
    <p class="pruebas-msg no-print" id="pruebasImportMsg"></p>
    <div class="table-scroll">
      <table class="data-table">
        <thead id="pruebasTableHead"></thead>
        <tbody id="pruebasTableBody"><tr><td class="empty-row">Cargando…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal: formulario dinamico del modulo Pruebas -->
<div class="modal-overlay" id="pruebasFormModalOverlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closePruebasFormModal()">&times;</button>
    <div class="modal-scroll">
      <h3 id="pruebasFormModalTitle">Nuevo registro</h3>
      <input type="hidden" id="pruebasFormId">
      <div class="form-grid" id="pruebasFormFields" style="margin-top:18px;"></div>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="savePruebasRecord()">Guardar</button>
      <p id="pruebasFormError" style="display:none;color:#C0392B;font-size:13px;margin-top:10px;"></p>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  var session = gtRequireAuth(['pro']);

  // Agrupa los modulos en el desplegable para que sea facil de recorrer (mismo criterio que
  // el sistema de trazabilidad original: catalogos, recicladores, operacion, usuarios/cobro, PQR).
  var ENTITY_GROUPS = [
    { label: 'Catálogos y estructura', keys: ['centros', 'bodegas', 'localidades', 'numacros', 'tipos_material'] },
    { label: 'Recicladores y formalización', keys: ['recicladores', 'formalizacion_fases', 'seguridad_social'] },
    { label: 'Operación diaria', keys: ['balance_masas', 'macrorrutas', 'microrrutas', 'microrrutas_detalle'] },
    { label: 'Usuarios y aprovechamiento', keys: ['usuarios', 'aprovechamiento', 'recursos'] },
    { label: 'Comercial y pagos', keys: ['ventas', 'pago_seguridad', 'pago_tarifa'] },
    { label: 'Atención al usuario', keys: ['pqr'] }
  ];

  var ENTITY_HINTS = {
    centros: 'Datos de la asociación/prestador: código, nombre y su registro RUP/ECA.',
    bodegas: 'Sitios de acopio (NUECA) donde entra el material recolectado.',
    localidades: 'Localidades de Bogotá usadas para ubicar numacros y usuarios.',
    numacros: 'Zonas operativas (NUMACRO) dentro de cada centro.',
    tipos_material: 'Catálogo de materiales aprovechables y su familia.',
    recicladores: 'Base de datos de recicladores de oficio del centro.',
    balance_masas: 'Registro diario de material recibido por reciclador (tiene su propio entorno).',
    macrorrutas: 'Macrorrutas de recolección — Balance de Masas se asocia a una para calcular el DINC.',
    formalizacion_fases: 'Checklist de las 8 fases de formalización del Decreto 596/2016.',
    pqr: 'Registro de peticiones, quejas y reclamos de usuarios.',
    seguridad_social: 'Afiliación a EPS/ARL y aportes a BEPS de cada reciclador (Decreto 271/2026).',
    microrrutas: 'Microrrutas de recolección asignadas a un reciclador.',
    microrrutas_detalle: 'Detalle operativo (horarios, distancias, tipo de barrido) de cada microrruta.',
    usuarios: 'Base de usuarios del servicio (SUI): NUIS/NUID, uso, tipo, ubicación.',
    aprovechamiento: 'Toneladas de aprovechamiento por usuario y periodo, para el cobro tarifario.',
    recursos: 'Recursos/operadores asociados al NUAP.',
    ventas: 'Ventas de material a compradores, con IVA y origen del residuo.',
    pago_seguridad: 'Pagos hechos a recicladores por concepto de seguridad social.',
    pago_tarifa: 'Pagos hechos a recicladores por concepto de tarifa de aprovechamiento.'
  };

  function initPruebasPage(){
    var loader = document.getElementById('gtPageLoader');
    gtApiFetch('/trazabilidad/centros').then(function(res){
      if(res.ok){
        var found = res.data.find(function(c){ return c.cod_centro === 'DEMO-01'; });
        if(found) pruebasDemoCentro = { id: found.id, label: found.desc_centro };
      }
      if(loader) loader.classList.add('hidden');
      loadPruebasTab();
    });
  }

  // ---- Vista: Administrador (Genesis Traza, todo) vs Asociacion (cliente, solo su centro demo) ----
  // Es una simulacion visual dentro del sandbox (el rol real de backend sigue siendo "pro" para
  // poder hacer las pruebas); sirve para ver como se veria cada modulo desde la otra perspectiva.
  var pruebasVista = 'administrador';
  var pruebasDemoCentro = null; // {id, label}, se resuelve una vez al cargar la pagina
  var pruebasRecicladorCentroMap = null;
  var pruebasMicrorrutaCentroMap = null;

  function onPruebasVistaChange(vista){
    pruebasVista = vista;
    document.querySelectorAll('#pruebasVistaToggle button').forEach(function(b){
      b.classList.toggle('active', b.dataset.vista === vista);
    });
    updateVistaHint();
    if(pruebasCurrentEntity === 'balance_masas'){ initBmEnv(); }
    else if(pruebasCurrentEntity){ fetchAndRenderPruebasTable(); }
  }

  function updateVistaHint(){
    document.querySelectorAll('#pruebasVistaToggle button').forEach(function(b){
      b.classList.toggle('active', b.dataset.vista === pruebasVista);
    });
    var hint = document.getElementById('pruebasVistaHint');
    hint.style.display = 'block';
    if(pruebasVista === 'asociacion'){
      hint.className = 'pruebas-hint asociacion';
      hint.textContent = pruebasDemoCentro
        ? 'Viendo como cliente de "' + pruebasDemoCentro.label + '" — solo sus propios datos (ficticios, de prueba).'
        : 'No hay una asociación demo cargada todavía (corre "npm run seed:demo" en el backend).';
    } else {
      hint.className = 'pruebas-hint administrador';
      hint.textContent = 'Viendo como Genesis Traza: todas las asociaciones, sin restricciones.';
    }
  }

  function rowMatchesVista(entityKey, row){
    if(pruebasVista !== 'asociacion') return true;
    if(!pruebasDemoCentro) return false;
    if(entityKey === 'localidades' || entityKey === 'tipos_material') return true;
    if(entityKey === 'centros') return row.id === pruebasDemoCentro.id;
    if(entityKey === 'seguridad_social') return pruebasRecicladorCentroMap && pruebasRecicladorCentroMap[row.id_reciclador] === pruebasDemoCentro.id;
    if(entityKey === 'microrrutas_detalle') return pruebasMicrorrutaCentroMap && pruebasMicrorrutaCentroMap[row.id_formulario_microrruta] === pruebasDemoCentro.id;
    return row.id_centro === pruebasDemoCentro.id;
  }

  function ensureVistaLookups(entityKey){
    if(pruebasVista !== 'asociacion') return Promise.resolve();
    if(entityKey === 'seguridad_social' && !pruebasRecicladorCentroMap){
      return gtApiFetch('/trazabilidad/recicladores').then(function(res){
        pruebasRecicladorCentroMap = {};
        (res.ok ? res.data : []).forEach(function(r){ pruebasRecicladorCentroMap[r.id] = r.id_centro; });
      });
    }
    if(entityKey === 'microrrutas_detalle' && !pruebasMicrorrutaCentroMap){
      return gtApiFetch('/trazabilidad/microrrutas').then(function(res){
        pruebasMicrorrutaCentroMap = {};
        (res.ok ? res.data : []).forEach(function(r){ pruebasMicrorrutaCentroMap[r.id] = r.id_centro; });
      });
    }
    return Promise.resolve();
  }

  // ---- Pruebas: trazabilidad nativa (sandbox, tablas tz_*) ----
  var pruebasEntities = null;
  var pruebasCurrentEntity = null;
  var pruebasCurrentRows = [];
  var pruebasOptionsCache = {};

  function loadPruebasTab(){
    updateVistaHint();
    if(pruebasEntities){ renderPruebasEntitySelect(); return; }
    gtApiFetch('/trazabilidad/entities').then(function(res){
      if(!res.ok) return;
      pruebasEntities = res.data;
      renderPruebasEntitySelect();
    });
  }

  // Barra horizontal de titulos (uno por categoria) con un desplegable vertical debajo de cada
  // uno — igual al menu del sistema de trazabilidad original, en vez de un <select> nativo.
  function renderPruebasEntitySelect(){
    var bar = document.getElementById('pruebasMenuBar');
    bar.innerHTML = '';
    var firstKey = null;
    ENTITY_GROUPS.forEach(function(group){
      var keys = group.keys.filter(function(k){ return pruebasEntities[k]; });
      if(keys.length === 0) return;
      if(!firstKey) firstKey = keys[0];

      var item = document.createElement('div');
      item.className = 'pm-item';

      var title = document.createElement('button');
      title.type = 'button';
      title.className = 'pm-title';
      title.textContent = group.label;
      title.addEventListener('click', function(e){
        e.stopPropagation();
        var wasOpen = item.classList.contains('open');
        closeAllPmDropdowns();
        if(!wasOpen) item.classList.add('open');
      });

      var dropdown = document.createElement('div');
      dropdown.className = 'pm-dropdown';
      keys.forEach(function(key){
        var link = document.createElement('a');
        link.textContent = pruebasEntities[key].label;
        link.title = ENTITY_HINTS[key] || '';
        link.dataset.entity = key;
        link.addEventListener('click', function(){
          selectPruebasEntity(key);
          closeAllPmDropdowns();
        });
        dropdown.appendChild(link);
      });

      item.appendChild(title);
      item.appendChild(dropdown);
      bar.appendChild(item);
    });

    pruebasCurrentEntity = pruebasCurrentEntity || firstKey;
    selectPruebasEntity(pruebasCurrentEntity);
  }

  function closeAllPmDropdowns(){
    document.querySelectorAll('.pm-item.open').forEach(function(i){ i.classList.remove('open'); });
  }
  document.addEventListener('click', closeAllPmDropdowns);

  function updatePmMenuActiveState(){
    document.querySelectorAll('.pm-item').forEach(function(item){
      var hasActive = false;
      item.querySelectorAll('a').forEach(function(a){
        var isActive = a.dataset.entity === pruebasCurrentEntity;
        a.classList.toggle('active', isActive);
        if(isActive) hasActive = true;
      });
      item.classList.toggle('has-active', hasActive);
    });
  }

  function selectPruebasEntity(key){
    pruebasCurrentEntity = key;
    updatePmMenuActiveState();
    var isBalanceMasas = key === 'balance_masas';
    document.getElementById('pruebasBalanceMasasEnv').style.display = isBalanceMasas ? 'block' : 'none';
    document.getElementById('pruebasGenericView').style.display = isBalanceMasas ? 'none' : 'block';
    if(isBalanceMasas){ initBmEnv(); return; }
    fetchAndRenderPruebasTable();
  }

  function fetchAndRenderPruebasTable(){
    var entity = pruebasEntities[pruebasCurrentEntity];
    document.getElementById('pruebasEntityTitle').textContent = entity.label;
    document.getElementById('pruebasImportMsg').textContent = '';

    var isCentrosAsCliente = pruebasCurrentEntity === 'centros' && pruebasVista === 'asociacion';
    document.getElementById('pruebasNewBtn').style.display = isCentrosAsCliente ? 'none' : '';
    document.getElementById('pruebasImportBtn').style.display = isCentrosAsCliente ? 'none' : '';

    ensureVistaLookups(pruebasCurrentEntity).then(function(){
    gtApiFetch('/trazabilidad/' + pruebasCurrentEntity).then(function(res){
      var thead = document.getElementById('pruebasTableHead');
      var tbody = document.getElementById('pruebasTableBody');
      if(!res.ok){ tbody.innerHTML = '<tr><td class="empty-row">No se pudo cargar.</td></tr>'; return; }
      var rows = pruebasVista === 'asociacion'
        ? res.data.filter(function(row){ return rowMatchesVista(pruebasCurrentEntity, row); })
        : res.data;
      pruebasCurrentRows = rows;
      document.getElementById('pruebasRowCount').textContent = rows.length + (rows.length === 1 ? ' registro' : ' registros');

      var headHtml = '<tr>';
      entity.fields.forEach(function(f){ headHtml += '<th>' + f.label + '</th>'; });
      headHtml += '<th class="no-print"></th></tr>';
      thead.innerHTML = headHtml;

      if(rows.length === 0){
        tbody.innerHTML = '<tr><td class="empty-row" colspan="' + (entity.fields.length + 1) + '">Sin registros todavía.</td></tr>';
        return;
      }
      tbody.innerHTML = '';
      rows.forEach(function(row){
        var tr = document.createElement('tr');
        var html = '';
        entity.fields.forEach(function(f){
          var val = (f.type === 'select-entity' || f.type === 'select-catalogo') ? row[f.name + '_label'] : row[f.name];
          if(f.type === 'date' && val) val = gtFormatDate(val);
          html += '<td>' + (val === null || val === undefined || val === '' ? '—' : String(val)) + '</td>';
        });
        html += '<td class="no-print"><button type="button" class="cell-action" style="margin-right:10px;">Editar</button><button type="button" class="cell-action" style="color:#C0392B;">Eliminar</button></td>';
        tr.innerHTML = html;
        var actions = tr.lastElementChild.querySelectorAll('.cell-action');
        actions[0].addEventListener('click', function(){ openPruebasFormModal(row); });
        actions[1].addEventListener('click', function(){ deletePruebasRecord(row.id); });
        tbody.appendChild(tr);
      });
    });
    });
  }

  function deletePruebasRecord(id){
    if(!confirm('¿Eliminar este registro de prueba?')) return;
    gtApiFetch('/trazabilidad/' + pruebasCurrentEntity + '/' + id, { method: 'DELETE' }).then(function(){ fetchAndRenderPruebasTable(); });
  }

  function getPruebasFieldOptions(field, callback){
    var cacheKey = pruebasCurrentEntity + ':' + field.name;
    if(pruebasOptionsCache[cacheKey]){ callback(pruebasOptionsCache[cacheKey]); return; }
    var url = field.type === 'select-catalogo'
      ? '/trazabilidad/catalogo-options/' + field.categoria
      : '/trazabilidad/' + field.entity + '/options?labelField=' + encodeURIComponent(field.labelField);
    gtApiFetch(url).then(function(res){
      var opts = res.ok ? res.data : [];
      pruebasOptionsCache[cacheKey] = opts;
      callback(opts);
    });
  }

  function openPruebasFormModal(existingRow){
    var entity = pruebasEntities[pruebasCurrentEntity];
    document.getElementById('pruebasFormModalTitle').textContent = (existingRow ? 'Editar — ' : 'Nuevo — ') + entity.label;
    document.getElementById('pruebasFormId').value = existingRow ? existingRow.id : '';
    document.getElementById('pruebasFormError').style.display = 'none';
    var container = document.getElementById('pruebasFormFields');
    container.innerHTML = '';

    entity.fields.forEach(function(f){
      var wrap = document.createElement('div');
      wrap.className = 'form-field';
      var label = document.createElement('label');
      label.textContent = f.label + (f.required ? ' *' : '');
      wrap.appendChild(label);

      var inputId = 'pruebasField_' + f.name;
      var input;
      if(f.type === 'select-entity' || f.type === 'select-catalogo'){
        input = document.createElement('select');
        input.id = inputId;
        input.innerHTML = '<option value="">Cargando…</option>';
        getPruebasFieldOptions(f, function(opts){
          input.innerHTML = '<option value="">— Ninguno —</option>' + opts.map(function(o){ return '<option value="' + o.value + '">' + o.label + '</option>'; }).join('');
          if(existingRow && existingRow[f.name] !== null && existingRow[f.name] !== undefined){
            input.value = existingRow[f.name];
          }
        });
      } else {
        input = document.createElement('input');
        input.id = inputId;
        input.type = f.type === 'date' ? 'date' : (f.type === 'number' || f.type === 'decimal' ? 'number' : 'text');
        if(f.type === 'decimal') input.step = '0.0001';
        if(existingRow && existingRow[f.name] !== null && existingRow[f.name] !== undefined){
          input.value = f.type === 'date' ? String(existingRow[f.name]).slice(0, 10) : existingRow[f.name];
        }
      }
      wrap.appendChild(input);
      container.appendChild(wrap);
    });

    document.getElementById('pruebasFormModalOverlay').classList.add('open');
  }

  function closePruebasFormModal(){
    document.getElementById('pruebasFormModalOverlay').classList.remove('open');
  }

  function savePruebasRecord(){
    var entity = pruebasEntities[pruebasCurrentEntity];
    var id = document.getElementById('pruebasFormId').value;
    var body = {};
    entity.fields.forEach(function(f){
      var el = document.getElementById('pruebasField_' + f.name);
      body[f.name] = el.value === '' ? null : el.value;
    });
    var errorEl = document.getElementById('pruebasFormError');
    errorEl.style.display = 'none';
    gtApiFetch(id ? '/trazabilidad/' + pruebasCurrentEntity + '/' + id : '/trazabilidad/' + pruebasCurrentEntity, {
      method: id ? 'PUT' : 'POST',
      body: JSON.stringify(body)
    }).then(function(res){
      if(!res.ok){ errorEl.textContent = res.data.error || 'No se pudo guardar.'; errorEl.style.display = 'block'; return; }
      closePruebasFormModal();
      fetchAndRenderPruebasTable();
    });
  }

  // ---- Importar / exportar / plantilla para el modulo generico ----
  function onPruebasImportFile(input){
    var file = input.files[0];
    if(!file) return;
    var msg = document.getElementById('pruebasImportMsg');
    msg.style.color = 'var(--ink-soft)';
    msg.textContent = 'Importando…';
    var formData = new FormData();
    formData.append('file', file);
    fetch(API_BASE + '/trazabilidad/' + pruebasCurrentEntity + '/import', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + gtGetToken() },
      body: formData
    }).then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(res){
        input.value = '';
        if(!res.ok){ msg.style.color = '#C0392B'; msg.textContent = res.data.error || 'No se pudo importar.'; return; }
        msg.style.color = 'var(--green)';
        msg.textContent = 'Importados ' + res.data.importados + (res.data.omitidos ? ', omitidos ' + res.data.omitidos + ' (revisa el formato de esas filas).' : '.');
        fetchAndRenderPruebasTable();
      })
      .catch(function(){ msg.style.color = '#C0392B'; msg.textContent = 'No se pudo importar.'; });

  function downloadPruebasTemplate(){
    var msg = document.getElementById('pruebasImportMsg');
    msg.style.color = 'var(--ink-soft)';
    msg.textContent = 'Generando plantilla…';
    fetch(API_BASE + '/trazabilidad/' + pruebasCurrentEntity + '/template', {
      headers: { 'Authorization': 'Bearer ' + gtGetToken() }
    }).then(function(r){
      if(!r.ok) throw new Error('No se pudo generar la plantilla.');
      return r.blob();
    }).then(function(blob){
      msg.textContent = '';
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'plantilla_' + pruebasCurrentEntity + '.xlsx';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      msg.style.color = '#C0392B';

  function exportPruebasCsv(){
    var entity = pruebasEntities[pruebasCurrentEntity];
    if(pruebasCurrentRows.length === 0){ alert('No hay registros para exportar.'); return; }
    var headers = entity.fields.map(function(f){ return f.label; });
    var lines = [headers.join(',')];
    pruebasCurrentRows.forEach(function(row){
      lines.push(entity.fields.map(function(f){
        var val = (f.type === 'select-entity' || f.type === 'select-catalogo') ? row[f.name + '_label'] : row[f.name];
        var v = val === null || val === undefined ? '' : String(val);
        return v.indexOf(',') !== -1 ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(','));
    });
    downloadBlob(lines.join('\r\n'), pruebasCurrentEntity + '.csv', 'text/csv;charset=utf-8;');
  }

  function exportPruebasExcel(){
    var entity = pruebasEntities[pruebasCurrentEntity];
    if(pruebasCurrentRows.length === 0){ alert('No hay registros para exportar.'); return; }
    var headers = entity.fields.map(function(f){ return f.label; });
    var html = '<table><tr>' + headers.map(function(h){ return '<th>' + h + '</th>'; }).join('') + '</tr>' +
      pruebasCurrentRows.map(function(row){
        return '<tr>' + entity.fields.map(function(f){
          var val = (f.type === 'select-entity' || f.type === 'select-catalogo') ? row[f.name + '_label'] : row[f.name];

        }).join('') + '</tr>';
      }).join('') + '</table>';
    downloadBlob(html, pruebasCurrentEntity + '.xls', 'application/vnd.ms-excel');
  }

  function downloadBlob(content, filename, mime){
    var blob = new Blob(['﻿' + content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---- Entorno propio: Balance de Masas (busca reciclador, llena la grilla del día, guarda) ----
  var bmAllRecicladores = null;
  var bmAllMateriales = null;
  var bmSelectedReciclador = null;
  var bmExistingByMaterial = {};

  function initBmEnv(){
    document.getElementById('bmRecicladorSeleccionado').style.display = 'none';
    document.getElementById('bmRecicladorResultados').style.display = 'none';
    document.getElementById('bmBuscarReciclador').value = '';
    var fechaInput = document.getElementById('bmFecha');
    if(!fechaInput.value) fechaInput.value = new Date().toISOString().slice(0, 10);
    var desdeInput = document.getElementById('bmExportDesde');
    var hastaInput = document.getElementById('bmExportHasta');
    if(!hastaInput.value) hastaInput.value = new Date().toISOString().slice(0, 10);
    if(!desdeInput.value){
      var d = new Date();
      d.setDate(d.getDate() - 30);
      desdeInput.value = d.toISOString().slice(0, 10);
    }

    var loadRecicladores = bmAllRecicladores ? Promise.resolve() : gtApiFetch('/trazabilidad/recicladores').then(function(res){ bmAllRecicladores = res.ok ? res.data : []; });
    var loadMateriales = bmAllMateriales ? Promise.resolve() : gtApiFetch('/trazabilidad/tipos_material').then(function(res){ bmAllMateriales = res.ok ? res.data : []; });
    Promise.all([loadRecicladores, loadMateriales]).then(function(){
      var familias = ['--Todos los materiales'].concat(Array.from(new Set(bmAllMateriales.map(function(m){ return m.desc_familia; }))).filter(Boolean));
      var sel = document.getElementById('bmFamiliaFilter');
      sel.innerHTML = familias.map(function(f){ return '<option value="' + f + '">' + f + '</option>'; }).join('');
    });
  }

  function onBmBuscarRecicladorInput(){
    var q = document.getElementById('bmBuscarReciclador').value.trim().toLowerCase();
    var box = document.getElementById('bmRecicladorResultados');
    if(!q || !bmAllRecicladores){ box.style.display = 'none'; return; }
    var matches = bmAllRecicladores.filter(function(r){
      if(pruebasVista === 'asociacion' && (!pruebasDemoCentro || r.id_centro !== pruebasDemoCentro.id)) return false;
      return (r.nombre_completo || '').toLowerCase().indexOf(q) !== -1 || (r.nro_documento || '').toLowerCase().indexOf(q) !== -1;
    }).slice(0, 20);
    if(matches.length === 0){ box.innerHTML = '<p style="padding:10px;color:var(--ink-soft);font-size:13px;">Sin resultados.</p>'; box.style.display = 'block'; return; }
    box.innerHTML = '<table class="data-table"><thead><tr><th>Documento</th><th>Nombre</th><th>Centro</th></tr></thead><tbody>' +
      matches.map(function(r){ return '<tr class="bm-result-row" data-id="' + r.id + '" style="cursor:pointer;"><td>' + r.nro_documento + '</td><td>' + r.nombre_completo + '</td><td>' + (r.id_centro_label || '—') + '</td></tr>'; }).join('') +
      '</tbody></table>';
    box.style.display = 'block';
    box.querySelectorAll('.bm-result-row').forEach(function(row){
      row.addEventListener('click', function(){ selectBmReciclador(Number(row.getAttribute('data-id'))); });
    });

  function selectBmReciclador(id){
    bmSelectedReciclador = bmAllRecicladores.find(function(r){ return r.id === id; });
    if(!bmSelectedReciclador) return;
    document.getElementById('bmBuscarReciclador').value = bmSelectedReciclador.nombre_completo;
    document.getElementById('bmRecicladorResultados').style.display = 'none';
    document.getElementById('bmNombre').value = bmSelectedReciclador.nombre_completo || '';
    document.getElementById('bmCedula').value = bmSelectedReciclador.nro_documento || '';
    document.getElementById('bmTipoVehiculo').value = bmSelectedReciclador.tipo_de_vehiculo || '';
    document.getElementById('bmPlaca').value = bmSelectedReciclador.placa || '';
    document.getElementById('bmRecicladorSeleccionado').style.display = 'block';

    Promise.all([
      gtApiFetch('/trazabilidad/bodegas'),
      gtApiFetch('/trazabilidad/numacros')
    ]).then(function(results){
      var bodegas = (results[0].ok ? results[0].data : []).filter(function(b){ return b.id_centro === bmSelectedReciclador.id_centro; });
      var numacros = (results[1].ok ? results[1].data : []).filter(function(n){ return n.id_centro === bmSelectedReciclador.id_centro; });
      var bodegaSel = document.getElementById('bmBodega');
      bodegaSel.innerHTML = '<option value="">— Ninguna —</option>' + bodegas.map(function(b){ return '<option value="' + b.id + '">' + (b.cod_bodega || '') + ' - ' + (b.desc_bodega || '') + '</option>'; }).join('');
      var numacroSel = document.getElementById('bmNumacro');
      numacroSel.innerHTML = '<option value="">— Ninguna —</option>' + numacros.map(function(n){ return '<option value="' + n.id + '">' + (n.id_localidad_label || n.cod_numacro || '') + '</option>'; }).join('');
      loadBmDia();
    });

  function loadBmDia(){
    if(!bmSelectedReciclador) return;
    var fecha = document.getElementById('bmFecha').value;
    gtApiFetch('/trazabilidad/balance-masas-dia?id_reciclador=' + bmSelectedReciclador.id + '&fecha=' + fecha).then(function(res){
      bmExistingByMaterial = {};
      (res.ok ? res.data : []).forEach(function(row){ bmExistingByMaterial[row.id_tipo_material] = row; });
      renderBmGrid();
    });
  }

  function renderBmGrid(){
    var familia = document.getElementById('bmFamiliaFilter').value;
    var ordenados = bmAllMateriales.slice().sort(function(a,b){ return (a.secuencia_orden || 0) - (b.secuencia_orden || 0); });
    var list = familia === '--Todos los materiales' ? ordenados : ordenados.filter(function(m){ return m.desc_familia === familia; });
    var tbody = document.getElementById('bmGridBody');
    tbody.innerHTML = '';
    list.forEach(function(m){
      var existing = bmExistingByMaterial[m.id] || {};
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + m.desc_tipo_material + '</td>' +
        '<td><input type="number" step="0.0001" style="width:100%;" data-mat="' + m.id + '" data-field="cantidad" value="' + (existing.cantidad || '') + '"></td>' +
        '<td><input type="number" step="0.01" style="width:100%;" data-mat="' + m.id + '" data-field="valor" value="' + (existing.valor || '') + '"></td>' +
        '<td><input type="number" step="0.0001" style="width:100%;" data-mat="' + m.id + '" data-field="cantidad_rechazo" value="' + (existing.cantidad_rechazo || '') + '"></td>' +
        '<td><input type="number" step="0.0001" style="width:100%;" data-mat="' + m.id + '" data-field="cantidad_nosui" value="' + (existing.cantidad_nosui || '') + '"></td>';
      tbody.appendChild(tr);
    });
  }

  function saveBmDia(){
    if(!bmSelectedReciclador) return;
    var inputs = document.querySelectorAll('#bmGridBody input');
    var byMaterial = {};
    inputs.forEach(function(inp){
      var matId = inp.getAttribute('data-mat');
      var field = inp.getAttribute('data-field');
      byMaterial[matId] = byMaterial[matId] || { id_tipo_material: Number(matId) };
      byMaterial[matId][field] = inp.value === '' ? 0 : Number(inp.value);
    });
    var materiales = Object.values(byMaterial);
    var msg = document.getElementById('bmSaveMsg');
    msg.style.color = 'var(--ink-soft)';
    msg.textContent = 'Guardando…';
    gtApiFetch('/trazabilidad/balance-masas-dia', {
      method: 'POST',
      body: JSON.stringify({
        id_centro: bmSelectedReciclador.id_centro,
        id_reciclador: bmSelectedReciclador.id,
        id_numacro: document.getElementById('bmNumacro').value || null,
        id_bodega: document.getElementById('bmBodega').value || null,
        fecha: document.getElementById('bmFecha').value,
        materiales: materiales
      })
    }).then(function(res){
      if(!res.ok){ msg.style.color = '#C0392B'; msg.textContent = res.data.error || 'No se pudo guardar.'; return; }
      msg.style.color = 'var(--green)';
      msg.textContent = 'Guardado (' + res.data.filas + ' materiales con datos).';
      loadBmDia();
    });
  }

  // ---- Reporte de periodo de Balance de Masas: mismas columnas que el sistema de trazabilidad
  // original (el que recibe la Superintendencia), pero por rango de fechas y para toda la
  // asociacion (o todas, en vista Administrador) en vez de un solo reciclador/dia.
  function bmReportRowToOldFormat(row){
    var d = new Date(row.fecha + (String(row.fecha).length <= 10 ? 'T00:00:00' : ''));
    var oneJan = new Date(d.getFullYear(), 0, 1);
    var numeroSemana = Math.ceil((((d - oneJan) / 86400000) + oneJan.getDay() + 1) / 7);
    var fechaStr = typeof row.fecha === 'string' ? row.fecha.slice(0, 10) : gtFormatDate(row.fecha);
    var nueca = (row.cod_bodega || '') + (row.desc_bodega ? ' - ' + row.desc_bodega : '');
    return {
      NUECA: nueca, NUMACRO: row.cod_numacro || '', 'Numero de semana': numeroSemana,
      'Tipo ident.': 'CC', 'Nro ident.': row.nro_documento || '',
      placa: row.placa || '', toneladas: (Number(row.cantidad) / 1000),
      'Tipo Material': row.desc_tipo_material || '', Toneladas_rechazo: (Number(row.cantidad_rechazo) / 1000),
      'Tipo de destino': 'ECA', 'Número único del sitio de destino': row.cod_bodega || '',
      Asociacion: row.centro || '', fecha: fechaStr,
      nombre_completo: row.nombre_completo || '',
      valor_kilogramo: Number(row.valor), valor_total: Number(row.valor) * Number(row.cantidad),
      cantidad_rechazo: Number(row.cantidad_rechazo), cantidad_nosui: Number(row.cantidad_nosui)
    };
  }

  function fetchBmReportRows(callback, onFail){
    var desde = document.getElementById('bmExportDesde').value;
    var hasta = document.getElementById('bmExportHasta').value;
    if(!desde || !hasta){ alert('Elige el rango de fechas (desde y hasta).'); if(onFail) onFail(); return; }
    var idCentro = (pruebasVista === 'asociacion' && pruebasDemoCentro) ? pruebasDemoCentro.id : '';
    var url = '/trazabilidad/balance-masas-export?desde=' + desde + '&hasta=' + hasta + (idCentro ? '&id_centro=' + idCentro : '');
    gtApiFetch(url).then(function(res){
      if(!res.ok){ alert(res.data.error || 'No se pudo generar el reporte.'); if(onFail) onFail(); return; }
      if(res.data.length === 0){ alert('No hay datos de balance de masas en ese rango de fechas.'); if(onFail) onFail(); return; }
      callback(res.data.map(bmReportRowToOldFormat), desde, hasta);
    });
  }

  function exportBmReporte(kind){
    fetchBmReportRows(function(rows, desde, hasta){
      var headers = Object.keys(rows[0]);
      var filenameBase = 'balance_masas_' + desde + '_a_' + hasta;
      if(kind === 'xlsx'){
        var html = '<table><tr>' + headers.map(function(h){ return '<th>' + h + '</th>'; }).join('') + '</tr>' +
          rows.map(function(r){ return '<tr>' + headers.map(function(h){ return '<td>' + r[h] + '</td>'; }).join('') + '</tr>'; }).join('') +
          '</table>';
        downloadBlob(html, filenameBase + '.xls', 'application/vnd.ms-excel');
      } else {
        var sep = kind === 'csv-semicolon' ? ';' : ',';
        var lines = [headers.join(sep)];
        rows.forEach(function(r){
          lines.push(headers.map(function(h){
            var v = r[h] === null || r[h] === undefined ? '' : String(r[h]);
            return v.indexOf(sep) !== -1 ? '"' + v.replace(/"/g, '""') + '"' : v;
          }).join(sep));
        });
        downloadBlob(lines.join('\r\n'), filenameBase + '.csv', 'text/csv;charset=utf-8;');
      }
    });
  }

  // gtFormatDate hace "new Date(str)" y muestra en la hora local del navegador: para un valor
  // 'YYYY-MM-DD' puro (como el de un <input type="date">, sin hora ni zona horaria) eso lo
  // interpreta como medianoche UTC, y en cualquier huso detras de UTC (Bogota es UTC-5) se ve
  // un dia antes. Esta version arma el texto directo desde el string, sin pasar por Date.
  function formatDateStrLocal(dateStr){
    if(!dateStr) return '—';
    var parts = String(dateStr).slice(0, 10).split('-');
    if(parts.length !== 3) return dateStr;
    var meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    var mesIdx = Number(parts[1]) - 1;
    return Number(parts[2]) + ' de ' + (meses[mesIdx] || parts[1]) + ' de ' + parts[0];
  }

  // ---- Factura del dia: el PDF es solo para esto — un comprobante imprimible de lo que un
  // reciclador entrego ese dia especifico, con el valor de cada material y el total a pagar.
  // No aplica al reporte de periodo (ese solo se exporta a Excel/CSV, en el formato de la Super).
  function printBmGrid(){
    if(!bmSelectedReciclador){ alert('Busca y selecciona un reciclador primero.'); return; }
    var headers = ['Material', 'Cantidad (kg)', 'Valor unitario', 'Valor total', 'Cant. rechazo', 'Cant. no SUI'];
    var rows = [];
    var sumCantidad = 0, sumValorTotal = 0, sumRechazo = 0, sumNosui = 0;
    document.querySelectorAll('#bmGridBody tr').forEach(function(tr){
      var material = tr.children[0].textContent;
      var cantidad = Number(tr.querySelector('[data-field="cantidad"]').value || 0);
      var valor = Number(tr.querySelector('[data-field="valor"]').value || 0);
      var rechazo = Number(tr.querySelector('[data-field="cantidad_rechazo"]').value || 0);
      var nosui = Number(tr.querySelector('[data-field="cantidad_nosui"]').value || 0);
      if(!cantidad && !valor && !rechazo && !nosui) return;
      var valorTotal = cantidad * valor;
      rows.push([material, cantidad, valor, valorTotal, rechazo, nosui]);
      sumCantidad += cantidad; sumValorTotal += valorTotal; sumRechazo += rechazo; sumNosui += nosui;
    });
    if(rows.length === 0){ alert('No hay cantidades registradas ese día.'); return; }
    var subtitle = bmSelectedReciclador.nombre_completo + ' — Doc. ' + bmSelectedReciclador.nro_documento +
      ' — Fecha: ' + formatDateStrLocal(document.getElementById('bmFecha').value);
    var totalsRow = ['TOTAL', sumCantidad, '', sumValorTotal, sumRechazo, sumNosui];
    openPrintWindowNow('Factura — Balance de Masas', subtitle, headers, rows, totalsRow);
  }

  // ---- Ventana de impresion con diseno propio (no solo el navegador imprimiendo la pantalla tal
  // cual): abre una ventana nueva con un documento HTML propio (encabezado, tabla, total, pie de

    var html = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>' + esc(title) + '</title><style>' +
      '@page{ margin:14mm; }' +
      'body{ font-family: Arial, Helvetica, sans-serif; color:#1B2733; margin:0; padding:22px; }' +
      '.pf-header{ display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #F2941F;padding-bottom:10px;margin-bottom:14px; }' +
      '.pf-brand{ font-size:11px;color:#5B6B7C;text-transform:uppercase;letter-spacing:.6px; }' +
      '.pf-header h1{ margin:4px 0 0;font-size:19px;color:#0A3369; }' +
      '.pf-meta{ font-size:11.5px;color:#5B6B7C;margin:0 0 14px; }' +
      'table{ width:100%;border-collapse:collapse;font-size:11px; }' +
      'th{ background:#0A3369;color:#fff;text-align:left;padding:6px 8px;white-space:nowrap; }' +
      'td{ padding:5px 8px;border-bottom:1px solid #DCE3EA; }' +
      'tr:nth-child(even) td{ background:#F7F9FB; }' +
      '.pf-total td{ font-weight:700;border-top:2px solid #0A3369;background:#F3F5F8; }' +
      '.pf-footer{ margin-top:16px;font-size:9.5px;color:#9AA7B4;border-top:1px solid #DCE3EA;padding-top:6px; }' +
      '</style></head><body>' +
      '<div class="pf-header"><div><div class="pf-brand">Genesis Traza — Trazabilidad</div><h1>' + esc(title) + '</h1></div>' +
      '<div class="pf-brand">' + esc(generado) + '</div></div>' +
      (subtitle ? '<p class="pf-meta">' + esc(subtitle) + '</p>' : '') +
      '<table><thead><tr>' + headers.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody>' +
      (totalsRow ? '<tfoot><tr class="pf-total">' + totalsRow.map(function(c){ return '<td>' + esc(c) + '</td>'; }).join('') + '</tr></tfoot>' : '') +
      '</table>' +
      '<div class="pf-footer">Módulo Pruebas (sandbox de trazabilidad nativa) — comprobante de prueba, no válido como factura real.</div>' +
      '</body></html>';
    win.document.open();
    win.document.write(html);
    win.document.close();
    win.focus();
    setTimeout(function(){ win.print(); }, 350);
  }

  if(session) initPruebasPage();
</script>
</body>
</html>
