<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pruebas — Trazabilidad nativa | Genesis Traza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body{ font-size:13px; }
  .pruebas-shell{ max-width:1280px;margin:0 auto;padding:12px 18px 30px; }
  .pruebas-topbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line);
  }
  .pruebas-topbar h1{ margin:0;font-size:15px;font-weight:700;white-space:nowrap; }
  .pruebas-topbar select{ font-size:12.5px;padding:5px 8px;height:auto; }
  .pruebas-topbar .spacer{ flex:1; }
  .pruebas-topbar a.btn{ font-size:12px;padding:5px 10px; }
  .pruebas-hint{ margin:0 0 10px;color:var(--ink-soft);font-size:11.5px; }
  .pruebas-hint.asociacion{ color:var(--orange);font-weight:600; }
  .pm-vista{ display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden; }
  .pm-vista button{
    border:none;background:#fff;color:var(--ink-soft);font-family:inherit;font-weight:600;
    font-size:11.5px;padding:6px 11px;cursor:pointer;
  }
  .pm-vista button.active{ background:var(--orange);color:#fff; }
  .pm-bar{ display:flex;flex-wrap:wrap;gap:3px;margin-bottom:2px;position:relative;z-index:20; }
  .pm-item{ position:relative;z-index:1; }
  .pm-item.open{ z-index:50; }
  .pm-title{
    display:block;background:#fff;border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-weight:700;font-size:11px;padding:7px 12px;cursor:pointer;
    border-radius:7px 7px 0 0;white-space:nowrap;
  }
  .pm-title:hover{ background:#F3F5F8; }
  .pm-item.has-active .pm-title{ color:var(--orange);border-color:var(--orange); }
  .pm-item.open .pm-title{ background:var(--orange);color:#fff;border-color:var(--orange); }
  .pm-dropdown{
    display:none;position:absolute;top:calc(100% + 3px);left:0;min-width:230px;
    background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:0 8px 22px rgba(10,51,105,.12);padding:5px;
  }
  .pm-item.open .pm-dropdown{ display:block; }
  .pm-dropdown a{
    display:block;padding:7px 10px;font-size:12px;color:var(--ink);text-decoration:none;
    border-radius:5px;cursor:pointer;white-space:nowrap;
  }
  .pm-dropdown a:hover{ background:#F3F5F8; }
  .pm-dropdown a.active{ background:var(--orange);color:#fff; }
  .pruebas-menu-row{ border-bottom:1px solid var(--line);margin-bottom:8px;padding-bottom:0; }
  .pruebas-shell .panel{ padding:12px 14px;border-radius:10px;margin-bottom:14px; }
  .pruebas-toolbar{ display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px; }
  .pruebas-toolbar .spacer{ flex:1; }
  .pruebas-toolbar h2{ font-size:13px;font-weight:700; }
  .pruebas-toolbar .btn{ font-size:11.5px;padding:5px 10px; }
  .pruebas-toolbar input[type="date"]{ font-size:11.5px;padding:4px 6px;height:auto;width:128px; }
  .pruebas-toolbar .sep{ font-size:11px;color:var(--ink-soft); }
  .pruebas-badge{ font-size:11px;color:var(--ink-soft);background:var(--bg-soft, #F3F5F8);border-radius:20px;padding:3px 10px; }
  .pruebas-msg{ font-size:11.5px;margin-top:6px; }
  .pruebas-shell table.data-table th{ padding:6px 9px;font-size:10.5px; }
  .pruebas-shell table.data-table td{ padding:6px 9px;font-size:12px; }
  .pruebas-shell .form-field{ margin-bottom:8px; }
  .pruebas-shell .form-field label{ font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-soft); }
  .bm-bar{ display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid var(--line); }
  .bm-bar h2{ margin:0 12px 0 0;font-size:14px;font-weight:700;color:var(--ink-soft); }
  .bm-bar input[type="date"]{ font-size:12px;padding:3px 6px;height:28px;width:132px; }
  .bm-ic{ width:34px;height:34px;border:none;background:transparent;color:#4A6FA5;cursor:pointer;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;padding:0; }
  .bm-ic:hover{ background:#EAF0F8; }
  .bm-ic svg{ width:22px;height:22px;fill:currentColor; }
  .bm-sep{ width:14px; }
  .bm-reportes{ background:#F7F9FB;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px; }
  .bm-rep-row{ display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;padding:3px 0; }
  .bm-rep-row strong{ min-width:150px;font-size:12px; }
  .bm-rep-row input[type="date"], .bm-rep-row select, .bm-rep-row input[type="number"]{ font-size:12px;padding:3px 6px;height:28px; }
  .bm-rep-row .btn{ font-size:11.5px;padding:4px 10px; }
  .bm-form{ display:grid;grid-template-columns:110px minmax(0,1fr) 90px minmax(0,1fr);gap:6px 12px;align-items:center;margin-bottom:8px; }
  .bm-form label{ font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-soft); }
  .bm-form input, .bm-form select{ height:27px;padding:2px 7px;font-size:12px;border:1px solid #C5CFDB;border-radius:3px;background:#fff;width:100%;box-sizing:border-box; }
  .bm-form input:disabled, .bm-form select:disabled{ background:#F1F3F5;color:#6B7785; }
  .bm-gridwrap{ max-height:58vh;overflow:auto;border:1px solid #23408E; }
  .bm-grid{ width:100%;border-collapse:collapse;font-size:11.5px; }
  .bm-grid th, .bm-grid td{ border:1px solid #D6DDE6;padding:0 6px;height:24px; }
  .bm-grid thead th{ background:#fff;color:#23408E;font-weight:700;text-align:center;position:sticky;z-index:2; }
  .bm-grid thead tr:nth-child(1) th{ top:0; }
  .bm-grid thead tr:nth-child(2) th{ top:24px; }
  .bm-grid thead tr:nth-child(3) th{ top:48px;font-size:10.5px;font-weight:600;color:var(--ink-soft); }
  .bm-grid .bm-c1{ width:170px;text-align:left; }
  .bm-grid thead select{ font-size:11px;height:20px;width:100%;padding:0 2px; }
  .bm-grid tbody td:first-child{ color:var(--ink-soft);white-space:nowrap; }
  .bm-grid tbody input, .bm-grid tbody select{ width:100%;height:22px;border:none;background:transparent;font-size:11.5px;text-align:right;box-sizing:border-box;padding:0 2px; }
  .bm-grid tbody select{ text-align:left; }
  .bm-grid tbody select:disabled{ appearance:none;-webkit-appearance:none;color:transparent; }
  .bm-grid tbody input:disabled, .bm-grid tbody select:disabled{ background:#F3F3F3;cursor:not-allowed; }
  .bm-grid tbody input:focus, .bm-grid tbody select:focus{ outline:2px solid #4A6FA5;background:#fff; }
  .bm-grid td.bm-tot{ text-align:right;background:#F7F8FA;color:#23408E; }
  .bm-grid tfoot{ position:sticky;bottom:0; }
  .bm-grid tfoot th, .bm-grid tfoot td{ background:#EEF2F8;font-weight:700;color:#23408E;text-align:right;border-top:2px solid #23408E; }
  .bm-note{ margin:6px 0 0;font-size:11px;color:var(--ink-soft); }
  #bmGridBody input.bm-bad{ border-color:#C0392B !important;background:#FDECEA !important;color:#8E1B10; }
  .bm-pick-filters{ display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:8px;margin:4px 0 8px; }
  .bm-pick-filters input{ height:30px;padding:2px 8px;font-size:12px;border:1px solid #C5CFDB;border-radius:4px; }
  .bm-pick-list{ max-height:52vh;overflow:auto;border-top:1px solid var(--line); }
  .bm-pick-row{ display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:8px;padding:7px 6px;font-size:12px;color:#23408E;border-bottom:1px solid #EEF1F5;cursor:pointer; }
  .bm-pick-row:nth-child(odd){ background:#FBF8F8; }
  .bm-pick-row:hover{ background:#E8D5CE; }
  @media (max-width:640px){ .bm-form{ grid-template-columns:90px minmax(0,1fr); } .bm-pick-filters{ grid-template-columns:1fr; } .bm-pick-row{ grid-template-columns:1fr; } }
  @media print{
    body *{ visibility:hidden; }
    .no-print{ display:none !important; }
  }
</style>
</head>
<body>

<div id="gtPageLoader">
  <div class="gt-loader-mark">
    <div class="gt-spinner"></div>
    <span>Cargando…</span>
  </div>
</div>

<div class="pruebas-shell">
  <div class="pruebas-topbar no-print">
    <h1>Trazabilidad — Pruebas</h1>
    <div class="pm-vista" id="pruebasVistaToggle">
      <button type="button" data-vista="administrador" onclick="onPruebasVistaChange('administrador')">Administrador</button>
      <button type="button" data-vista="asociacion" onclick="onPruebasVistaChange('asociacion')">Asociación</button>
    </div>
    <span class="spacer"></span>
    <a class="btn" href="admin-1b98a0bb3a.html">← Panel</a>
  </div>
  <div class="pm-bar pruebas-menu-row no-print" id="pruebasMenuBar"></div>
  <p class="pruebas-hint no-print" id="pruebasVistaHint"></p>

  <div class="panel bm-panel" id="pruebasBalanceMasasEnv" style="display:none;">
    <div class="bm-bar no-print">
      <h2>Balance de Masas</h2>
      <button type="button" class="bm-ic" title="Buscar reciclador" onclick="openBmPicker()"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="4.2"/><path d="M3.5 21c0-4.7 3.8-7.5 8.5-7.5s8.5 2.8 8.5 7.5z"/></svg></button>
      <input type="date" id="bmFecha" title="Fecha" onchange="onBmFechaChange()">
      <button type="button" class="bm-ic" title="Guardar el día" onclick="saveBmDia()"><svg viewBox="0 0 24 24"><path d="M4 3h13l3 3v15H4z M7 3v5h9V3 M7 13h10v8H7z" fill-rule="evenodd"/></svg></button>
      <button type="button" class="bm-ic" title="Borrar el día de este reciclador" onclick="deleteBmDia()"><svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4z M6 8h12l-1 13H7z"/></svg></button>
      <span class="bm-sep"></span>
      <button type="button" class="bm-ic" title="Imprimir factura del día (PDF)" onclick="printBmGrid()"><svg viewBox="0 0 24 24"><path d="M7 3h10v4H7z M4 8h16a1 1 0 0 1 1 1v8h-4v4H7v-4H3V9a1 1 0 0 1 1-1z M9 15h6v4H9z" fill-rule="evenodd"/></svg></button>
      <button type="button" class="bm-ic" id="bmReportesBtn" title="Reportes: exportar al formato de la Super y planillas" onclick="toggleBmReportes()"><svg viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5z M13 3v6h6 M11 12v5l-2-2-1.4 1.4L12 20.8l4.4-4.4L15 15l-2 2v-5z" fill-rule="evenodd"/></svg></button>
      <span class="pruebas-msg" id="bmSaveMsg"></span>
    </div>

    <div class="bm-reportes no-print" id="bmReportes" style="display:none;">
      <div class="bm-rep-row">
        <strong>Formato Superintendencia</strong>
        <span class="sep">Desde</span><input type="date" id="bmExportDesde">
        <span class="sep">Hasta</span><input type="date" id="bmExportHasta">
        <button type="button" class="btn" onclick="exportBmReporte('xlsx')">Excel</button>
        <button type="button" class="btn" onclick="exportBmReporte('csv-comma')">CSV</button>
        <button type="button" class="btn" onclick="exportBmReporte('csv-semicolon')">CSV (;)</button>
      </div>
      <div class="bm-rep-row">
        <strong>Planillas de recepción</strong>
        <select id="bmPlanillaMes" style="width:110px;"></select>
        <input type="number" id="bmPlanillaAnio" style="width:70px;" placeholder="Año">
        <button type="button" class="btn" onclick="descargarPlanillasZip()">Descargar todas (.zip)</button>
        <span class="pruebas-msg" id="bmPlanillaMsg"></span>
      </div>
    </div>

    <div class="bm-form">
      <label>Nombre</label><input id="bmNombre" readonly placeholder="Clic en el ícono de persona para buscar…" onclick="openBmPicker()" style="cursor:pointer;">
      <label>Cédula</label><input id="bmCedula" disabled>
      <label>Tipo vehículo</label><input id="bmTipoVehiculo" disabled>
      <label>Placa</label><input id="bmPlaca" disabled>
      <label>NUECA</label><select id="bmBodega" disabled><option value="">— Seleccionar —</option></select>
      <label>NUMACRO</label><select id="bmMacrorruta" disabled><option value="">— Seleccionar —</option></select>
      <label>Microruta 1</label><select id="bmMicrorruta1" disabled><option value="">— Seleccionar —</option></select>
      <label>Microruta 2</label><select id="bmMicrorruta2" disabled><option value="">— Seleccionar —</option></select>
    </div>

    <div class="bm-gridwrap">
      <table class="bm-grid">
        <thead>
          <tr><th class="bm-c1" rowspan="1"></th><th colspan="5" id="bmFechaTitulo">—</th></tr>
          <tr><th class="bm-c1"><select id="bmFamiliaFilter" class="no-print" onchange="renderBmGrid()"></select></th><th colspan="5" id="bmDiaSemana"></th></tr>
          <tr><th class="bm-c1"></th><th>Cantidad (Kilogramos)</th><th>Valor</th><th>Total</th><th>Cantidad rechazo</th><th>Cantidad no SUI</th></tr>
        </thead>
        <tbody id="bmGridBody"></tbody>
        <tfoot><tr><th class="bm-c1" style="text-align:left;">Total</th><td id="bmTotCantidad">0,00</td><td></td><td id="bmTotValor">0,00</td><td id="bmTotRechazo">0,00</td><td id="bmTotNoSui">0,00</td></tr></tfoot>
      </table>
    </div>

    <div class="modal-overlay" id="bmPickerOverlay">
      <div class="modal-box">
        <button class="modal-close" onclick="closeBmPicker()" title="Cerrar">&times;</button>
        <div class="modal-scroll">
          <div class="bm-pick-filters">
            <input id="bmPickDoc" placeholder="Nro. Doc." oninput="renderBmPicker()" autocomplete="off">
            <input id="bmPickNombre" placeholder="Nombre completo" oninput="renderBmPicker()" autocomplete="off">
            <input id="bmPickAsoc" placeholder="Asociación" oninput="renderBmPicker()" autocomplete="off">
          </div>
          <div class="bm-pick-list" id="bmPickList"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel" id="pruebasGenericView">
    <div class="pruebas-toolbar no-print">
      <h2 id="pruebasEntityTitle">Elige un módulo</h2>
      <span class="pruebas-badge" id="pruebasRowCount"></span>
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary" id="pruebasNewBtn" onclick="openPruebasFormModal()">Nuevo registro</button>
      <button type="button" class="btn" id="pruebasImportBtn" onclick="document.getElementById('pruebasImportInput').click()">Importar</button>
      <input type="file" id="pruebasImportInput" accept=".xlsx,.xls,.csv" style="display:none;" onchange="onPruebasImportFile(this)">
      <button type="button" class="btn" onclick="downloadPruebasTemplate()">Plantilla</button>
      <button type="button" class="btn" onclick="exportPruebasExcel()">Exportar Excel</button>
      <button type="button" class="btn" onclick="exportPruebasCsv()">Exportar CSV</button>
    </div>
    <p class="pruebas-msg no-print" id="pruebasImportMsg"></p>
    <div class="table-scroll">
      <table class="data-table">
        <thead id="pruebasTableHead"></thead>
        <tbody id="pruebasTableBody"><tr><td class="empty-row">Cargando…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal: formulario dinamico del modulo Pruebas -->
<div class="modal-overlay" id="pruebasFormModalOverlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closePruebasFormModal()">&times;</button>
    <div class="modal-scroll">
      <h3 id="pruebasFormModalTitle">Nuevo registro</h3>
      <input type="hidden" id="pruebasFormId">
      <div class="form-grid" id="pruebasFormFields" style="margin-top:18px;"></div>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="savePruebasRecord()">Guardar</button>
      <p id="pruebasFormError" style="display:none;color:#C0392B;font-size:13px;margin-top:10px;"></p>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  var session = gtRequireAuth(['pro']);

  // Agrupa los modulos en el desplegable para que sea facil de recorrer (mismo criterio que
  // el sistema de trazabilidad original: catalogos, recicladores, operacion, usuarios/cobro, PQR).
  var ENTITY_GROUPS = [
    // Tareas del administrador (Genesis Traza): valores fijos que el usuario/operador no toca —
    // datos de la asociación (incluido el sitio de destino del rechazo) y los códigos regulatorios.
    { label: 'Administración', adminOnly: true, keys: ['centros', 'tipos_material', 'catalogos'] },
    { label: 'Catálogos y estructura', keys: ['areas_prestacion', 'bodegas', 'localidades', 'numacros'] },
    { label: 'Recicladores y formalización', keys: ['recicladores', 'formalizacion_fases', 'seguridad_social'] },
    { label: 'Operación diaria', keys: ['balance_masas', 'macrorrutas', 'microrrutas', 'microrrutas_detalle'] },
    { label: 'Usuarios y aprovechamiento', keys: ['usuarios', 'aprovechamiento', 'recursos'] },
    { label: 'Comercial y pagos', keys: ['ventas', 'pago_seguridad', 'pago_tarifa'] },
    { label: 'Atención al usuario', keys: ['pqr'] }
  ];

  var ENTITY_HINTS = {
    centros: 'Datos de la asociación/prestador: código, nombre, registro RUP/ECA y el sitio de destino del rechazo (tipo y número), que es fijo y se aplica solo en Balance de Masas.',
    catalogos: 'Listas y códigos fijos (tipos de identificación, destinos de rechazo, familias, etc.). Los códigos son los que exige el SUI: no los cambie sin necesidad.',
    areas_prestacion: 'Áreas de Prestación del Servicio (NUAP) que opera el prestador — departamento/municipio DANE. Cada ECA y macrorruta pertenece a una de estas.',
    bodegas: 'Estaciones de Clasificación y Aprovechamiento (ECA): predio, coordenadas, propietario, contrato y capacidades.',
    localidades: 'Localidades de Bogotá usadas para ubicar numacros y usuarios.',
    numacros: 'Zonas operativas internas dentro de cada centro (agrupación propia, no es el NUMACRO oficial del SUI — ese es el código de la macrorruta).',
    tipos_material: 'Catálogo de materiales aprovechables y su familia.',
    recicladores: 'Base de datos de recicladores de oficio del centro.',
    balance_masas: 'Registro diario de material recibido por reciclador (tiene su propio entorno).',
    macrorrutas: 'Macrorrutas de recolección — Balance de Masas se asocia a una para calcular el DINC.',
    formalizacion_fases: 'Checklist de las 8 fases de formalización del Decreto 596/2016.',
    pqr: 'Registro de peticiones, quejas y reclamos de usuarios.',
    seguridad_social: 'Afiliación a EPS/ARL y aportes a BEPS de cada reciclador (Decreto 271/2026).',
    microrrutas: 'Microrrutas de recolección asignadas a un reciclador.',
    microrrutas_detalle: 'Detalle operativo (horarios, distancias, tipo de barrido) de cada microrruta.',
    usuarios: 'Base de usuarios del servicio (SUI): NUIS/NUID, uso, tipo, ubicación.',
    aprovechamiento: 'Toneladas de aprovechamiento por usuario y periodo, para el cobro tarifario.',
    recursos: 'Recursos que transfiere el prestador de recolección de no aprovechables (CCS/tarifa de aprovechamiento) por periodo.',
    ventas: 'Toneladas aprovechadas: facturas de venta del material, con CUFE, comprador y origen del residuo.',
    pago_seguridad: 'Pagos hechos a recicladores por concepto de seguridad social.',
    pago_tarifa: 'Pagos hechos a recicladores por concepto de tarifa de aprovechamiento.'
  };

  function initPruebasPage(){
    var loader = document.getElementById('gtPageLoader');
    gtApiFetch('/trazabilidad/centros').then(function(res){
      if(res.ok){
        var found = res.data.find(function(c){ return c.cod_centro === 'DEMO-01'; });
        if(found) pruebasDemoCentro = { id: found.id, label: found.desc_centro };
      }
      if(loader) loader.classList.add('hidden');
      loadPruebasTab();
    });
  }

  // ---- Vista: Administrador (Genesis Traza, todo) vs Asociacion (cliente, solo su centro demo) ----
  // Es una simulacion visual dentro del sandbox (el rol real de backend sigue siendo "pro" para
  // poder hacer las pruebas); sirve para ver como se veria cada modulo desde la otra perspectiva.
  var pruebasVista = 'administrador';
  var pruebasDemoCentro = null; // {id, label}, se resuelve una vez al cargar la pagina

  function onPruebasVistaChange(vista){
    pruebasVista = vista;
    document.querySelectorAll('#pruebasVistaToggle button').forEach(function(b){
      b.classList.toggle('active', b.dataset.vista === vista);
    });
    updateVistaHint();
    if(pruebasEntities){
      // Las tareas de administración no existen para la asociación: si estaba en una, pasa a la primera visible.
      if(vista === 'asociacion' && isAdminOnlyEntity(pruebasCurrentEntity)) pruebasCurrentEntity = 'balance_masas';
      renderPruebasEntitySelect();
    }
  }

  function isAdminOnlyEntity(key){
    return ENTITY_GROUPS.some(function(g){ return g.adminOnly && g.keys.indexOf(key) !== -1; });
  }

  function updateVistaHint(){
    document.querySelectorAll('#pruebasVistaToggle button').forEach(function(b){
      b.classList.toggle('active', b.dataset.vista === pruebasVista);
    });
    var hint = document.getElementById('pruebasVistaHint');
    hint.style.display = 'block';
    if(pruebasVista === 'asociacion'){
      hint.className = 'pruebas-hint asociacion';
      hint.textContent = pruebasDemoCentro
        ? 'Viendo como cliente de "' + pruebasDemoCentro.label + '" — solo sus propios datos (ficticios, de prueba).'
        : 'No hay una asociación demo cargada todavía (corre "npm run seed:demo" en el backend).';
    } else {
      hint.className = 'pruebas-hint administrador';
      hint.textContent = 'Viendo como Genesis Traza: todas las asociaciones, sin restricciones.';
    }
  }

  // ---- Pruebas: trazabilidad nativa (sandbox, tablas tz_*) ----
  var pruebasEntities = null;
  var pruebasCurrentEntity = null;
  var pruebasCurrentRows = [];
  var pruebasOptionsCache = {};

  function loadPruebasTab(){
    updateVistaHint();
    if(pruebasEntities){ renderPruebasEntitySelect(); return; }
    gtApiFetch('/trazabilidad/entities').then(function(res){
      if(!res.ok) return;
      pruebasEntities = res.data;
      renderPruebasEntitySelect();
    });
  }

  // Barra horizontal de titulos (uno por categoria) con un desplegable vertical debajo de cada
  // uno — igual al menu del sistema de trazabilidad original, en vez de un <select> nativo.
  function renderPruebasEntitySelect(){
    var bar = document.getElementById('pruebasMenuBar');
    bar.innerHTML = '';
    var firstKey = null;
    ENTITY_GROUPS.forEach(function(group){
      if(group.adminOnly && pruebasVista === 'asociacion') return;
      var keys = group.keys.filter(function(k){ return pruebasEntities[k]; });
      if(keys.length === 0) return;
      if(!firstKey) firstKey = keys[0];

      var item = document.createElement('div');
      item.className = 'pm-item';

      var title = document.createElement('button');
      title.type = 'button';
      title.className = 'pm-title';
      title.textContent = group.label;
      title.addEventListener('click', function(e){
        e.stopPropagation();
        var wasOpen = item.classList.contains('open');
        closeAllPmDropdowns();
        if(!wasOpen) item.classList.add('open');
      });

      var dropdown = document.createElement('div');
      dropdown.className = 'pm-dropdown';
      keys.forEach(function(key){
        var link = document.createElement('a');
        link.textContent = pruebasEntities[key].label;
        link.title = ENTITY_HINTS[key] || '';
        link.dataset.entity = key;
        link.addEventListener('click', function(){
          selectPruebasEntity(key);
          closeAllPmDropdowns();
        });
        dropdown.appendChild(link);
      });

      item.appendChild(title);
      item.appendChild(dropdown);
      bar.appendChild(item);
    });

    pruebasCurrentEntity = pruebasCurrentEntity || firstKey;
    selectPruebasEntity(pruebasCurrentEntity);
  }

  function closeAllPmDropdowns(){
    document.querySelectorAll('.pm-item.open').forEach(function(i){ i.classList.remove('open'); });
  }
  document.addEventListener('click', closeAllPmDropdowns);

  function updatePmMenuActiveState(){
    document.querySelectorAll('.pm-item').forEach(function(item){
      var hasActive = false;
      item.querySelectorAll('a').forEach(function(a){
        var isActive = a.dataset.entity === pruebasCurrentEntity;
        a.classList.toggle('active', isActive);
        if(isActive) hasActive = true;
      });
      item.classList.toggle('has-active', hasActive);
    });
  }

  function selectPruebasEntity(key){
    pruebasCurrentEntity = key;
    updatePmMenuActiveState();
    var isBalanceMasas = key === 'balance_masas';
    document.getElementById('pruebasBalanceMasasEnv').style.display = isBalanceMasas ? 'block' : 'none';
    document.getElementById('pruebasGenericView').style.display = isBalanceMasas ? 'none' : 'block';
    if(isBalanceMasas){ initBmEnv(); return; }
    fetchAndRenderPruebasTable();
  }

  function fetchAndRenderPruebasTable(){
    var entity = pruebasEntities[pruebasCurrentEntity];
    document.getElementById('pruebasEntityTitle').textContent = entity.label;
    document.getElementById('pruebasImportMsg').textContent = '';

    var isCentrosAsCliente = pruebasCurrentEntity === 'centros' && pruebasVista === 'asociacion';
    document.getElementById('pruebasNewBtn').style.display = isCentrosAsCliente ? 'none' : '';
    document.getElementById('pruebasImportBtn').style.display = isCentrosAsCliente ? 'none' : '';

    // En Vista Asociación el filtro por centro lo hace el servidor (el LIMIT de 500 se aplica después
    // de filtrar, así los datos de la asociación nunca quedan tapados por los de otras).
    var query = '';
    if(pruebasVista === 'asociacion'){
      if(!pruebasDemoCentro){
        document.getElementById('pruebasTableBody').innerHTML = '<tr><td class="empty-row">No hay una asociación demo cargada.</td></tr>';
        document.getElementById('pruebasRowCount').textContent = '0 registros';
        return;
      }
      query = '?id_centro=' + pruebasDemoCentro.id;
    }
    gtApiFetch('/trazabilidad/' + pruebasCurrentEntity + query).then(function(res){
      var thead = document.getElementById('pruebasTableHead');
      var tbody = document.getElementById('pruebasTableBody');
      if(!res.ok){ tbody.innerHTML = '<tr><td class="empty-row">No se pudo cargar.</td></tr>'; return; }
      var rows = res.data;
      pruebasCurrentRows = rows;
      document.getElementById('pruebasRowCount').textContent = rows.length + (rows.length === 1 ? ' registro' : ' registros') +
        (rows.length >= 500 ? ' (se muestran los 500 más recientes)' : '');

      var headHtml = '<tr>';
      entity.fields.forEach(function(f){ headHtml += '<th>' + gtEscapeHtml(f.label) + '</th>'; });
      headHtml += '<th class="no-print"></th></tr>';
      thead.innerHTML = headHtml;

      if(rows.length === 0){
        tbody.innerHTML = '<tr><td class="empty-row" colspan="' + (entity.fields.length + 1) + '">Sin registros todavía.</td></tr>';
        return;
      }
      tbody.innerHTML = '';
      rows.forEach(function(row){
        var tr = document.createElement('tr');
        var html = '';
        entity.fields.forEach(function(f){
          var val = (f.type === 'select-entity' || f.type === 'select-catalogo') ? row[f.name + '_label'] : row[f.name];
          if(f.type === 'date' && val) val = gtFormatDate(val);
          if(f.type === 'select-fixed' && val !== null && val !== undefined){
            var fixedOpt = (f.options || []).find(function(o){ return String(o.value) === String(val); });
            if(fixedOpt) val = fixedOpt.label;
          }
          // Todo lo que viene de la base se escapa: un nombre con "<" no debe ejecutarse como HTML.
          html += '<td>' + (val === null || val === undefined || val === '' ? '—' : gtEscapeHtml(val)) + '</td>';
        });
        html += '<td class="no-print"><button type="button" class="cell-action" style="margin-right:10px;">Editar</button><button type="button" class="cell-action" style="color:#C0392B;">Eliminar</button></td>';
        tr.innerHTML = html;
        var actions = tr.lastElementChild.querySelectorAll('.cell-action');
        actions[0].addEventListener('click', function(){ openPruebasFormModal(row); });
        actions[1].addEventListener('click', function(){ deletePruebasRecord(row.id); });
        tbody.appendChild(tr);
      });
    });
  }

  function deletePruebasRecord(id){
    if(!confirm('¿Eliminar este registro de prueba?')) return;
    gtApiFetch('/trazabilidad/' + pruebasCurrentEntity + '/' + id, { method: 'DELETE' }).then(function(res){
      if(!res.ok) alert(res.data.error || 'No se pudo eliminar.');
      pruebasOptionsCache = {};
      fetchAndRenderPruebasTable();
    });
  }

  function getPruebasFieldOptions(field, callback){
    var cacheKey = pruebasCurrentEntity + ':' + field.name;
    if(pruebasOptionsCache[cacheKey]){ callback(pruebasOptionsCache[cacheKey]); return; }
    var url = field.type === 'select-catalogo'
      ? '/trazabilidad/catalogo-options/' + field.categoria
      : '/trazabilidad/' + field.entity + '/options?labelField=' + encodeURIComponent(field.labelField);
    gtApiFetch(url).then(function(res){
      var opts = res.ok ? res.data : [];
      pruebasOptionsCache[cacheKey] = opts;
      callback(opts);
    });
  }

  function openPruebasFormModal(existingRow){
    var entity = pruebasEntities[pruebasCurrentEntity];
    document.getElementById('pruebasFormModalTitle').textContent = (existingRow ? 'Editar — ' : 'Nuevo — ') + entity.label;
    document.getElementById('pruebasFormId').value = existingRow ? existingRow.id : '';
    document.getElementById('pruebasFormError').style.display = 'none';
    var container = document.getElementById('pruebasFormFields');
    container.innerHTML = '';

    entity.fields.forEach(function(f){
      var wrap = document.createElement('div');
      wrap.className = 'form-field';
      var label = document.createElement('label');
      label.textContent = f.label + (f.required ? ' *' : '');
      wrap.appendChild(label);

      var inputId = 'pruebasField_' + f.name;
      var input;
      if(f.type === 'select-fixed'){
        // Lista fija definida por el sistema: no se escribe a mano.
        input = document.createElement('select');
        input.id = inputId;
        var fixedOpts = f.options || [];
        var current = existingRow && existingRow[f.name] !== null && existingRow[f.name] !== undefined ? String(existingRow[f.name]) : '';
        var extra = current && !fixedOpts.some(function(o){ return String(o.value) === current; })
          ? '<option value="' + gtEscapeHtml(current) + '">' + gtEscapeHtml(current) + ' (valor anterior)</option>' : '';
        input.innerHTML = '<option value="">— Ninguno —</option>' + fixedOpts.map(function(o){
          return '<option value="' + gtEscapeHtml(o.value) + '">' + gtEscapeHtml(o.label) + '</option>';
        }).join('') + extra;
        input.value = current;
      } else if(f.type === 'select-entity' || f.type === 'select-catalogo'){
        input = document.createElement('select');
        input.id = inputId;
        input.innerHTML = '<option value="">Cargando…</option>';
        getPruebasFieldOptions(f, function(opts){
          input.innerHTML = '<option value="">— Ninguno —</option>' + opts.map(function(o){ return '<option value="' + gtEscapeHtml(o.value) + '">' + gtEscapeHtml(o.label) + '</option>'; }).join('');
          if(existingRow && existingRow[f.name] !== null && existingRow[f.name] !== undefined){
            input.value = existingRow[f.name];
          }
        });
      } else {
        input = document.createElement('input');
        input.id = inputId;
        input.type = f.type === 'date' ? 'date' : (f.type === 'number' || f.type === 'decimal' ? 'number' : 'text');
        if(f.type === 'decimal') input.step = '0.0001';
        // Sin negativos (salvo coordenadas) y sin fechas futuras en los campos que registran algo ya ocurrido.
        if((f.type === 'number' || f.type === 'decimal') && f.name !== 'latitud' && f.name !== 'longitud') input.min = '0';
        if(f.type === 'date' && /^fecha(_factura|_completada|_respuesta|_exp_documento|_nacimiento|_estado|_actualizacion)?$/.test(f.name)) input.max = gtTodayCO();
        if(existingRow && existingRow[f.name] !== null && existingRow[f.name] !== undefined){
          input.value = f.type === 'date' ? String(existingRow[f.name]).slice(0, 10) : existingRow[f.name];
        }
      }
      wrap.appendChild(input);
      container.appendChild(wrap);
    });

    document.getElementById('pruebasFormModalOverlay').classList.add('open');
  }

  function closePruebasFormModal(){
    document.getElementById('pruebasFormModalOverlay').classList.remove('open');
  }

  function savePruebasRecord(){
    var entity = pruebasEntities[pruebasCurrentEntity];
    var id = document.getElementById('pruebasFormId').value;
    var body = {};
    entity.fields.forEach(function(f){
      var el = document.getElementById('pruebasField_' + f.name);
      body[f.name] = el.value === '' ? null : el.value;
    });
    var errorEl = document.getElementById('pruebasFormError');
    errorEl.style.display = 'none';
    gtApiFetch(id ? '/trazabilidad/' + pruebasCurrentEntity + '/' + id : '/trazabilidad/' + pruebasCurrentEntity, {
      method: id ? 'PUT' : 'POST',
      body: JSON.stringify(body)
    }).then(function(res){
      if(!res.ok){ errorEl.textContent = res.data.error || 'No se pudo guardar.'; errorEl.style.display = 'block'; return; }
      pruebasOptionsCache = {}; // los desplegables de otros módulos deben ver el registro nuevo/editado
      closePruebasFormModal();
      fetchAndRenderPruebasTable();
    });
  }

  // ---- Importar / exportar / plantilla para el modulo generico ----
  function onPruebasImportFile(input){
    var file = input.files[0];
    if(!file) return;
    var msg = document.getElementById('pruebasImportMsg');
    msg.style.color = 'var(--ink-soft)';
    msg.textContent = 'Importando…';
    var formData = new FormData();
    formData.append('file', file);
    fetch(API_BASE + '/trazabilidad/' + pruebasCurrentEntity + '/import', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + gtGetToken() },
      body: formData
    }).then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(res){
        input.value = '';
        if(!res.ok){ msg.style.color = '#C0392B'; msg.textContent = (res.data.error || 'No se pudo importar.') + ' ' + (res.data.detalles && res.data.detalles.length > 1 ? '(' + res.data.detalles.length + ' filas con problemas; ver consola)' : ''); if(res.data.detalles) console.warn('Filas con problemas:', res.data.detalles); return; }
        msg.style.color = res.data.omitidos ? '#B45F06' : 'var(--green)';
        msg.textContent = 'Importados ' + res.data.importados + (res.data.omitidos ? ', omitidos ' + res.data.omitidos + '. ' + (res.data.detalles || []).slice(0, 3).join(' | ') : '.');
        if(res.data.omitidos && res.data.detalles && res.data.detalles.length) console.warn('Filas omitidas:', res.data.detalles);
        fetchAndRenderPruebasTable();
      })
      .catch(function(){ msg.style.color = '#C0392B'; msg.textContent = 'No se pudo importar.'; });
  }

  function downloadPruebasTemplate(){
    var msg = document.getElementById('pruebasImportMsg');
    msg.style.color = 'var(--ink-soft)';
    msg.textContent = 'Generando plantilla…';
    fetch(API_BASE + '/trazabilidad/' + pruebasCurrentEntity + '/template', {
      headers: { 'Authorization': 'Bearer ' + gtGetToken() }
    }).then(function(r){
      if(!r.ok) throw new Error('No se pudo generar la plantilla.');
      return r.blob();
    }).then(function(blob){
      msg.textContent = '';
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'plantilla_' + pruebasCurrentEntity + '.xlsx';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }).catch(function(){
      msg.style.color = '#C0392B';
      msg.textContent = 'No se pudo generar la plantilla.';
    });
  }

  function exportPruebasCsv(){
    var entity = pruebasEntities[pruebasCurrentEntity];
    if(pruebasCurrentRows.length === 0){ alert('No hay registros para exportar.'); return; }
    var headers = entity.fields.map(function(f){ return csvCell(f.label, ','); });
    var lines = [headers.join(',')];
    pruebasCurrentRows.forEach(function(row){
      lines.push(entity.fields.map(function(f){ return csvCell(exportValue(f, row), ','); }).join(','));
    });
    downloadBlob(lines.join('\r\n'), pruebasCurrentEntity + '.csv', 'text/csv;charset=utf-8;');
  }

  // Valor de una celda tal como se ve en pantalla (etiqueta en vez de id, lista fija en vez de codigo).
  function exportValue(f, row){
    var val = (f.type === 'select-entity' || f.type === 'select-catalogo') ? row[f.name + '_label'] : row[f.name];
    if(f.type === 'select-fixed' && val !== null && val !== undefined){
      var o = (f.options || []).find(function(x){ return String(x.value) === String(val); });
      if(o) val = o.label;
    }
    return val;
  }

  // Celda CSV: se entrecomilla si lleva separador, comillas o saltos de linea, y un texto que empieza
  // con = + - @ se neutraliza para que Excel no lo ejecute como formula.
  function csvCell(val, sep){
    var v = val === null || val === undefined ? '' : String(val);
    if(/^[=+\-@\t\r]/.test(v) && isNaN(Number(v))) v = "'" + v;
    return (v.indexOf(sep) !== -1 || v.indexOf('"') !== -1 || v.indexOf('\n') !== -1 || v.indexOf('\r') !== -1) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }

  function exportPruebasExcel(){
    var entity = pruebasEntities[pruebasCurrentEntity];
    if(pruebasCurrentRows.length === 0){ alert('No hay registros para exportar.'); return; }
    var headers = entity.fields.map(function(f){ return f.label; });
    var html = '<table><tr>' + headers.map(function(h){ return '<th>' + gtEscapeHtml(h) + '</th>'; }).join('') + '</tr>' +
      pruebasCurrentRows.map(function(row){
        return '<tr>' + entity.fields.map(function(f){
          var val = exportValue(f, row);
          return '<td>' + (val === null || val === undefined ? '' : gtEscapeHtml(val)) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</table>';
    downloadBlob(html, pruebasCurrentEntity + '.xls', 'application/vnd.ms-excel');
  }

  function downloadBlob(content, filename, mime){
    var blob = new Blob(['﻿' + content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---- Entorno propio: Balance de Masas (busca reciclador, llena la grilla del día, guarda) ----
  var bmAllRecicladores = null;
  var bmAllMateriales = null;
  var bmSelectedReciclador = null;
  var bmExistingByMaterial = {};

  var BM_MESES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var BM_DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

  function toggleBmReportes(){
    var box = document.getElementById('bmReportes');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  }

  function fmtNum(n){
    return Number(n || 0).toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // Titulo de la grilla: fecha larga + dia de la semana, armados desde los digitos del string
  // (sin pasar por Date/zona horaria) para que nunca se corra un dia en Colombia.
  function updateBmFechaTitulo(){
    var f = document.getElementById('bmFecha').value;
    if(!f){ document.getElementById('bmFechaTitulo').textContent = '—'; document.getElementById('bmDiaSemana').textContent = ''; return; }
    var p = f.split('-').map(Number);
    var dia = BM_DIAS[new Date(p[0], p[1] - 1, p[2]).getDay()];
    document.getElementById('bmFechaTitulo').textContent = p[2] + ' de ' + BM_MESES_LARGO[p[1] - 1] + ' de ' + p[0];
    document.getElementById('bmDiaSemana').textContent = dia;
  }

  function setBmFormEnabled(on){
    ['bmBodega', 'bmMacrorruta', 'bmMicrorruta1', 'bmMicrorruta2'].forEach(function(id){ document.getElementById(id).disabled = !on; });
  }

  // Suma dias a una fecha 'YYYY-MM-DD' sin pasar por la zona horaria del navegador.
  function addDaysYmd(ymd, n){
    var p = ymd.split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
  }

  var bmDirty = false;          // hay cantidades escritas que todavia no se guardan
  var bmLoadSeq = 0;            // descarta respuestas viejas si el usuario cambia de dia/reciclador rapido

  function initBmEnv(){
    bmSelectedReciclador = null;
    bmExistingByMaterial = {};
    bmValues = {};
    bmDirty = false;
    bmAllRecicladores = null; // se vuelve a pedir cada vez: si se creo un reciclador en otro modulo, debe aparecer
    ['bmNombre', 'bmCedula', 'bmTipoVehiculo', 'bmPlaca'].forEach(function(id){ document.getElementById(id).value = ''; });
    ['bmBodega', 'bmMacrorruta', 'bmMicrorruta1', 'bmMicrorruta2'].forEach(function(id){ document.getElementById(id).innerHTML = '<option value="">— Seleccionar —</option>'; });
    setBmFormEnabled(false);
    var hoy = gtTodayCO();
    var fechaInput = document.getElementById('bmFecha');
    if(!fechaInput.value) fechaInput.value = hoy;
    fechaInput.max = hoy;
    bmLastFecha = fechaInput.value;
    var desdeInput = document.getElementById('bmExportDesde');
    var hastaInput = document.getElementById('bmExportHasta');
    if(!hastaInput.value) hastaInput.value = hoy;
    if(!desdeInput.value) desdeInput.value = addDaysYmd(hoy, -30);

    var centroQuery = (pruebasVista === 'asociacion' && pruebasDemoCentro) ? '&id_centro=' + pruebasDemoCentro.id : '';
    var loadRecicladores = gtApiFetch('/trazabilidad/recicladores?limit=5000' + centroQuery).then(function(res){ bmAllRecicladores = res.ok ? res.data : []; });
    var loadMateriales = bmAllMateriales ? Promise.resolve() : gtApiFetch('/trazabilidad/tipos_material?limit=5000').then(function(res){ bmAllMateriales = res.ok ? res.data : []; });
    Promise.all([loadRecicladores, loadMateriales]).then(function(){
      var familias = ['--Todos los materiales'].concat(Array.from(new Set(bmAllMateriales.map(function(m){ return m.desc_familia; }))).filter(Boolean));
      var sel = document.getElementById('bmFamiliaFilter');
      sel.innerHTML = familias.map(function(f){ return '<option value="' + gtEscapeHtml(f) + '">' + gtEscapeHtml(f) + '</option>'; }).join('');
      renderBmGrid();
    });
    updateBmFechaTitulo();

    var mesSel = document.getElementById('bmPlanillaMes');
    if(!mesSel.options.length){
      var meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
      var hoy = new Date();
      mesSel.innerHTML = meses.map(function(m, i){ return '<option value="' + (i + 1) + '">' + m + '</option>'; }).join('');
      mesSel.value = hoy.getMonth() + 1;
      document.getElementById('bmPlanillaAnio').value = hoy.getFullYear();
    }
  }

  // ---- Planillas de recepcion mensuales por reciclador (comprobante de lo entregado por
  // semana), descargadas como un .zip con un PDF por reciclador que tuvo entregas ese mes. ----
  function descargarPlanillasZip(){
    var idCentro = pruebasVista === 'asociacion' && pruebasDemoCentro ? pruebasDemoCentro.id : '';
    if(!idCentro){ alert('Elige la vista "Asociación" (o selecciona un centro) para saber de qué asociación generar las planillas.'); return; }
    var mes = document.getElementById('bmPlanillaMes').value;
    var anio = document.getElementById('bmPlanillaAnio').value;
    if(!anio){ alert('Escribe el año.'); return; }
    var msg = document.getElementById('bmPlanillaMsg');
    msg.style.color = 'var(--ink-soft)';
    msg.textContent = 'Generando planillas…';
    var url = API_BASE + '/trazabilidad/planillas-recepcion?anio=' + anio + '&mes=' + mes + '&id_centro=' + idCentro;
    fetch(url, { headers: { 'Authorization': 'Bearer ' + gtGetToken() } }).then(function(r){
      if(!r.ok) return r.json().then(function(data){ throw new Error(data.error || 'No se pudo generar.'); });
      return r.blob();
    }).then(function(blob){
      msg.textContent = '';
      var blobUrl = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = blobUrl;
      a.download = 'Planillas_Recepcion_' + document.getElementById('bmPlanillaMes').selectedOptions[0].textContent + anio + '.zip';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);
    }).catch(function(err){
      msg.style.color = '#C0392B';
      msg.textContent = err.message;
    });
  }

  // ---- Ventana de busqueda de reciclador (filtros por documento, nombre y asociacion) ----
  function openBmPicker(){
    if(!bmAllRecicladores){ return; }
    ['bmPickDoc', 'bmPickNombre', 'bmPickAsoc'].forEach(function(id){ document.getElementById(id).value = ''; });
    renderBmPicker();
    document.getElementById('bmPickerOverlay').classList.add('open');
    document.getElementById('bmPickNombre').focus();
  }
  function closeBmPicker(){ document.getElementById('bmPickerOverlay').classList.remove('open'); }

  function renderBmPicker(){
    var doc = document.getElementById('bmPickDoc').value.trim().toLowerCase();
    var nombre = document.getElementById('bmPickNombre').value.trim().toLowerCase();
    var asoc = document.getElementById('bmPickAsoc').value.trim().toLowerCase();
    var list = bmAllRecicladores.filter(function(r){
      if(pruebasVista === 'asociacion' && (!pruebasDemoCentro || r.id_centro !== pruebasDemoCentro.id)) return false;
      return (r.nro_documento || '').toLowerCase().indexOf(doc) !== -1 &&
        (r.nombre_completo || '').toLowerCase().indexOf(nombre) !== -1 &&
        (r.id_centro_label || '').toLowerCase().indexOf(asoc) !== -1;
    }).sort(function(a, b){ return (a.nombre_completo || '').localeCompare(b.nombre_completo || ''); }).slice(0, 200);
    var box = document.getElementById('bmPickList');
    if(list.length === 0){ box.innerHTML = '<p style="padding:12px;color:var(--ink-soft);font-size:12px;">Sin resultados.</p>'; return; }
    box.innerHTML = list.map(function(r){
      return '<div class="bm-pick-row" data-id="' + r.id + '"><span>' + gtEscapeHtml(r.nro_documento) + '</span><span>' + gtEscapeHtml(r.nombre_completo) + '</span><span>' + gtEscapeHtml(r.id_centro_label) + '</span></div>';
    }).join('');
    box.querySelectorAll('.bm-pick-row').forEach(function(row){
      row.addEventListener('click', function(){ selectBmReciclador(Number(row.getAttribute('data-id'))); });
    });
  }

  function fillBmSelect(id, rows, labelFn){
    var sel = document.getElementById(id);
    sel.innerHTML = '<option value="">— Seleccionar —</option>' + rows.map(function(r){ return '<option value="' + r.id + '">' + gtEscapeHtml(labelFn(r)) + '</option>'; }).join('');
  }

  // Si hay cantidades escritas sin guardar, pregunta antes de cambiar de dia o de reciclador
  // (antes se perdian en silencio al cambiar la fecha).
  function bmConfirmDiscard(){
    return !bmDirty || confirm('Tienes cantidades sin guardar. Si continúas se pierden. ¿Continuar?');
  }

  function selectBmReciclador(id){
    var chosen = bmAllRecicladores.find(function(r){ return r.id === id; });
    if(!chosen) return;
    if(!bmConfirmDiscard()) return;
    bmSelectedReciclador = chosen;
    bmDirty = false;
    closeBmPicker();
    document.getElementById('bmNombre').value = bmSelectedReciclador.nombre_completo || '';
    document.getElementById('bmCedula').value = bmSelectedReciclador.nro_documento || '';
    document.getElementById('bmTipoVehiculo').value = bmSelectedReciclador.tipo_de_vehiculo || '';
    document.getElementById('bmPlaca').value = bmSelectedReciclador.placa || '';
    setBmFormEnabled(true);

    var qc = '?limit=5000&id_centro=' + bmSelectedReciclador.id_centro;
    var seqReciclador = bmSelectedReciclador;
    Promise.all([
      gtApiFetch('/trazabilidad/bodegas' + qc),
      gtApiFetch('/trazabilidad/macrorrutas' + qc),
      gtApiFetch('/trazabilidad/microrrutas' + qc),
      gtApiFetch('/trazabilidad/microrrutas_detalle' + qc)
    ]).then(function(results){
      if(bmSelectedReciclador !== seqReciclador) return; // ya eligio a otro reciclador
      var idc = bmSelectedReciclador.id_centro;
      var bodegas = (results[0].ok ? results[0].data : []).filter(function(b){ return b.id_centro === idc; });
      var macrorrutas = (results[1].ok ? results[1].data : []).filter(function(m){ return m.id_centro === idc; });
      var misMicro = (results[2].ok ? results[2].data : []).filter(function(m){ return m.id_reciclador === bmSelectedReciclador.id; }).map(function(m){ return m.id; });
      var detalles = (results[3].ok ? results[3].data : []).filter(function(d){ return misMicro.indexOf(d.id_formulario_microrruta) !== -1; });
      fillBmSelect('bmBodega', bodegas, function(b){ return (b.cod_bodega || '') + ' - ' + (b.desc_bodega || ''); });
      fillBmSelect('bmMacrorruta', macrorrutas, function(m){ return (m.cod_macrorruta || '') + ' - ' + (m.desc_macrorruta || ''); });
      var microLabel = function(d){ return d.desc_microrruta || ('Microrruta ' + d.id); };
      fillBmSelect('bmMicrorruta1', detalles, microLabel);
      fillBmSelect('bmMicrorruta2', detalles, microLabel);
      loadBmDia();
    });
  }

  // Lo escrito en la grilla vive en memoria para TODOS los materiales (no solo los que el filtro de
  // familia deja visibles): asi cambiar el filtro no pierde lo digitado, y guardar no borra por
  // error los materiales de otras familias que ya estaban registrados ese dia.
  var bmValues = {};
  var BM_FIELDS = ['cantidad', 'valor', 'cantidad_rechazo', 'cantidad_nosui'];
  var BM_MAX = 99999999;
  var bmLastFecha = null;

  function bmValuesFromExisting(){
    bmValues = {};
    Object.keys(bmExistingByMaterial).forEach(function(id){
      var e = bmExistingByMaterial[id];
      bmValues[id] = {};
      BM_FIELDS.forEach(function(f){ var n = Number(e[f]); bmValues[id][f] = n ? String(n) : ''; });
    });
  }

  function bmNum(v){ return v === undefined || v === null || v === '' ? 0 : Number(v); }
  function bmMaterialName(id){
    var m = (bmAllMateriales || []).find(function(x){ return String(x.id) === String(id); });
    return m ? m.desc_tipo_material : ('Material ' + id);
  }

  // Problema de UNA fila (texto) o '' si esta bien. Mismas reglas que valida el servidor.
  function bmRowProblem(id){
    var v = bmValues[id];
    if(!v) return '';
    var q = bmNum(v.cantidad), p = bmNum(v.valor), r = bmNum(v.cantidad_rechazo), n = bmNum(v.cantidad_nosui);
    if(!(q || p || r || n)) return '';
    if([q, p, r, n].some(function(x){ return isNaN(x) || x < 0; })) return 'no se permiten valores negativos ni texto.';
    if([q, p, r, n].some(function(x){ return x > BM_MAX; })) return 'hay un número demasiado grande.';
    if(!(q > 0)) return 'escribe la cantidad de material (kg).';
    if(r > q) return 'el rechazo (' + fmtNum(r) + ' kg) no puede ser mayor que la cantidad de material (' + fmtNum(q) + ' kg).';
    if(n > q) return 'la cantidad no SUI (' + fmtNum(n) + ' kg) no puede ser mayor que la cantidad de material (' + fmtNum(q) + ' kg).';
    return '';
  }

  function bmProblems(){
    var out = [];
    Object.keys(bmValues).forEach(function(id){
      var p = bmRowProblem(id);
      if(p) out.push(bmMaterialName(id) + ': ' + p);
    });
    var fecha = document.getElementById('bmFecha').value;
    if(!fecha) out.unshift('Elige la fecha.');
    else if(fecha > gtTodayCO()) out.unshift('No se puede registrar material con fecha futura.');
    var m1 = document.getElementById('bmMicrorruta1').value, m2 = document.getElementById('bmMicrorruta2').value;
    if(m1 && m1 === m2) out.unshift('Microrruta 1 y Microrruta 2 no pueden ser la misma.');
    return out;
  }

  function onBmFechaChange(){
    var input = document.getElementById('bmFecha');
    if(!bmConfirmDiscard()){ input.value = bmLastFecha || input.value; updateBmFechaTitulo(); return; }
    bmLastFecha = input.value;
    loadBmDia();
  }

  function loadBmDia(){
    updateBmFechaTitulo();
    if(!bmSelectedReciclador){ renderBmGrid(); return; }
    var fecha = document.getElementById('bmFecha').value;
    if(!fecha){ return; }
    bmLastFecha = fecha;
    var seq = ++bmLoadSeq;
    var recAtRequest = bmSelectedReciclador;
    gtApiFetch('/trazabilidad/balance-masas-dia?id_reciclador=' + bmSelectedReciclador.id + '&fecha=' + fecha).then(function(res){
      // Si mientras tanto cambio el dia o el reciclador, esta respuesta es de otro dia: se descarta
      // (si no, se veian los datos de un dia bajo otra fecha y al guardar se pisaba el dia equivocado).
      if(seq !== bmLoadSeq || recAtRequest !== bmSelectedReciclador) return;
      bmDirty = false;
      bmExistingByMaterial = {};
      var rows = res.ok ? res.data : [];
      rows.forEach(function(row){ bmExistingByMaterial[row.id_tipo_material] = row; });
      bmValuesFromExisting();
      // Los selectores del encabezado son del dia completo: se restauran desde la primera fila guardada.
      var first = rows[0] || {};
      document.getElementById('bmBodega').value = first.id_bodega || '';
      document.getElementById('bmMacrorruta').value = first.id_macrorruta || '';
      document.getElementById('bmMicrorruta1').value = first.id_microrruta_1 || '';
      document.getElementById('bmMicrorruta2').value = first.id_microrruta_2 || '';
      renderBmGrid();
    });
  }

  function updateBmTotals(){
    var sc = 0, sv = 0, sr = 0, sn = 0;
    Object.keys(bmValues).forEach(function(id){
      var v = bmValues[id];
      var q = bmNum(v.cantidad), p = bmNum(v.valor);
      if(!isNaN(q)) sc += q;
      if(!isNaN(q) && !isNaN(p)) sv += q * p;
      if(!isNaN(bmNum(v.cantidad_rechazo))) sr += bmNum(v.cantidad_rechazo);
      if(!isNaN(bmNum(v.cantidad_nosui))) sn += bmNum(v.cantidad_nosui);
    });
    document.querySelectorAll('#bmGridBody tr').forEach(function(tr){
      var id = tr.getAttribute('data-mat');
      var v = bmValues[id] || {};
      var t = bmNum(v.cantidad) * bmNum(v.valor);
      tr.querySelector('.bm-tot').textContent = t ? fmtNum(t) : '';
      var problem = bmRowProblem(id);
      var q = bmNum(v.cantidad);
      var badBy = {
        cantidad: !!problem && !(q > 0),
        valor: !!problem && bmNum(v.valor) < 0,
        cantidad_rechazo: !!problem && (bmNum(v.cantidad_rechazo) > q || bmNum(v.cantidad_rechazo) < 0),
        cantidad_nosui: !!problem && (bmNum(v.cantidad_nosui) > q || bmNum(v.cantidad_nosui) < 0)
      };
      tr.querySelectorAll('input').forEach(function(inp){
        var bad = !!badBy[inp.getAttribute('data-field')];
        inp.classList.toggle('bm-bad', bad);
        inp.title = bad ? problem : '';
      });
    });
    // Los totales son los del dia completo (todos los materiales), no solo los que muestra el filtro.
    document.getElementById('bmTotCantidad').textContent = fmtNum(sc);
    document.getElementById('bmTotValor').textContent = fmtNum(sv);
    document.getElementById('bmTotRechazo').textContent = fmtNum(sr);
    document.getElementById('bmTotNoSui').textContent = fmtNum(sn);
  }

  function renderBmGrid(){
    if(!bmAllMateriales) return;
    var familia = document.getElementById('bmFamiliaFilter').value || '--Todos los materiales';
    var ordenados = bmAllMateriales.slice().sort(function(a,b){ return (a.secuencia_orden || 0) - (b.secuencia_orden || 0); });
    var list = familia === '--Todos los materiales' ? ordenados : ordenados.filter(function(m){ return m.desc_familia === familia; });
    var tbody = document.getElementById('bmGridBody');
    tbody.innerHTML = '';
    var dis = bmSelectedReciclador ? '' : ' disabled';
    list.forEach(function(m){
      var v = bmValues[m.id] || {};
      var tr = document.createElement('tr');
      tr.setAttribute('data-mat', m.id);
      var cell = function(field, step){
        return '<td><input type="number" min="0" max="' + BM_MAX + '" step="' + step + '" data-mat="' + m.id + '" data-field="' + field + '" value="' + gtEscapeHtml(v[field] || '') + '"' + dis + '></td>';
      };
      tr.innerHTML = '<td>' + gtEscapeHtml(m.desc_tipo_material) + '</td>' + cell('cantidad', '0.0001') + cell('valor', '0.01') +
        '<td class="bm-tot"></td>' + cell('cantidad_rechazo', '0.0001') + cell('cantidad_nosui', '0.0001');
      tbody.appendChild(tr);
    });
    updateBmTotals();
  }

  document.addEventListener('input', function(e){
    var inp = e.target;
    if(!(inp.closest && inp.closest('#bmGridBody') && inp.getAttribute('data-mat'))) return;
    var id = inp.getAttribute('data-mat');
    bmValues[id] = bmValues[id] || {};
    bmValues[id][inp.getAttribute('data-field')] = inp.value;
    bmDirty = true;
    updateBmTotals();
  });

  function deleteBmDia(){
    if(!bmSelectedReciclador){ alert('Primero busca y selecciona un reciclador.'); return; }
    if(!confirm('¿Borrar todo lo registrado de ' + bmSelectedReciclador.nombre_completo + ' el ' + formatDateStrLocal(document.getElementById('bmFecha').value) + '?')) return;
    var msg = document.getElementById('bmSaveMsg');
    gtApiFetch('/trazabilidad/balance-masas-dia', {
      method: 'POST',
      body: JSON.stringify({ id_centro: bmSelectedReciclador.id_centro, id_reciclador: bmSelectedReciclador.id, fecha: document.getElementById('bmFecha').value, materiales: [] })
    }).then(function(res){
      msg.style.color = res.ok ? 'var(--green)' : '#C0392B';
      msg.textContent = res.ok ? 'Día borrado.' : (res.data.error || 'No se pudo borrar.');
      if(res.ok){ bmDirty = false; loadBmDia(); }
    });
  }

  function saveBmDia(){
    if(!bmSelectedReciclador) return;
    var msg = document.getElementById('bmSaveMsg');
    var problems = bmProblems();
    if(problems.length){
      msg.style.color = '#C0392B';
      msg.textContent = problems[0] + (problems.length > 1 ? ' (y ' + (problems.length - 1) + ' problema(s) más)' : '');
      return;
    }
    var materiales = Object.keys(bmValues).map(function(id){
      var v = bmValues[id];
      return { id_tipo_material: Number(id), cantidad: bmNum(v.cantidad), valor: bmNum(v.valor), cantidad_rechazo: bmNum(v.cantidad_rechazo), cantidad_nosui: bmNum(v.cantidad_nosui) };
    });
    msg.style.color = 'var(--ink-soft)';
    msg.textContent = 'Guardando…';
    gtApiFetch('/trazabilidad/balance-masas-dia', {
      method: 'POST',
      body: JSON.stringify({
        id_centro: bmSelectedReciclador.id_centro,
        id_reciclador: bmSelectedReciclador.id,
        id_bodega: document.getElementById('bmBodega').value || null,
        id_macrorruta: document.getElementById('bmMacrorruta').value || null,
        id_microrruta_1: document.getElementById('bmMicrorruta1').value || null,
        id_microrruta_2: document.getElementById('bmMicrorruta2').value || null,
        fecha: document.getElementById('bmFecha').value,
        materiales: materiales
      })
    }).then(function(res){
      if(!res.ok){ msg.style.color = '#C0392B'; msg.textContent = res.data.error || 'No se pudo guardar.'; return; }
      msg.style.color = 'var(--green)';
      msg.textContent = 'Guardado (' + res.data.filas + ' materiales con datos).';
      bmDirty = false;
      loadBmDia();
    });
  }

  // ---- Reporte de periodo de Balance de Masas: mismas columnas que el sistema de trazabilidad
  // original (el que recibe la Superintendencia), pero por rango de fechas y para toda la
  // asociacion (o todas, en vista Administrador) en vez de un solo reciclador/dia.
  // Las 11 columnas EXACTAS del formato "Balance de Masas" que valida el SUI (Anexo A del
  // Instructivo de cargue de aprovechamiento), en el mismo orden, con los codigos numericos
  // que exige el validador (no texto libre): tipo de identificacion 1=CC/2=CE/3=Pasaporte/4=NIT,
  // tipo de sitio de destino 1=Relleno sanitario/2=Estacion de transferencia. La cantidad y el
  // rechazo se capturan en kg pero el formato pide toneladas, por eso se dividen entre 1000.
  // El "numero de semana" es la semana DENTRO DEL MES (1 a 5), no la semana del año.
  // kg -> toneladas con 4 decimales (sin colas de coma flotante tipo 0.012300000000000002).
  function bmToTon(kg){ return Math.round(Number(kg || 0) / 1000 * 10000) / 10000; }

  function bmReportRowToOldFormat(row){
    var fechaStr = String(row.fecha).slice(0, 10);
    var diaDelMes = Number(fechaStr.split('-')[2]);
    var numeroSemana = Math.min(5, Math.ceil(diaDelMes / 7));
    return {
      NUECA: row.cod_bodega || '',
      NUMACRO: row.cod_macrorruta || '',
      'Numero de semana': numeroSemana,
      'Tipo identificacion reciclador': row.codigo_tipo_identificacion || '',
      'Numero identificacion reciclador': row.nro_documento || '',
      Placa: row.placa || '',
      'Cantidad material entrante (Ton)': bmToTon(row.cantidad),
      'Tipo material entrante': row.cod_tipo_material || '',
      'Rechazo material entrante (Ton)': bmToTon(row.cantidad_rechazo),
      'Tipo sitio destino': row.codigo_tipo_destino || '',
      'Numero sitio destino': row.numero_sitio_destino || ''
    };
  }

  function fetchBmReportRows(callback, onFail){
    var desde = document.getElementById('bmExportDesde').value;
    var hasta = document.getElementById('bmExportHasta').value;
    if(!desde || !hasta){ alert('Elige el rango de fechas (desde y hasta).'); if(onFail) onFail(); return; }
    var idCentro = (pruebasVista === 'asociacion' && pruebasDemoCentro) ? pruebasDemoCentro.id : '';
    var url = '/trazabilidad/balance-masas-export?desde=' + desde + '&hasta=' + hasta + (idCentro ? '&id_centro=' + idCentro : '');
    gtApiFetch(url).then(function(res){
      if(!res.ok){ alert(res.data.error || 'No se pudo generar el reporte.'); if(onFail) onFail(); return; }
      if(res.data.length === 0){ alert('No hay datos de balance de masas en ese rango de fechas.'); if(onFail) onFail(); return; }
      var rows = res.data.map(bmReportRowToOldFormat);
      // El validador del SUI rechaza filas con campos obligatorios vacios: se avisa ANTES de descargar.
      var required = ['NUECA', 'NUMACRO', 'Tipo identificacion reciclador', 'Numero identificacion reciclador', 'Tipo material entrante', 'Tipo sitio destino', 'Numero sitio destino'];
      var faltantes = {};
      rows.forEach(function(r){ required.forEach(function(k){ if(r[k] === '' || r[k] === null || r[k] === undefined) faltantes[k] = (faltantes[k] || 0) + 1; }); });
      var keys = Object.keys(faltantes);
      if(keys.length){
        var detalle = keys.map(function(k){ return k + ': ' + faltantes[k] + ' fila(s)'; }).join('\n');
        if(!confirm('Ojo: hay campos obligatorios vacíos que el SUI va a rechazar:\n\n' + detalle + '\n\n(Se completan en Recicladores, Bodegas/ECA, Macrorrutas, Tipos de material y en el destino del rechazo del Centro.)\n\n¿Descargar de todas formas?')){ if(onFail) onFail(); return; }
      }
      callback(rows, desde, hasta);
    });
  }

  function exportBmReporte(kind){
    fetchBmReportRows(function(rows, desde, hasta){
      var headers = Object.keys(rows[0]);
      var filenameBase = 'balance_masas_' + desde + '_a_' + hasta;
      if(kind === 'xlsx'){
        var html = '<table><tr>' + headers.map(function(h){ return '<th>' + gtEscapeHtml(h) + '</th>'; }).join('') + '</tr>' +
          rows.map(function(r){ return '<tr>' + headers.map(function(h){ return '<td>' + gtEscapeHtml(r[h]) + '</td>'; }).join('') + '</tr>'; }).join('') +
          '</table>';
        downloadBlob(html, filenameBase + '.xls', 'application/vnd.ms-excel');
      } else {
        var sep = kind === 'csv-semicolon' ? ';' : ',';
        var lines = [headers.join(sep)];
        rows.forEach(function(r){
          lines.push(headers.map(function(h){ return csvCell(r[h], sep); }).join(sep));
        });
        downloadBlob(lines.join('\r\n'), filenameBase + '.csv', 'text/csv;charset=utf-8;');
      }
    });
  }

  // gtFormatDate hace "new Date(str)" y muestra en la hora local del navegador: para un valor
  // 'YYYY-MM-DD' puro (como el de un <input type="date">, sin hora ni zona horaria) eso lo
  // interpreta como medianoche UTC, y en cualquier huso detras de UTC (Bogota es UTC-5) se ve
  // un dia antes. Esta version arma el texto directo desde el string, sin pasar por Date.
  function formatDateStrLocal(dateStr){
    if(!dateStr) return '—';
    var parts = String(dateStr).slice(0, 10).split('-');
    if(parts.length !== 3) return dateStr;
    var meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    var mesIdx = Number(parts[1]) - 1;
    return Number(parts[2]) + ' de ' + (meses[mesIdx] || parts[1]) + ' de ' + parts[0];
  }

  // ---- Comprobante (factura) del dia: el PDF es solo para esto — lo que un reciclador entrego ese
  // dia especifico, con el valor de cada material y el total a pagar, en un documento con
  // encabezado de la asociacion (logo), datos del reciclador y de la operacion, referencias y
  // firmas, como el "Balance de masas" del sistema original. No aplica al reporte de periodo
  // (ese solo se exporta a Excel/CSV, en el formato de la Super).
  function bmSelText(id){
    var s = document.getElementById(id);
    var o = s.options[s.selectedIndex];
    return (o && s.value) ? o.textContent.trim() : '';
  }

  var bmCentrosCache = null;
  function getBmCentro(idCentro){
    var pick = function(list){ return (list || []).find(function(c){ return c.id === idCentro; }) || {}; };
    if(bmCentrosCache) return Promise.resolve(pick(bmCentrosCache));
    return gtApiFetch('/trazabilidad/centros').then(function(res){
      bmCentrosCache = res.ok ? res.data : [];
      return pick(bmCentrosCache);
    }).catch(function(){ return {}; });
  }

  function printBmGrid(){
    if(!bmSelectedReciclador){ alert('Busca y selecciona un reciclador primero.'); return; }
    var rows = [];
    var tot = { cantidad: 0, valorTotal: 0, rechazo: 0, nosui: 0 };
    var problemas = bmProblems();
    if(problemas.length){ alert('Corrige esto antes de imprimir:\n' + problemas.slice(0, 5).join('\n')); return; }
    // Se imprime el dia completo (todos los materiales con datos), aunque el filtro de familia muestre solo algunos.
    (bmAllMateriales || []).slice().sort(function(a, b){ return (a.secuencia_orden || 0) - (b.secuencia_orden || 0); }).forEach(function(m){
      var v = bmValues[m.id];
      if(!v) return;
      var cantidad = bmNum(v.cantidad), valor = bmNum(v.valor), rechazo = bmNum(v.cantidad_rechazo), nosui = bmNum(v.cantidad_nosui);
      if(!cantidad && !valor && !rechazo && !nosui) return;
      var valorTotal = cantidad * valor;
      rows.push({ material: m.desc_tipo_material, cantidad: cantidad, valor: valor, valorTotal: valorTotal, rechazo: rechazo, nosui: nosui });
      tot.cantidad += cantidad; tot.valorTotal += valorTotal; tot.rechazo += rechazo; tot.nosui += nosui;
    });
    if(rows.length === 0){ alert('No hay cantidades registradas ese día.'); return; }
    if(bmDirty && !confirm('Hay cantidades sin guardar. El comprobante las incluye, pero todavía no están en el sistema. ¿Imprimir de todos modos?')) return;
    var fecha = document.getElementById('bmFecha').value;
    var r = bmSelectedReciclador;
    var doc = {
      fecha: fecha,
      diaSemana: document.getElementById('bmDiaSemana').textContent,
      numero: 'BM-' + fecha.replace(/-/g, '') + '-' + String(r.id).padStart(4, '0'),
      reciclador: { nombre: r.nombre_completo, documento: r.nro_documento, vehiculo: r.tipo_de_vehiculo, placa: r.placa },
      eca: bmSelText('bmBodega'), macrorruta: bmSelText('bmMacrorruta'),
      micro1: bmSelText('bmMicrorruta1'), micro2: bmSelText('bmMicrorruta2'),
      rows: rows, tot: tot
    };
    openFacturaWindow(doc, r.id_centro);
  }

  // La ventana se abre en el mismo instante del clic (si no, el navegador la bloquea) y recien
  // despues se piden los datos de la asociacion y su logo para armar el documento.
  function openFacturaWindow(doc, idCentro){
    var win = window.open('', '_blank', 'width=960,height=760');
    if(!win){ alert('El navegador bloqueó la ventana de impresión. Habilita las ventanas emergentes para este sitio.'); return; }
    win.document.open();
    win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Generando…</title></head><body style="font-family:Arial;color:#5B6B7C;padding:24px;">Preparando el documento…</body></html>');
    win.document.close();
    var logoReq = idCentro
      ? gtApiFetch('/trazabilidad/centro-logo/' + idCentro).then(function(res){ return res.ok ? res.data.logo_url : null; }).catch(function(){ return null; })
      : Promise.resolve(null);
    Promise.all([getBmCentro(idCentro), logoReq]).then(function(out){
      writeFacturaDocument(win, doc, out[0], out[1]);
    });
  }

  function writeFacturaDocument(win, doc, centro, logoUrl){
    if(win.closed) return;
    var esc = function(v){ return gtEscapeHtml(v === null || v === undefined ? '' : v); };
    var dash = function(v){ return v ? esc(v) : '<span class="muted">—</span>'; };
    var num = function(n, d){ return Number(n || 0).toLocaleString('es-CO', { minimumFractionDigits: d, maximumFractionDigits: d }); };
    var money = function(n){ return '$ ' + Number(n || 0).toLocaleString('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); };
    var generado = new Date().toLocaleString('es-CO', { timeZone: 'America/Bogota', dateStyle: 'long', timeStyle: 'short' });
    var orgName = centro.desc_centro || 'Asociación';
    var contacto = [centro.direccion, centro.telefono, centro.correo].filter(Boolean).map(esc).join(' &nbsp;·&nbsp; ');
    var logoHtml = logoUrl
      ? '<img class="logo" src="' + esc(logoUrl) + '" alt="Logo">'
      : '<div class="logo mono">' + esc(gtAssocInitials(orgName)) + '</div>';

    var body = doc.rows.map(function(x){
      return '<tr><td class="l">' + esc(x.material) + '</td><td>' + num(x.cantidad, 2) + '</td><td>' + (x.valor ? money(x.valor) : '') + '</td>' +
        '<td class="b">' + (x.valorTotal ? money(x.valorTotal) : '') + '</td><td>' + (x.rechazo ? num(x.rechazo, 2) : '') + '</td><td>' + (x.nosui ? num(x.nosui, 2) : '') + '</td></tr>';
    }).join('');

    var css =
      '@page{ size:A4; margin:12mm; }' +
      '*{ box-sizing:border-box; }' +
      'html,body{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }' +
      'body{ font-family:"Segoe UI",Arial,Helvetica,sans-serif; color:#1B2733; margin:0; padding:0; font-size:12px; }' +
      '.page{ max-width:190mm; margin:0 auto; padding:6px 2px 0; }' +
      '.top{ display:flex; justify-content:space-between; align-items:center; gap:18px; padding-bottom:14px; border-bottom:3px solid #F2941F; }' +
      '.org{ display:flex; align-items:center; gap:14px; min-width:0; }' +
      '.logo{ width:76px; height:76px; object-fit:contain; border-radius:10px; flex:none; }' +
      '.logo.mono{ display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#0A3369,#1a57a8); color:#fff; font-weight:800; font-size:26px; letter-spacing:1px; }' +
      '.org h2{ margin:0 0 3px; font-size:17px; color:#0A3369; line-height:1.2; }' +
      '.org .nit{ font-size:12px; font-weight:600; color:#1B2733; }' +
      '.org .contact{ font-size:10.5px; color:#5B6B7C; margin-top:3px; }' +
      '.ref{ text-align:right; flex:none; }' +
      '.ref .kind{ font-size:10px; letter-spacing:1.4px; text-transform:uppercase; color:#5B6B7C; }' +
      '.ref .num{ font-size:19px; font-weight:800; color:#0A3369; margin:2px 0; font-variant-numeric:tabular-nums; }' +
      '.ref .date{ font-size:11.5px; color:#1B2733; }' +
      '.title{ display:flex; align-items:center; justify-content:space-between; margin:16px 0 12px; }' +
      '.title h1{ margin:0; font-size:22px; color:#0A3369; font-family:Georgia,"Times New Roman",serif; font-weight:600; }' +
      '.chip{ background:#FFF3E0; color:#B45F06; border:1px solid #F9D29B; border-radius:999px; padding:4px 12px; font-size:11px; font-weight:700; }' +
      '.cards{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }' +
      '.card{ border:1px solid #DCE3EA; border-radius:10px; overflow:hidden; }' +
      '.card h3{ margin:0; padding:7px 12px; background:#0A3369; color:#fff; font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; }' +
      '.kv{ display:grid; grid-template-columns:104px 1fr; }' +
      '.kv div{ padding:6px 12px; border-bottom:1px solid #EEF2F6; font-size:11.5px; }' +
      '.kv .k{ color:#5B6B7C; background:#F7F9FB; }' +
      '.kv .v{ font-weight:600; }' +
      '.kv div:nth-last-child(-n+2){ border-bottom:0; }' +
      '.muted{ color:#9AA7B4; font-weight:400; }' +
      'table.mat{ width:100%; border-collapse:collapse; font-size:11.5px; border:1px solid #DCE3EA; border-radius:10px; overflow:hidden; }' +
      'table.mat th{ background:#0A3369; color:#fff; padding:8px 10px; text-align:right; font-size:10.5px; letter-spacing:.4px; }' +
      'table.mat th.l, table.mat td.l{ text-align:left; }' +
      'table.mat td{ padding:7px 10px; text-align:right; border-bottom:1px solid #EEF2F6; font-variant-numeric:tabular-nums; }' +
      'table.mat tbody tr:nth-child(even) td{ background:#F7F9FB; }' +
      'table.mat td.b{ font-weight:700; color:#0A3369; }' +
      'table.mat tfoot td{ background:#EAF0F8; border-top:2px solid #0A3369; border-bottom:0; font-weight:800; color:#0A3369; padding:9px 10px; }' +
      '.kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:14px 0 4px; }' +
      '.kpi{ border:1px solid #DCE3EA; border-radius:10px; padding:10px 12px; }' +
      '.kpi .kl{ font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:#5B6B7C; }' +
      '.kpi .kv2{ font-size:17px; font-weight:800; color:#0A3369; margin-top:3px; font-variant-numeric:tabular-nums; }' +
      '.kpi.pay{ background:#0A3369; border-color:#0A3369; }' +
      '.kpi.pay .kl{ color:#BBD0EE; } .kpi.pay .kv2{ color:#fff; }' +
      '.sign{ display:grid; grid-template-columns:1fr 1fr; gap:48px; margin-top:64px; }' +
      '.sign div{ border-top:1.5px solid #1B2733; padding-top:6px; text-align:center; font-size:11px; color:#5B6B7C; }' +
      '.sign b{ display:block; color:#1B2733; font-size:11.5px; }' +
      '.foot{ margin-top:26px; padding-top:8px; border-top:1px solid #DCE3EA; display:flex; justify-content:space-between; gap:12px; font-size:9.5px; color:#9AA7B4; }' +
      '.bar{ position:sticky; top:0; background:#0A3369; color:#fff; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; font-size:12px; }' +
      '.bar button{ background:#F2941F; color:#fff; border:0; border-radius:8px; padding:7px 16px; font-weight:700; cursor:pointer; }' +
      '@media print{ .bar{ display:none; } }';

    var html = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Balance de masas ' + esc(doc.numero) + '</title><style>' + css + '</style></head><body>' +
      '<div class="bar"><span>Vista previa del comprobante — en el diálogo de impresión elige "Guardar como PDF".</span><button onclick="window.print()">Imprimir / Guardar PDF</button></div>' +
      '<div class="page">' +
      '<div class="top"><div class="org">' + logoHtml +
        '<div><h2>' + esc(orgName) + '</h2>' + (centro.nit ? '<div class="nit">NIT ' + esc(centro.nit) + '</div>' : '') +
        (contacto ? '<div class="contact">' + contacto + '</div>' : '') + '</div></div>' +
        '<div class="ref"><div class="kind">Comprobante N°</div><div class="num">' + esc(doc.numero) + '</div>' +
        '<div class="date">' + esc(doc.diaSemana) + ', ' + esc(formatDateStrLocal(doc.fecha)) + '</div></div></div>' +
      '<div class="title"><h1>Balance de masas</h1><span class="chip">Material recibido</span></div>' +
      '<div class="cards">' +
        '<div class="card"><h3>Reciclador de oficio</h3><div class="kv">' +
          '<div class="k">Nombre</div><div class="v">' + dash(doc.reciclador.nombre) + '</div>' +
          '<div class="k">Cédula</div><div class="v">' + dash(doc.reciclador.documento) + '</div>' +
          '<div class="k">Tipo vehículo</div><div class="v">' + dash(doc.reciclador.vehiculo) + '</div>' +
          '<div class="k">Placa</div><div class="v">' + dash(doc.reciclador.placa) + '</div></div></div>' +
        '<div class="card"><h3>Operación</h3><div class="kv">' +
          '<div class="k">NUECA (ECA)</div><div class="v">' + dash(doc.eca) + '</div>' +
          '<div class="k">NUMACRO</div><div class="v">' + dash(doc.macrorruta) + '</div>' +
          '<div class="k">Microrruta 1</div><div class="v">' + dash(doc.micro1) + '</div>' +
          '<div class="k">Microrruta 2</div><div class="v">' + dash(doc.micro2) + '</div></div></div>' +
      '</div>' +
      '<table class="mat"><thead><tr><th class="l">Material</th><th>Cantidad (kg)</th><th>Valor / kg</th><th>Total</th><th>Rechazo (kg)</th><th>No SUI (kg)</th></tr></thead><tbody>' + body + '</tbody>' +
      '<tfoot><tr><td class="l">Total</td><td>' + num(doc.tot.cantidad, 2) + '</td><td></td><td>' + money(doc.tot.valorTotal) + '</td><td>' + num(doc.tot.rechazo, 2) + '</td><td>' + num(doc.tot.nosui, 2) + '</td></tr></tfoot></table>' +
      '<div class="kpis">' +
        '<div class="kpi"><div class="kl">Material recibido</div><div class="kv2">' + num(doc.tot.cantidad, 2) + ' kg</div></div>' +
        '<div class="kpi"><div class="kl">Rechazo</div><div class="kv2">' + num(doc.tot.rechazo, 2) + ' kg</div></div>' +
        '<div class="kpi"><div class="kl">No SUI</div><div class="kv2">' + num(doc.tot.nosui, 2) + ' kg</div></div>' +
        '<div class="kpi pay"><div class="kl">Total a pagar</div><div class="kv2">' + money(doc.tot.valorTotal) + '</div></div>' +
      '</div>' +
      '<div class="sign"><div><b>' + esc(doc.reciclador.nombre) + '</b>C.C. ' + esc(doc.reciclador.documento) + ' — Reciclador</div><div><b>' + esc(orgName) + '</b>Responsable de la ECA</div></div>' +
      '<div class="foot"><span>Generado el ' + esc(generado) + ' &nbsp;·&nbsp; Ref. ' + esc(doc.numero) + '</span><span>Genesis Traza — Módulo Pruebas: comprobante de prueba, sin validez como factura.</span></div>' +
      '</div></body></html>';

    win.document.open();
    win.document.write(html);
    win.document.close();
    win.focus();
    // Imprime cuando el logo termino de cargar (o falla); tope de 4 s para no quedar colgado.
    var printed = false;
    var doPrint = function(){ if(printed || win.closed) return; printed = true; win.print(); };
    var img = win.document.querySelector('img.logo');
    if(img && !img.complete){
      img.onload = img.onerror = function(){ setTimeout(doPrint, 100); };
      setTimeout(doPrint, 4000);
    } else {
      setTimeout(doPrint, 350);
    }
  }

  if(session) initPruebasPage();
</script>
</body>
</html>
