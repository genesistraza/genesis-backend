<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pruebas — Trazabilidad nativa | Genesis Traza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .pruebas-shell{ max-width:1280px;margin:0 auto;padding:20px 24px 40px; }
  .pruebas-header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--line);
  }
  .pruebas-header h1{ margin:0;font-size:19px; }
  .pruebas-header .tag{ display:inline-block;margin-left:10px;font-size:11px;font-weight:700;color:var(--orange);
    background:rgba(242,148,31,.12);padding:2px 9px;border-radius:20px;vertical-align:middle; }
  .pruebas-nav{
    display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  }
  .pruebas-nav .form-field{ margin:0;min-width:280px;flex:1; }
  .pruebas-nav .form-field label{ font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft); }
  .pruebas-hint{ margin:0;color:var(--ink-soft);font-size:12.5px;flex-basis:100%; }
  .pruebas-toolbar{ display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px; }
  .pruebas-toolbar .spacer{ flex:1; }
  .pruebas-toolbar .btn{ font-size:12.5px;padding:8px 14px; }
  .pruebas-badge{ font-size:11.5px;color:var(--ink-soft);background:var(--bg-soft, #F3F5F8);border-radius:20px;padding:4px 11px; }
  .pruebas-msg{ font-size:12.5px;margin-top:8px; }
  @media print{
    body *{ visibility:hidden; }
    .print-area, .print-area *{ visibility:visible; }
    .print-area{ position:absolute;left:0;top:0;width:100%; }
    .no-print{ display:none !important; }
  }
</style>
</head>
<body>

<div id="gtPageLoader">
  <div class="gt-loader-mark">
    <div class="gt-spinner"></div>
    <span>Cargando…</span>
  </div>
</div>

<div class="pruebas-shell">
  <div class="pruebas-header no-print">
    <h1>Trazabilidad nativa <span class="tag">Pruebas</span></h1>
    <a class="btn" href="admin.html">← Volver al panel</a>
  </div>

  <div class="pruebas-nav no-print">
    <div class="form-field">
      <label>Módulo</label>
      <select id="pruebasEntitySelect" onchange="onPruebasEntitySelectChange()"></select>
    </div>
    <p class="pruebas-hint" id="pruebasEntityHint"></p>
  </div>

  <div class="panel" id="pruebasBalanceMasasEnv" style="display:none;">
    <div class="pruebas-toolbar no-print">
      <h2 style="margin:0;font-size:16px;">Balance de Masas</h2>
      <span class="spacer"></span>
      <button type="button" class="btn" onclick="printCurrentView()">Imprimir / PDF</button>
      <button type="button" class="btn" onclick="exportBmExcel()">Exportar Excel</button>
      <button type="button" class="btn" onclick="exportBmCsv(',')">Exportar CSV</button>
      <button type="button" class="btn" onclick="exportBmCsv(';')">Exportar CSV (;)</button>
    </div>
    <div class="form-field no-print" style="max-width:420px;">
      <label>Buscar reciclador (nombre o cédula)</label>
      <input id="bmBuscarReciclador" placeholder="Escribe para buscar…" oninput="onBmBuscarRecicladorInput()" autocomplete="off">
    </div>
    <div id="bmRecicladorResultados" class="table-scroll no-print" style="max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;display:none;"></div>

    <div id="bmRecicladorSeleccionado" style="display:none;margin-top:18px;">
      <div class="print-area">
        <div class="form-grid">
          <div class="form-field"><label>Nombre</label><input id="bmNombre" disabled></div>
          <div class="form-field"><label>Cédula</label><input id="bmCedula" disabled></div>
          <div class="form-field"><label>Tipo vehículo</label><input id="bmTipoVehiculo" disabled></div>
          <div class="form-field"><label>Placa</label><input id="bmPlaca" disabled></div>
          <div class="form-field"><label>Bodega (NUECA)</label><select id="bmBodega"><option value="">— Ninguna —</option></select></div>
          <div class="form-field"><label>Zona (NUMACRO)</label><select id="bmNumacro"><option value="">— Ninguna —</option></select></div>
          <div class="form-field"><label>Fecha</label><input type="date" id="bmFecha" onchange="loadBmDia()"></div>
        </div>

        <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px;">
          <h2 style="margin:0;font-size:15px;">Materiales del día</h2>
          <select id="bmFamiliaFilter" class="period-value-select no-print" onchange="renderBmGrid()" style="max-width:240px;"></select>
        </div>
        <div class="table-scroll" style="margin-top:10px;">
          <table class="data-table">
            <thead><tr><th>Material</th><th>Cantidad (kg)</th><th>Valor</th><th>Cant. rechazo</th><th>Cant. no SUI</th></tr></thead>
            <tbody id="bmGridBody"></tbody>
          </table>
        </div>
      </div>
      <button class="btn btn-primary no-print" style="margin-top:16px;" onclick="saveBmDia()">Guardar</button>
      <p class="pruebas-msg no-print" id="bmSaveMsg"></p>
    </div>
  </div>

  <div class="panel" id="pruebasGenericView">
    <div class="pruebas-toolbar no-print">
      <h2 id="pruebasEntityTitle" style="margin:0;font-size:16px;">Elige un módulo</h2>
      <span class="pruebas-badge" id="pruebasRowCount"></span>
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary" onclick="openPruebasFormModal()">Nuevo registro</button>
      <button type="button" class="btn" onclick="document.getElementById('pruebasImportInput').click()">Importar</button>
      <input type="file" id="pruebasImportInput" accept=".xlsx,.xls,.csv" style="display:none;" onchange="onPruebasImportFile(this)">
      <button type="button" class="btn" onclick="downloadPruebasTemplate()">Plantilla</button>
      <button type="button" class="btn" onclick="printCurrentView()">Imprimir / PDF</button>
      <button type="button" class="btn" onclick="exportPruebasExcel()">Exportar Excel</button>
      <button type="button" class="btn" onclick="exportPruebasCsv()">Exportar CSV</button>
    </div>
    <p class="pruebas-msg no-print" id="pruebasImportMsg"></p>
    <div class="table-scroll print-area">
      <table class="data-table">
        <thead id="pruebasTableHead"></thead>
        <tbody id="pruebasTableBody"><tr><td class="empty-row">Cargando…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal: formulario dinamico del modulo Pruebas -->
<div class="modal-overlay" id="pruebasFormModalOverlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closePruebasFormModal()">&times;</button>
    <div class="modal-scroll">
      <h3 id="pruebasFormModalTitle">Nuevo registro</h3>
      <input type="hidden" id="pruebasFormId">
      <div class="form-grid" id="pruebasFormFields" style="margin-top:18px;"></div>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="savePruebasRecord()">Guardar</button>
      <p id="pruebasFormError" style="display:none;color:#C0392B;font-size:13px;margin-top:10px;"></p>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  var session = gtRequireAuth(['pro']);

  // Agrupa los modulos en el desplegable para que sea facil de recorrer (mismo criterio que
  // el sistema de trazabilidad original: catalogos, recicladores, operacion, usuarios/cobro, PQR).
  var ENTITY_GROUPS = [
    { label: 'Catálogos y estructura', keys: ['centros', 'bodegas', 'localidades', 'numacros', 'tipos_material'] },
    { label: 'Recicladores y formalización', keys: ['recicladores', 'formalizacion_fases', 'seguridad_social'] },
    { label: 'Operación diaria', keys: ['balance_masas', 'macrorrutas', 'microrrutas', 'microrrutas_detalle'] },
    { label: 'Usuarios y aprovechamiento', keys: ['usuarios', 'aprovechamiento', 'recursos'] },
    { label: 'Comercial y pagos', keys: ['ventas', 'pago_seguridad', 'pago_tarifa'] },
    { label: 'Atención al usuario', keys: ['pqr'] }
  ];

  var ENTITY_HINTS = {
    centros: 'Datos de la asociación/prestador: código, nombre y su registro RUP/ECA.',
    bodegas: 'Sitios de acopio (NUECA) donde entra el material recolectado.',
    localidades: 'Localidades de Bogotá usadas para ubicar numacros y usuarios.',
    numacros: 'Zonas operativas (NUMACRO) dentro de cada centro.',
    tipos_material: 'Catálogo de materiales aprovechables y su familia.',
    recicladores: 'Base de datos de recicladores de oficio del centro.',
    balance_masas: 'Registro diario de material recibido por reciclador (tiene su propio entorno).',
    macrorrutas: 'Macrorrutas de recolección — Balance de Masas se asocia a una para calcular el DINC.',
    formalizacion_fases: 'Checklist de las 8 fases de formalización del Decreto 596/2016.',
    pqr: 'Registro de peticiones, quejas y reclamos de usuarios.',
    seguridad_social: 'Afiliación a EPS/ARL y aportes a BEPS de cada reciclador (Decreto 271/2026).',
    microrrutas: 'Microrrutas de recolección asignadas a un reciclador.',
    microrrutas_detalle: 'Detalle operativo (horarios, distancias, tipo de barrido) de cada microrruta.',
    usuarios: 'Base de usuarios del servicio (SUI): NUIS/NUID, uso, tipo, ubicación.',
    aprovechamiento: 'Toneladas de aprovechamiento por usuario y periodo, para el cobro tarifario.',
    recursos: 'Recursos/operadores asociados al NUAP.',
    ventas: 'Ventas de material a compradores, con IVA y origen del residuo.',
    pago_seguridad: 'Pagos hechos a recicladores por concepto de seguridad social.',
    pago_tarifa: 'Pagos hechos a recicladores por concepto de tarifa de aprovechamiento.'
  };

  function initPruebasPage(){
    var loader = document.getElementById('gtPageLoader');
    if(loader) loader.classList.add('hidden');
    loadPruebasTab();
  }

  function printCurrentView(){ window.print(); }

  // ---- Pruebas: trazabilidad nativa (sandbox, tablas tz_*) ----
  var pruebasEntities = null;
  var pruebasCurrentEntity = null;
  var pruebasCurrentRows = [];
  var pruebasOptionsCache = {};

  function loadPruebasTab(){
    if(pruebasEntities){ renderPruebasEntitySelect(); return; }
    gtApiFetch('/trazabilidad/entities').then(function(res){
      if(!res.ok) return;
      pruebasEntities = res.data;
      renderPruebasEntitySelect();
    });
  }

  function renderPruebasEntitySelect(){
    var sel = document.getElementById('pruebasEntitySelect');
    sel.innerHTML = '';
    ENTITY_GROUPS.forEach(function(group){
      var keys = group.keys.filter(function(k){ return pruebasEntities[k]; });
      if(keys.length === 0) return;
      var optgroup = document.createElement('optgroup');
      optgroup.label = group.label;
      keys.forEach(function(key){
        var opt = document.createElement('option');
        opt.value = key;
        opt.textContent = pruebasEntities[key].label;
        optgroup.appendChild(opt);
      });
      sel.appendChild(optgroup);
    });
    pruebasCurrentEntity = pruebasCurrentEntity || sel.querySelector('option').value;
    sel.value = pruebasCurrentEntity;
    selectPruebasEntity(pruebasCurrentEntity);
  }

  function onPruebasEntitySelectChange(){
    selectPruebasEntity(document.getElementById('pruebasEntitySelect').value);
  }

  function selectPruebasEntity(key){
    pruebasCurrentEntity = key;
    document.getElementById('pruebasEntityHint').textContent = ENTITY_HINTS[key] || '';
    var isBalanceMasas = key === 'balance_masas';
    document.getElementById('pruebasBalanceMasasEnv').style.display = isBalanceMasas ? 'block' : 'none';
    document.getElementById('pruebasGenericView').style.display = isBalanceMasas ? 'none' : 'block';
    if(isBalanceMasas){ initBmEnv(); return; }
    fetchAndRenderPruebasTable();
  }

  function fetchAndRenderPruebasTable(){
    var entity = pruebasEntities[pruebasCurrentEntity];
    document.getElementById('pruebasEntityTitle').textContent = entity.label;
    document.getElementById('pruebasImportMsg').textContent = '';
    gtApiFetch('/trazabilidad/' + pruebasCurrentEntity).then(function(res){
      var thead = document.getElementById('pruebasTableHead');
      var tbody = document.getElementById('pruebasTableBody');
      if(!res.ok){ tbody.innerHTML = '<tr><td class="empty-row">No se pudo cargar.</td></tr>'; return; }
      pruebasCurrentRows = res.data;
      document.getElementById('pruebasRowCount').textContent = res.data.length + (res.data.length === 1 ? ' registro' : ' registros');

      var headHtml = '<tr>';
      entity.fields.forEach(function(f){ headHtml += '<th>' + f.label + '</th>'; });
      headHtml += '<th class="no-print"></th></tr>';
      thead.innerHTML = headHtml;

      if(res.data.length === 0){
        tbody.innerHTML = '<tr><td class="empty-row" colspan="' + (entity.fields.length + 1) + '">Sin registros todavía.</td></tr>';
        return;
      }
      tbody.innerHTML = '';
      res.data.forEach(function(row){
        var tr = document.createElement('tr');
        var html = '';
        entity.fields.forEach(function(f){
          var val = (f.type === 'select-entity' || f.type === 'select-catalogo') ? row[f.name + '_label'] : row[f.name];
          if(f.type === 'date' && val) val = gtFormatDate(val);
          html += '<td>' + (val === null || val === undefined || val === '' ? '—' : String(val)) + '</td>';
        });
        html += '<td class="no-print"><button type="button" class="cell-action" style="margin-right:10px;">Editar</button><button type="button" class="cell-action" style="color:#C0392B;">Eliminar</button></td>';
        tr.innerHTML = html;
        var actions = tr.lastElementChild.querySelectorAll('.cell-action');
        actions[0].addEventListener('click', function(){ openPruebasFormModal(row); });
        actions[1].addEventListener('click', function(){ deletePruebasRecord(row.id); });
        tbody.appendChild(tr);
      });
    });
  }

  function deletePruebasRecord(id){
    if(!confirm('¿Eliminar este registro de prueba?')) return;
    gtApiFetch('/trazabilidad/' + pruebasCurrentEntity + '/' + id, { method: 'DELETE' }).then(function(){ fetchAndRenderPruebasTable(); });
  }

  function getPruebasFieldOptions(field, callback){
    var cacheKey = pruebasCurrentEntity + ':' + field.name;
    if(pruebasOptionsCache[cacheKey]){ callback(pruebasOptionsCache[cacheKey]); return; }
    var url = field.type === 'select-catalogo'
      ? '/trazabilidad/catalogo-options/' + field.categoria
      : '/trazabilidad/' + field.entity + '/options?labelField=' + encodeURIComponent(field.labelField);
    gtApiFetch(url).then(function(res){
      var opts = res.ok ? res.data : [];
      pruebasOptionsCache[cacheKey] = opts;
      callback(opts);
    });
  }

  function openPruebasFormModal(existingRow){
    var entity = pruebasEntities[pruebasCurrentEntity];
    document.getElementById('pruebasFormModalTitle').textContent = (existingRow ? 'Editar — ' : 'Nuevo — ') + entity.label;
    document.getElementById('pruebasFormId').value = existingRow ? existingRow.id : '';
    document.getElementById('pruebasFormError').style.display = 'none';
    var container = document.getElementById('pruebasFormFields');
    container.innerHTML = '';

    entity.fields.forEach(function(f){
      var wrap = document.createElement('div');
      wrap.className = 'form-field';
      var label = document.createElement('label');
      label.textContent = f.label + (f.required ? ' *' : '');
      wrap.appendChild(label);

      var inputId = 'pruebasField_' + f.name;
      var input;
      if(f.type === 'select-entity' || f.type === 'select-catalogo'){
        input = document.createElement('select');
        input.id = inputId;
        input.innerHTML = '<option value="">Cargando…</option>';
        getPruebasFieldOptions(f, function(opts){
          input.innerHTML = '<option value="">— Ninguno —</option>' + opts.map(function(o){ return '<option value="' + o.value + '">' + o.label + '</option>'; }).join('');
          if(existingRow && existingRow[f.name] !== null && existingRow[f.name] !== undefined){
            input.value = existingRow[f.name];
          }
        });
      } else {
        input = document.createElement('input');
        input.id = inputId;
        input.type = f.type === 'date' ? 'date' : (f.type === 'number' || f.type === 'decimal' ? 'number' : 'text');
        if(f.type === 'decimal') input.step = '0.0001';
        if(existingRow && existingRow[f.name] !== null && existingRow[f.name] !== undefined){
          input.value = f.type === 'date' ? String(existingRow[f.name]).slice(0, 10) : existingRow[f.name];
        }
      }
      wrap.appendChild(input);
      container.appendChild(wrap);
    });

    document.getElementById('pruebasFormModalOverlay').classList.add('open');
  }

  function closePruebasFormModal(){
    document.getElementById('pruebasFormModalOverlay').classList.remove('open');
  }

  function savePruebasRecord(){
    var entity = pruebasEntities[pruebasCurrentEntity];
    var id = document.getElementById('pruebasFormId').value;
    var body = {};
    entity.fields.forEach(function(f){
      var el = document.getElementById('pruebasField_' + f.name);
      body[f.name] = el.value === '' ? null : el.value;
    });
    var errorEl = document.getElementById('pruebasFormError');
    errorEl.style.display = 'none';
    gtApiFetch(id ? '/trazabilidad/' + pruebasCurrentEntity + '/' + id : '/trazabilidad/' + pruebasCurrentEntity, {
      method: id ? 'PUT' : 'POST',
      body: JSON.stringify(body)
    }).then(function(res){
      if(!res.ok){ errorEl.textContent = res.data.error || 'No se pudo guardar.'; errorEl.style.display = 'block'; return; }
      closePruebasFormModal();
      fetchAndRenderPruebasTable();
    });
  }

  // ---- Importar / exportar / plantilla para el modulo generico ----
  function onPruebasImportFile(input){
    var file = input.files[0];
    if(!file) return;
    var msg = document.getElementById('pruebasImportMsg');
    msg.style.color = 'var(--ink-soft)';
    msg.textContent = 'Importando…';
    var formData = new FormData();
    formData.append('file', file);
    fetch(API_BASE + '/trazabilidad/' + pruebasCurrentEntity + '/import', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + gtGetToken() },
      body: formData
    }).then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(res){
        input.value = '';
        if(!res.ok){ msg.style.color = '#C0392B'; msg.textContent = res.data.error || 'No se pudo importar.'; return; }
        msg.style.color = 'var(--green)';
        msg.textContent = 'Importados ' + res.data.importados + (res.data.omitidos ? ', omitidos ' + res.data.omitidos + ' (revisa el formato de esas filas).' : '.');
        fetchAndRenderPruebasTable();
      })
      .catch(function(){ msg.style.color = '#C0392B'; msg.textContent = 'No se pudo importar.'; });
  }

  function downloadPruebasTemplate(){
    var entity = pruebasEntities[pruebasCurrentEntity];
    var headers = entity.fields.map(function(f){ return f.label; });
    var example = entity.fields.map(function(f){
      if(f.type === 'select-entity' || f.type === 'select-catalogo') return 'texto exacto de la opción';
      if(f.type === 'date') return '2026-01-31';
      if(f.type === 'number' || f.type === 'decimal') return '0';
      return 'texto';
    });
    var lines = [headers.join(','), example.join(',')];
    downloadBlob(lines.join('\r\n'), 'plantilla_' + pruebasCurrentEntity + '.csv', 'text/csv;charset=utf-8;');
  }

  function exportPruebasCsv(){
    var entity = pruebasEntities[pruebasCurrentEntity];
    if(pruebasCurrentRows.length === 0){ alert('No hay registros para exportar.'); return; }
    var headers = entity.fields.map(function(f){ return f.label; });
    var lines = [headers.join(',')];
    pruebasCurrentRows.forEach(function(row){
      lines.push(entity.fields.map(function(f){
        var val = (f.type === 'select-entity' || f.type === 'select-catalogo') ? row[f.name + '_label'] : row[f.name];
        var v = val === null || val === undefined ? '' : String(val);
        return v.indexOf(',') !== -1 ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(','));
    });
    downloadBlob(lines.join('\r\n'), pruebasCurrentEntity + '.csv', 'text/csv;charset=utf-8;');
  }

  function exportPruebasExcel(){
    var entity = pruebasEntities[pruebasCurrentEntity];
    if(pruebasCurrentRows.length === 0){ alert('No hay registros para exportar.'); return; }
    var headers = entity.fields.map(function(f){ return f.label; });
    var html = '<table><tr>' + headers.map(function(h){ return '<th>' + h + '</th>'; }).join('') + '</tr>' +
      pruebasCurrentRows.map(function(row){
        return '<tr>' + entity.fields.map(function(f){
          var val = (f.type === 'select-entity' || f.type === 'select-catalogo') ? row[f.name + '_label'] : row[f.name];
          return '<td>' + (val === null || val === undefined ? '' : val) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</table>';
    downloadBlob(html, pruebasCurrentEntity + '.xls', 'application/vnd.ms-excel');
  }

  function downloadBlob(content, filename, mime){
    var blob = new Blob(['﻿' + content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---- Entorno propio: Balance de Masas (busca reciclador, llena la grilla del día, guarda) ----
  var bmAllRecicladores = null;
  var bmAllMateriales = null;
  var bmSelectedReciclador = null;
  var bmExistingByMaterial = {};

  function initBmEnv(){
    document.getElementById('bmRecicladorSeleccionado').style.display = 'none';
    document.getElementById('bmRecicladorResultados').style.display = 'none';
    document.getElementById('bmBuscarReciclador').value = '';
    var fechaInput = document.getElementById('bmFecha');
    if(!fechaInput.value) fechaInput.value = new Date().toISOString().slice(0, 10);

    var loadRecicladores = bmAllRecicladores ? Promise.resolve() : gtApiFetch('/trazabilidad/recicladores').then(function(res){ bmAllRecicladores = res.ok ? res.data : []; });
    var loadMateriales = bmAllMateriales ? Promise.resolve() : gtApiFetch('/trazabilidad/tipos_material').then(function(res){ bmAllMateriales = res.ok ? res.data : []; });
    Promise.all([loadRecicladores, loadMateriales]).then(function(){
      var familias = ['--Todos los materiales'].concat(Array.from(new Set(bmAllMateriales.map(function(m){ return m.desc_familia; }))).filter(Boolean));
      var sel = document.getElementById('bmFamiliaFilter');
      sel.innerHTML = familias.map(function(f){ return '<option value="' + f + '">' + f + '</option>'; }).join('');
    });
  }

  function onBmBuscarRecicladorInput(){
    var q = document.getElementById('bmBuscarReciclador').value.trim().toLowerCase();
    var box = document.getElementById('bmRecicladorResultados');
    if(!q || !bmAllRecicladores){ box.style.display = 'none'; return; }
    var matches = bmAllRecicladores.filter(function(r){
      return (r.nombre_completo || '').toLowerCase().indexOf(q) !== -1 || (r.nro_documento || '').toLowerCase().indexOf(q) !== -1;
    }).slice(0, 20);
    if(matches.length === 0){ box.innerHTML = '<p style="padding:10px;color:var(--ink-soft);font-size:13px;">Sin resultados.</p>'; box.style.display = 'block'; return; }
    box.innerHTML = '<table class="data-table"><thead><tr><th>Documento</th><th>Nombre</th><th>Centro</th></tr></thead><tbody>' +
      matches.map(function(r){ return '<tr class="bm-result-row" data-id="' + r.id + '" style="cursor:pointer;"><td>' + r.nro_documento + '</td><td>' + r.nombre_completo + '</td><td>' + (r.id_centro_label || '—') + '</td></tr>'; }).join('') +
      '</tbody></table>';
    box.style.display = 'block';
    box.querySelectorAll('.bm-result-row').forEach(function(row){
      row.addEventListener('click', function(){ selectBmReciclador(Number(row.getAttribute('data-id'))); });
    });
  }

  function selectBmReciclador(id){
    bmSelectedReciclador = bmAllRecicladores.find(function(r){ return r.id === id; });
    if(!bmSelectedReciclador) return;
    document.getElementById('bmBuscarReciclador').value = bmSelectedReciclador.nombre_completo;
    document.getElementById('bmRecicladorResultados').style.display = 'none';
    document.getElementById('bmNombre').value = bmSelectedReciclador.nombre_completo || '';
    document.getElementById('bmCedula').value = bmSelectedReciclador.nro_documento || '';
    document.getElementById('bmTipoVehiculo').value = bmSelectedReciclador.tipo_de_vehiculo || '';
    document.getElementById('bmPlaca').value = bmSelectedReciclador.placa || '';
    document.getElementById('bmRecicladorSeleccionado').style.display = 'block';

    Promise.all([
      gtApiFetch('/trazabilidad/bodegas'),
      gtApiFetch('/trazabilidad/numacros')
    ]).then(function(results){
      var bodegas = (results[0].ok ? results[0].data : []).filter(function(b){ return b.id_centro === bmSelectedReciclador.id_centro; });
      var numacros = (results[1].ok ? results[1].data : []).filter(function(n){ return n.id_centro === bmSelectedReciclador.id_centro; });
      var bodegaSel = document.getElementById('bmBodega');
      bodegaSel.innerHTML = '<option value="">— Ninguna —</option>' + bodegas.map(function(b){ return '<option value="' + b.id + '">' + (b.cod_bodega || '') + ' - ' + (b.desc_bodega || '') + '</option>'; }).join('');
      var numacroSel = document.getElementById('bmNumacro');
      numacroSel.innerHTML = '<option value="">— Ninguna —</option>' + numacros.map(function(n){ return '<option value="' + n.id + '">' + (n.id_localidad_label || n.cod_numacro || '') + '</option>'; }).join('');
      loadBmDia();
    });
  }

  function loadBmDia(){
    if(!bmSelectedReciclador) return;
    var fecha = document.getElementById('bmFecha').value;
    gtApiFetch('/trazabilidad/balance-masas-dia?id_reciclador=' + bmSelectedReciclador.id + '&fecha=' + fecha).then(function(res){
      bmExistingByMaterial = {};
      (res.ok ? res.data : []).forEach(function(row){ bmExistingByMaterial[row.id_tipo_material] = row; });
      renderBmGrid();
    });
  }

  function renderBmGrid(){
    var familia = document.getElementById('bmFamiliaFilter').value;
    var ordenados = bmAllMateriales.slice().sort(function(a,b){ return (a.secuencia_orden || 0) - (b.secuencia_orden || 0); });
    var list = familia === '--Todos los materiales' ? ordenados : ordenados.filter(function(m){ return m.desc_familia === familia; });
    var tbody = document.getElementById('bmGridBody');
    tbody.innerHTML = '';
    list.forEach(function(m){
      var existing = bmExistingByMaterial[m.id] || {};
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + m.desc_tipo_material + '</td>' +
        '<td><input type="number" step="0.0001" style="width:100%;" data-mat="' + m.id + '" data-field="cantidad" value="' + (existing.cantidad || '') + '"></td>' +
        '<td><input type="number" step="0.01" style="width:100%;" data-mat="' + m.id + '" data-field="valor" value="' + (existing.valor || '') + '"></td>' +
        '<td><input type="number" step="0.0001" style="width:100%;" data-mat="' + m.id + '" data-field="cantidad_rechazo" value="' + (existing.cantidad_rechazo || '') + '"></td>' +
        '<td><input type="number" step="0.0001" style="width:100%;" data-mat="' + m.id + '" data-field="cantidad_nosui" value="' + (existing.cantidad_nosui || '') + '"></td>';
      tbody.appendChild(tr);
    });
  }

  function saveBmDia(){
    if(!bmSelectedReciclador) return;
    var inputs = document.querySelectorAll('#bmGridBody input');
    var byMaterial = {};
    inputs.forEach(function(inp){
      var matId = inp.getAttribute('data-mat');
      var field = inp.getAttribute('data-field');
      byMaterial[matId] = byMaterial[matId] || { id_tipo_material: Number(matId) };
      byMaterial[matId][field] = inp.value === '' ? 0 : Number(inp.value);
    });
    var materiales = Object.values(byMaterial);
    var msg = document.getElementById('bmSaveMsg');
    msg.style.color = 'var(--ink-soft)';
    msg.textContent = 'Guardando…';
    gtApiFetch('/trazabilidad/balance-masas-dia', {
      method: 'POST',
      body: JSON.stringify({
        id_centro: bmSelectedReciclador.id_centro,
        id_reciclador: bmSelectedReciclador.id,
        id_numacro: document.getElementById('bmNumacro').value || null,
        id_bodega: document.getElementById('bmBodega').value || null,
        fecha: document.getElementById('bmFecha').value,
        materiales: materiales
      })
    }).then(function(res){
      if(!res.ok){ msg.style.color = '#C0392B'; msg.textContent = res.data.error || 'No se pudo guardar.'; return; }
      msg.style.color = 'var(--green)';
      msg.textContent = 'Guardado (' + res.data.filas + ' materiales con datos).';
      loadBmDia();
    });
  }

  // ---- Exportar Balance de Masas: mismas columnas que el sistema de trazabilidad original ----
  function buildBmExportRows(){
    if(!bmSelectedReciclador) return [];
    var fecha = document.getElementById('bmFecha').value;
    var bodegaSel = document.getElementById('bmBodega');
    var numacroSel = document.getElementById('bmNumacro');
    var nueca = bodegaSel.options[bodegaSel.selectedIndex] ? bodegaSel.options[bodegaSel.selectedIndex].textContent : '';
    var numacro = numacroSel.options[numacroSel.selectedIndex] ? numacroSel.options[numacroSel.selectedIndex].textContent : '';
    var d = new Date(fecha + 'T00:00:00');
    var oneJan = new Date(d.getFullYear(), 0, 1);
    var numeroSemana = Math.ceil((((d - oneJan) / 86400000) + oneJan.getDay() + 1) / 7);

    var rows = [];
    document.querySelectorAll('#bmGridBody tr').forEach(function(tr){
      var material = tr.children[0].textContent;
      var cantidad = Number(tr.querySelector('[data-field="cantidad"]').value || 0);
      var valor = Number(tr.querySelector('[data-field="valor"]').value || 0);
      var rechazo = Number(tr.querySelector('[data-field="cantidad_rechazo"]').value || 0);
      var nosui = Number(tr.querySelector('[data-field="cantidad_nosui"]').value || 0);
      if(!cantidad && !valor && !rechazo && !nosui) return;
      rows.push({
        NUECA: nueca, NUMACRO: numacro, 'Numero de semana': numeroSemana,
        'Tipo ident.': 'CC', 'Nro ident.': bmSelectedReciclador.nro_documento || '',
        placa: bmSelectedReciclador.placa || '', toneladas: (cantidad / 1000),
        'Tipo Material': material, Toneladas_rechazo: (rechazo / 1000),
        'Tipo de destino': 'ECA', 'Número único del sitio de destino': nueca,
        Asociacion: bmSelectedReciclador.id_centro_label || '', fecha: fecha,
        nombre_completo: bmSelectedReciclador.nombre_completo || '',
        valor_kilogramo: valor, valor_total: (valor * cantidad),
        cantidad_rechazo: rechazo, cantidad_nosui: nosui
      });
    });
    return rows;
  }

  function exportBmCsv(sep){
    var rows = buildBmExportRows();
    if(rows.length === 0){ alert('No hay cantidades registradas para exportar.'); return; }
    var headers = Object.keys(rows[0]);
    var lines = [headers.join(sep)];
    rows.forEach(function(r){
      lines.push(headers.map(function(h){
        var v = r[h] === null || r[h] === undefined ? '' : String(r[h]);
        return v.indexOf(sep) !== -1 ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(sep));
    });
    downloadBlob(lines.join('\r\n'), 'balance_masas_' + bmSelectedReciclador.nro_documento + '_' + document.getElementById('bmFecha').value + '.csv', 'text/csv;charset=utf-8;');
  }

  function exportBmExcel(){
    var rows = buildBmExportRows();
    if(rows.length === 0){ alert('No hay cantidades registradas para exportar.'); return; }
    var headers = Object.keys(rows[0]);
    var html = '<table><tr>' + headers.map(function(h){ return '<th>' + h + '</th>'; }).join('') + '</tr>' +
      rows.map(function(r){ return '<tr>' + headers.map(function(h){ return '<td>' + r[h] + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</table>';
    downloadBlob(html, 'balance_masas_' + bmSelectedReciclador.nro_documento + '_' + document.getElementById('bmFecha').value + '.xls', 'application/vnd.ms-excel');
  }

  if(session) initPruebasPage();
</script>
